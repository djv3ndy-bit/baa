<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Access your BaristaMatch café account.">
  <link rel="icon" href="/assets/favicon-32-v2.png">
  <title>Café account — BaristaMatch</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#fffaf3;color:#321708;font-family:Arial,sans-serif}main{width:min(480px,100%);padding:32px;border:1px solid #e3d4c8;border-radius:24px;background:#fff;text-align:center}img{width:52px;height:52px}h1{font:700 32px Georgia,serif}p{color:#746a61;line-height:1.6}.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:12px}a,button{padding:12px 18px;border:1px solid #c9ad99;border-radius:12px;color:#321708;background:#fff;font:700 14px Arial,sans-serif;text-decoration:none;cursor:pointer}[hidden]{display:none!important}
  </style>
</head>
<body>
  <main>
    <a href="/" aria-label="BaristaMatch home"><img src="/assets/favicon-transparent-v2.png" alt=""></a>
    <h1>Your café account</h1>
    <p id="status" role="status">Checking your account…</p>
    <div class="actions"><button id="retry" type="button" hidden>Try again</button><a href="/login.html">Log in</a><a href="/signup.html?role=cafe_owner_manager">Create a café account</a></div>
    <noscript><p>Enable JavaScript and log in to access your café account.</p></noscript>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.102.0/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
  <script src="/cafe-account-gate.js"></script>
  <script>
    async function openCafePricing(){
      const status=document.getElementById('status'),retry=document.getElementById('retry');retry.hidden=true;status.textContent='Checking your account…';
      try{const account=await window.BaristaMatchCafeGate.authorize();if(account)location.replace('/dashboard.html?section=subscription')}
      catch(error){status.textContent=error.message||'We could not open your account. Please try again.';retry.hidden=false}
    }
    document.getElementById('retry').onclick=openCafePricing;
    openCafePricing();
  </script>
</body>
</html>
