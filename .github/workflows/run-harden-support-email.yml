name: Run support email hardening
on:
  push:
    paths:
      - '.github/workflows/run-harden-support-email.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/harden-support-email.py
      - run: node --check api/support.js
      - run: |
          grep -q "'question'" api/support.js
          grep -q 'resendWithRetry' api/support.js
          grep -q 'confirmation_sent' support.html
      - run: |
          git config user.name "BaristaMatch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add api/support.js support.html
          git commit -m "Harden support confirmation email delivery"
          git push