name: Mobile stat spacing
on:
  push:
    paths: ['.github/workflows/mobile-stat-spacing.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/mobile-stat-spacing.py
      - run: |
          grep -q 'Mobile stat-card spacing hardening' dashboard.html
          grep -q 'margin-top:24px' dashboard.html
          git config user.name "BaristaMatch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.html
          git commit -m "Fix mobile stat card label and chart spacing"
          git push
