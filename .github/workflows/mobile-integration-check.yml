name: Mobile MVP integration
on:
  push:
    paths:
      - '.github/workflows/mobile-integration-check.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/mobile-integrate.py
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Typecheck mobile app
        working-directory: mobile
        run: npm run typecheck
      - name: Commit integration
        run: |
          git config user.name "BaristaMatch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add mobile/app/discover.tsx mobile/app/home.tsx mobile/package-lock.json
          git commit -m "Connect mobile MVP navigation"
          git push