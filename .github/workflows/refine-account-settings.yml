name: Refine account settings
on:
  push:
    paths:
      - '.github/workflows/refine-account-settings.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine account settings layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dashboard.html')
          s=p.read_text()
          start=s.index('function accountSettingsHtml(){')
          end=s.index('\nObject.defineProperty(sectionPages.barista,\'Account Settings\'', start)
          new_func=r'''function accountSettingsHtml(){
  const hasEmailLogin=(currentUser.identities||[]).some(identity=>identity.provider==='email');
  const passwordSection=hasEmailLogin?`<details class="card settings-card password-settings"><summary><span><strong>Change password</strong><small>Update your BaristaMatch login password</small></span><span class="settings-chevron">›</span></summary><div class="password-settings-body"><form id="password-form"><label>New password<input name="new_password" type="password" autocomplete="new-password" minlength="10" required></label><label>Confirm new password<input name="confirm_password" type="password" autocomplete="new-password" minlength="10" required></label><p class="empty">Use at least 10 characters with uppercase, lowercase, a number, and a symbol.</p><button class="primary" type="submit">Save new password</button><p class="form-status" id="password-status" role="status"></p></form></div></details>`:`<article class="card settings-card password-settings google-password-card"><div><h3>Password & security</h3><p>Your account signs in with Google. Password changes are managed securely in your Google Account.</p></div><a class="secondary" href="https://myaccount.google.com/security" target="_blank" rel="noopener noreferrer">Open Google security</a></article>`;
  const createdAt=Date.parse(currentUser?.created_at||'');
  const canDelete=Number.isFinite(createdAt)&&(Date.now()-createdAt)>=7*24*60*60*1000;
  const subscriptionSection=currentRole==='cafe_owner_manager'?`<article class="card settings-card subscription-management-card"><div class="subscription-management-copy"><span class="subscription-management-icon" aria-hidden="true">◇</span><div><h3>Subscription management</h3><p>Review your café plan, free-trial details, and subscription options.</p></div></div><button class="secondary" type="button" data-go="Pricing & Subscription">View subscription</button></article>`:'';
  const helpSupportSection=`<article class="card settings-card help-support-card"><div class="help-support-copy"><span class="help-support-icon" aria-hidden="true">?</span><div><h3>Help & Support</h3><p>Need help, have a question, or found something that is not working? Contact BaristaMatch Support.</p></div></div><div class="help-support-actions"><a class="secondary" href="/support.html?type=question">Ask a question</a><a class="primary" href="/support.html?type=bug">Report a problem</a></div></article>`;
  const accountActionsSection=`<article class="card settings-card account-actions-card"><div><h3>Account</h3><p>Manage your account session and sign out securely.</p></div><button class="secondary account-logout-button" type="button" data-account-logout>Log out</button></article>`;
  const notificationSection=`<article class="card settings-card notification-card"><div><h3>Notifications</h3><p>Unread-message badges and email alerts are on. Browser alerts can also appear while BaristaMatch is open.</p><div class="notification-hint" id="notification-permission">Browser notifications: ${typeof Notification==='undefined'?'not supported':Notification.permission}</div></div><button class="secondary" type="button" data-enable-notifications>${typeof Notification!=='undefined'&&Notification.permission==='granted'?'Enabled':'Enable'}</button></article>`;
  const advancedSettings=canDelete?`<details class="card settings-card advanced-settings"><summary>Advanced settings</summary><div class="advanced-body"><h3 style="margin-top:20px;color:#8c251d">Close account</h3><p>Permanently deleting your BaristaMatch account removes your profile, job activity, applications, and account data. This cannot be undone.</p><button class="danger-button" type="button" data-delete-account>Continue to account deletion</button></div></details>`:'';
  return `<div class="section-head"><div><h2>Account Settings</h2><p>Manage your login and account safely.</p></div></div><div class="settings-stack"><article class="card settings-card login-details-card"><h3>Login details</h3><p class="account-email">${escapeHtml(currentUser.email||'')}</p></article>${subscriptionSection}${notificationSection}${passwordSection}${helpSupportSection}${accountActionsSection}${advancedSettings}</div>`
}'''
          s=s[:start]+new_func+s[end:]

          old_change="async function changePassword(event){event.preventDefault();const form=event.currentTarget,button=form.querySelector('[type=\"submit\"]'),status=form.querySelector('#password-status'),data=new FormData(form),current=String(data.get('current_password')),next=String(data.get('new_password')),confirm=String(data.get('confirm_password'));status.textContent='';if(next!==confirm){status.textContent='The new passwords do not match.';return}if(next.length<10||!/[a-z]/.test(next)||!/[A-Z]/.test(next)||!/[0-9]/.test(next)||! /[^A-Za-z0-9]/.test(next)){status.textContent='Use 10 or more characters with uppercase, lowercase, a number, and a symbol.';return}button.disabled=true;button.textContent='Changing…';try{const {error}=await activeClient.auth.updateUser({password:next,currentPassword:current});if(error)throw error;form.reset();status.textContent='Your password has been changed successfully.'}catch(error){status.textContent=error.message||'We could not change your password. Check your current password and try again.'}finally{button.disabled=false;button.textContent='Change password'}}"
          new_change="async function changePassword(event){event.preventDefault();const form=event.currentTarget,button=form.querySelector('[type=\"submit\"]'),status=form.querySelector('#password-status'),data=new FormData(form),next=String(data.get('new_password')),confirm=String(data.get('confirm_password'));status.textContent='';if(next!==confirm){status.textContent='The new passwords do not match.';return}if(next.length<10||!/[a-z]/.test(next)||!/[A-Z]/.test(next)||!/[0-9]/.test(next)||! /[^A-Za-z0-9]/.test(next)){status.textContent='Use 10 or more characters with uppercase, lowercase, a number, and a symbol.';return}button.disabled=true;button.textContent='Saving…';try{const {error}=await activeClient.auth.updateUser({password:next});if(error)throw error;form.reset();status.textContent='Your password has been changed successfully.'}catch(error){status.textContent=error.message||'We could not change your password. Please try again.'}finally{button.disabled=false;button.textContent='Save new password'}}"
          if old_change not in s: raise SystemExit('changePassword marker missing')
          s=s.replace(old_change,new_change,1)

          bind_marker="content.querySelectorAll('[data-enable-notifications]').forEach(button=>button.onclick=()=>enableBrowserNotifications(button));"
          bind_new=bind_marker+"const passwordForm=content.querySelector('#password-form');if(passwordForm)passwordForm.onsubmit=changePassword;"
          if bind_marker not in s: raise SystemExit('bind marker missing')
          if 'passwordForm.onsubmit=changePassword' not in s:
            s=s.replace(bind_marker,bind_new,1)

          css=r'''
.password-settings{padding:0;overflow:hidden}.password-settings>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px;cursor:pointer}.password-settings>summary::-webkit-details-marker{display:none}.password-settings>summary span:first-child{display:grid;gap:5px}.password-settings>summary strong{font-size:18px;color:var(--brown)}.password-settings>summary small{font-size:13px;color:var(--muted);font-weight:500}.settings-chevron{font-size:28px;color:var(--caramel);transition:transform .2s}.password-settings[open] .settings-chevron{transform:rotate(90deg)}.password-settings-body{padding:0 20px 20px;border-top:1px solid var(--line)}.password-settings-body form{display:grid;gap:14px;padding-top:18px}.password-settings-body label{font-size:13px;font-weight:800}.password-settings-body input{display:block;width:100%;margin-top:7px;padding:13px;border:1px solid var(--line);border-radius:11px;background:#fff}.subscription-management-card{display:flex;align-items:center;justify-content:space-between;gap:18px}.subscription-management-copy{display:flex;align-items:flex-start;gap:14px}.subscription-management-icon{width:42px;height:42px;border-radius:13px;background:#f3e6dc;color:var(--brown);display:grid;place-items:center;font-size:24px;font-weight:900;flex:0 0 auto}.subscription-management-card h3{margin:0 0 6px}.subscription-management-card p{margin:0;color:var(--muted);line-height:1.5}.login-details-card h3{margin-bottom:10px}.login-details-card .account-email{margin:0;font-weight:800;color:var(--brown);overflow-wrap:anywhere}.google-password-card{display:flex;align-items:center;justify-content:space-between;gap:16px}.google-password-card h3{margin:0 0 6px}.google-password-card p{margin:0;color:var(--muted);line-height:1.5}@media(max-width:560px){.subscription-management-card,.google-password-card{align-items:stretch;display:grid}.subscription-management-card button,.google-password-card a{width:100%;text-align:center}.password-settings>summary{padding:18px}.password-settings-body{padding:0 18px 18px}}
'''
          if '.password-settings{' not in s:
            s=s.replace('</style>',css+'\n</style>',1)
          p.write_text(s)
          PY
      - name: Verify settings cleanup
        run: |
          grep -q 'Subscription management' dashboard.html
          grep -q 'password-settings' dashboard.html
          grep -q 'passwordForm.onsubmit=changePassword' dashboard.html
          ! grep -q 'name="current_password"' dashboard.html
          node -e "const fs=require('fs');const s=fs.readFileSync('dashboard.html','utf8');const js=s.match(/<script>[\s\S]*<\/script>/g); if(!js) process.exit(1)"
      - name: Commit settings refinement
        run: |
          git config user.name "BaristaMatch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.html
          git commit -m "Simplify account settings and add subscription management"
          git push