name: Upgrade professional messaging inbox
on:
  push:
    paths:
      - '.github/workflows/upgrade-messaging-inbox.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade messaging UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dashboard.html')
          s=p.read_text()

          css_marker='.message-empty{color:var(--muted);text-align:center;padding:24px 8px}'
          css_add=css_marker+'''\n.messages-workspace{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:620px;background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 14px 38px #32170810}.conversation-sidebar{border-right:1px solid var(--line);background:#fff}.conversation-sidebar-head{padding:20px;border-bottom:1px solid var(--line)}.conversation-sidebar-head h3{margin:0 0 4px;font-size:20px}.conversation-sidebar-head p{margin:0;color:var(--muted);font-size:13px}.conversation-list{display:grid}.conversation-row{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;align-items:center;width:100%;border:0;border-bottom:1px solid #f0e7df;background:#fff;padding:15px 16px;text-align:left;color:var(--brown)}.conversation-row:hover,.conversation-row.active{background:#fbf3ec}.conversation-avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#f3e6dc;font-size:22px}.conversation-copy{min-width:0}.conversation-copy strong,.conversation-copy small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.conversation-copy strong{font-size:15px}.conversation-copy small{color:var(--muted);margin-top:4px;font-size:12px}.chat-panel{display:flex;flex-direction:column;min-width:0;background:linear-gradient(180deg,#fbf7f1 0%,#f7f0e9 100%)}.chat-placeholder{margin:auto;text-align:center;padding:34px;color:var(--muted)}.chat-placeholder .avatar{margin:0 auto 14px}.chat-header{display:flex;align-items:center;gap:12px;padding:16px 20px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}.chat-header .conversation-avatar{width:42px;height:42px}.chat-header strong,.chat-header small{display:block}.chat-header small{color:var(--muted);margin-top:2px}.chat-stream{flex:1;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:8px;min-height:420px;max-height:62vh}.chat-bubble-wrap{display:flex;flex-direction:column;align-items:flex-start}.chat-bubble-wrap.mine{align-items:flex-end}.chat-bubble{max-width:min(76%,520px);padding:10px 13px;border-radius:18px 18px 18px 5px;background:#fff;border:1px solid #eadfd5;box-shadow:0 3px 10px #32170808;font-size:15px;line-height:1.45;word-break:break-word}.chat-bubble-wrap.mine .chat-bubble{background:var(--brown);color:#fff;border-color:var(--brown);border-radius:18px 18px 5px 18px}.chat-time{font-size:10px;color:#918277;margin:4px 5px 0}.chat-compose{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:14px 16px;background:#fff;border-top:1px solid var(--line);position:sticky;bottom:0}.chat-compose textarea{width:100%;min-height:46px;max-height:120px;resize:none;border:1px solid #d9cec5;border-radius:22px;padding:12px 16px;outline:none;background:#fbfaf8}.chat-compose textarea:focus{border-color:#a95820;box-shadow:0 0 0 3px #a9582014}.chat-send{width:46px;height:46px;border:0;border-radius:50%;background:var(--brown);color:#fff;font-size:19px;font-weight:900;display:grid;place-items:center;align-self:end}.chat-send:disabled{opacity:.5}.chat-status{min-height:18px;padding:0 18px 10px;background:#fff;color:#a13a30;font-size:12px}.menu button[data-section="Messages"]:before{content:"✉"}'''
          if css_marker not in s: raise SystemExit('message css marker missing')
          if '.messages-workspace{' not in s: s=s.replace(css_marker,css_add,1)

          mobile_marker='  .grid{gap:12px}.card h3{font-size:19px}'
          mobile_add='  .grid{gap:12px}.card h3{font-size:19px}.messages-workspace{grid-template-columns:1fr;min-height:0}.conversation-sidebar{border-right:0;border-bottom:1px solid var(--line)}.conversation-sidebar-head{padding:16px}.conversation-row{padding:13px 14px}.chat-panel{min-height:520px}.chat-stream{min-height:340px;max-height:54vh;padding:16px}.chat-bubble{max-width:86%}.chat-header{padding:13px 15px}.chat-compose{padding:10px}.chat-compose textarea{font-size:16px}'
          if mobile_marker in s and '.messages-workspace{grid-template-columns:1fr' not in s: s=s.replace(mobile_marker,mobile_add,1)

          s=s.replace("barista:{label:'Barista account',menu:['Overview','Find Jobs','Matches','Profile Views','My Profile']", "barista:{label:'Barista account',menu:['Overview','Find Jobs','Matches','Messages','Profile Views','My Profile']",1)
          s=s.replace("cafe_owner_manager:{label:'Café owner / manager',menu:['Overview','Job Posts','Candidates','Matches','Café Profile']", "cafe_owner_manager:{label:'Café owner / manager',menu:['Overview','Job Posts','Candidates','Matches','Messages','Café Profile']",1)

          insert='function accountSettingsHtml()'
          if 'function messagesInboxHtml()' not in s:
              js=r'''function messagesInboxHtml(){
  const matched=applications.filter(app=>app.status==='matched');
  const rows=matched.map(app=>{const isBarista=currentRole==='barista',name=isBarista?(app.job?.owner?.cafe_name||'Café'):(app.barista?.display_name||'Barista'),detail=app.job?.title||(isBarista?'Matched café':'Matched barista');return `<button class="conversation-row" type="button" data-conversation-app="${app.id}" data-conversation-name="${escapeHtml(name)}" data-conversation-detail="${escapeHtml(detail)}"><span class="conversation-avatar">${isBarista?'☕':'👤'}</span><span class="conversation-copy"><strong>${escapeHtml(name)}</strong><small>${escapeHtml(detail)}</small></span></button>`}).join('');
  return `<div class="section-head"><div><h2>Messages</h2><p>Private conversations with your matched ${currentRole==='barista'?'cafés':'baristas'}.</p></div></div><section class="messages-workspace"><aside class="conversation-sidebar"><div class="conversation-sidebar-head"><h3>Conversations</h3><p>${matched.length} matched ${matched.length===1?'conversation':'conversations'}</p></div><div class="conversation-list">${rows||'<div class="message-empty">Your conversations will appear here after a match.</div>'}</div></aside><div class="chat-panel" id="chat-panel"><div class="chat-placeholder"><div class="avatar">💬</div><h3>Choose a conversation</h3><p>Messages are private between matched accounts.</p></div></div></section>`;
}
let messageRealtimeChannel=null;
async function selectConversation(applicationId,name,detail){
  activeMessageApplicationId=applicationId;
  document.querySelectorAll('[data-conversation-app]').forEach(row=>row.classList.toggle('active',row.dataset.conversationApp===applicationId));
  const panel=document.getElementById('chat-panel');if(!panel)return;
  panel.innerHTML=`<div class="chat-header"><span class="conversation-avatar">${currentRole==='barista'?'☕':'👤'}</span><span><strong>${escapeHtml(name||'Conversation')}</strong><small>${escapeHtml(detail||'Matched connection')}</small></span></div><div class="chat-stream" id="chat-stream"><div class="message-empty">Loading messages…</div></div><form class="chat-compose" id="chat-compose"><textarea name="body" maxlength="2000" rows="1" placeholder="Message…" aria-label="Message" required></textarea><button class="chat-send" type="submit" aria-label="Send message">↑</button></form><div class="chat-status" id="chat-status"></div>`;
  const form=document.getElementById('chat-compose');form.onsubmit=sendInboxMessage;
  const textarea=form.querySelector('textarea');textarea.addEventListener('input',()=>{textarea.style.height='auto';textarea.style.height=Math.min(textarea.scrollHeight,120)+'px'});
  await loadInboxMessages();
  subscribeToConversation(applicationId);
  if(innerWidth<720)panel.scrollIntoView({behavior:'smooth',block:'start'});
}
async function loadInboxMessages(){
  const stream=document.getElementById('chat-stream');if(!stream||!activeMessageApplicationId)return;
  const {data,error}=await activeClient.from('messages').select('id,sender_id,body,created_at').eq('application_id',activeMessageApplicationId).order('created_at',{ascending:true});
  if(error){stream.innerHTML='<div class="message-empty">Could not load this conversation. Please try again.</div>';return}
  if(!data?.length){stream.innerHTML='<div class="message-empty">No messages yet. Send the first message 👋</div>';return}
  stream.innerHTML=data.map(msg=>`<div class="chat-bubble-wrap ${msg.sender_id===currentUser.id?'mine':''}"><div class="chat-bubble">${escapeHtml(msg.body)}</div><span class="chat-time">${new Date(msg.created_at).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</span></div>`).join('');stream.scrollTop=stream.scrollHeight;
}
async function sendInboxMessage(event){
  event.preventDefault();const form=event.currentTarget,button=form.querySelector('button[type="submit"]'),textarea=form.querySelector('textarea'),status=document.getElementById('chat-status'),body=textarea.value.trim();if(!body||!activeMessageApplicationId)return;button.disabled=true;status.textContent='';
  const {error}=await activeClient.from('messages').insert({application_id:activeMessageApplicationId,sender_id:currentUser.id,body});button.disabled=false;
  if(error){status.textContent=error.message||'Message could not be sent. Please try again.';return}
  textarea.value='';textarea.style.height='auto';await loadInboxMessages();textarea.focus();
}
function subscribeToConversation(applicationId){
  if(messageRealtimeChannel){activeClient.removeChannel(messageRealtimeChannel);messageRealtimeChannel=null}
  messageRealtimeChannel=activeClient.channel(`messages-${applicationId}`).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:`application_id=eq.${applicationId}`},payload=>{if(payload.new?.sender_id!==currentUser.id)loadInboxMessages()}).subscribe();
}
'''
              s=s.replace(insert,js+insert,1)

          oldbind="function bindContentActions(){const content=document.getElementById('content');content.querySelectorAll('[data-go]').forEach(button=>button.onclick=()=>openSection(button.dataset.go,currentView,currentRole));"
          newbind="function bindContentActions(){const content=document.getElementById('content');content.querySelectorAll('[data-go]').forEach(button=>button.onclick=()=>openSection(button.dataset.go,currentView,currentRole));content.querySelectorAll('[data-conversation-app]').forEach(button=>button.onclick=()=>selectConversation(button.dataset.conversationApp,button.dataset.conversationName,button.dataset.conversationDetail));"
          if oldbind not in s: raise SystemExit('bind function marker missing')
          s=s.replace(oldbind,newbind,1)

          oldopen="else if(name==='Matches')html=matchesHtml();else html=sectionPages[role][name];"
          newopen="else if(name==='Matches')html=matchesHtml();else if(name==='Messages')html=messagesInboxHtml();else html=sectionPages[role][name];"
          if oldopen not in s: raise SystemExit('openSection marker missing')
          s=s.replace(oldopen,newopen,1)

          oldlistener="document.getElementById('content').addEventListener('click',event=>{const button=event.target.closest('[data-message-app]');if(button)openMessageDialog(button.dataset.messageApp,button.dataset.messageName)});"
          newlistener="document.getElementById('content').addEventListener('click',event=>{const button=event.target.closest('[data-message-app]');if(button){const app=applications.find(item=>item.id===button.dataset.messageApp);const detail=app?.job?.title||'Matched connection';openSection('Messages',currentView,currentRole);requestAnimationFrame(()=>selectConversation(button.dataset.messageApp,button.dataset.messageName,detail))}});"
          if oldlistener in s:s=s.replace(oldlistener,newlistener,1)

          # ensure realtime unsubscribes when leaving messages
          oldstart="function openSection(name,view,role){currentSection=name;"
          newstart="function openSection(name,view,role){if(name!=='Messages'&&messageRealtimeChannel){activeClient.removeChannel(messageRealtimeChannel);messageRealtimeChannel=null}currentSection=name;"
          if oldstart in s:s=s.replace(oldstart,newstart,1)

          p.write_text(s)
          PY
      - name: Verify messaging upgrade
        run: |
          grep -q "menu:\['Overview','Find Jobs','Matches','Messages'" dashboard.html
          grep -q "messages-workspace" dashboard.html
          grep -q "function messagesInboxHtml" dashboard.html
          grep -q "postgres_changes" dashboard.html
          grep -q "else if(name==='Messages')html=messagesInboxHtml()" dashboard.html
      - name: Commit messaging upgrade
        run: |
          git config user.name "BaristaMatch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.html
          git commit -m "Upgrade messaging inbox and realtime chat"
          git push