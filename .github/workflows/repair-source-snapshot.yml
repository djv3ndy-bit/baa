name: Repair source snapshot
on:
  push:
    branches: [fix/apple-deletion-20260906]
    paths: [.github/workflows/repair-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=zip HEAD -o /tmp/baristamatch-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: repair-source-snapshot
          path: /tmp/baristamatch-source.zip
          retention-days: 1
# Temporary repair-branch-only read; no dependencies, secrets, signing or deployment commands.
