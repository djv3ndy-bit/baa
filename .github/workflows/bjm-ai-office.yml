name: BJM AI Office
on:
  # `validate` is a repository-wide required status check for protected `main`,
  # so every pull request must produce it even when the PR does not touch AI Office files.
  pull_request: {}
  push:
    branches: [main]
    paths: ['bjm-ai-office/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bjm-ai-office
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Verify deterministic widget bundle
        run: test -f dist/assets/office.js
      - name: Verify Vercel function routes
        run: test -f api/mcp.ts && test -f api/health.ts && test -f vercel.json
