name: BJM AI Office
on:
  # `validate` is a repository-wide required status check for protected `main`,
  # so every pull request must produce it even when the PR does not touch AI Office files.
  pull_request: {}
  push:
    branches: [main]
    paths: ['bjm-ai-office/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bjm-ai-office
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: pnpm/action-setup@v4
        with: {version: '11.25.0', run_install: false}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - name: Verify deterministic widget bundle
        run: test -f dist/assets/office.js && test -f dist/assets/office.css
      - name: Verify Vercel function routes
        run: test -f api/mcp.ts && test -f api/health.ts && test -f vercel.json
