name: Rename subscription navigation
on:
  push:
    paths: ['.github/workflows/subscription-label.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/subscription-label.py
      - run: |
          ! grep -q 'Pricing & Subscription' dashboard.html
          grep -q 'Subscription' dashboard.html
          git config user.name "BaristaMatch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.html
          git commit -m "Rename dashboard pricing navigation to Subscription"
          git push
