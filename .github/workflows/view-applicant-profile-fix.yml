name: View applicant profile fix
on:
  push:
    paths: ['.github/workflows/view-applicant-profile-fix.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/view-applicant-profile-fix.py
      - run: |
          grep -q "applications.find(app=>app.barista_id===id)?.barista" dashboard.html
          git config user.name "BaristaMatch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.html
          git commit -m "Enable cafes to view applicant profiles"
          git push
