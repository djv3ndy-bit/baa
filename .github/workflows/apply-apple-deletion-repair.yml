name: Apply reviewed Apple deletion repair
on:
  push:
    branches: [fix/apple-deletion-20260906]
    paths:
      - .github/workflows/apply-apple-deletion-repair.yml
      - .github/apply-apple-deletion.py
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'djv3ndy-bit/baa' && github.ref == 'refs/heads/fix/apple-deletion-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply only exact hash-checked source changes
        run: python .github/apply-apple-deletion.py
      - name: Install test prerequisites
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm ci --prefix mobile --no-audit --no-fund
      - name: Complete repository tests
        shell: bash
        run: |
          set -euo pipefail
          callback_dir="$(mktemp -d)"
          trap 'rm -rf "$callback_dir"' EXIT
          ./mobile/node_modules/.bin/tsc mobile/lib/authCallback.ts --target ES2022 --module commonjs --lib ES2022,DOM --skipLibCheck --outDir "$callback_dir"
          callback_module="$(find "$callback_dir" -type f -name authCallback.js -print -quit)"
          test -n "$callback_module"
          AUTH_CALLBACK_MODULE="$callback_module" npm test
          npm run typecheck --prefix mobile
          npm run release:verify-stores --prefix mobile
      - name: Commit tested source to the repair branch only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/apple-deletion-20260906
          git add -- APP-STORE-SUBMISSION.md api/delete-account.js dashboard.html delete-account.html mobile/app/settings.tsx mobile/lib/api.ts mobile/lib/supabase.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Apply verified Apple deletion fallback and session cleanup'
          header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" push origin HEAD:refs/heads/fix/apple-deletion-20260906
# Temporary owner-approved repair tooling; removed by the connector before PR merge.
# No main writes, production credentials, real deletion, billing, signing, or store submission.
