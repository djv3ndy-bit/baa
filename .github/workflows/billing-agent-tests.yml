name: Billing Agent Tests
on:
  pull_request:
    paths: ['api/_billing-agent.js','tests/billing-agent.test.mjs','package.json','.github/workflows/billing-agent-tests.yml']
  push:
    branches: [main]
    paths: ['api/_billing-agent.js','tests/billing-agent.test.mjs','package.json']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
