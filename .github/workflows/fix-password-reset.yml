name: Fix password reset Safari bug

on:
  push:
    paths:
      - '.github/workflows/fix-password-reset.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch reset form handler
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()
          old = """authForms.forgot.addEventListener('submit',async(event)=>{\n  event.preventDefault();setAuthMessage();if(!authClient){setAuthMessage('Account service is still loading. Please try again.',true);return}\n  const data=new FormData(event.currentTarget);setSubmitting(event.currentTarget,true,'Sending...');\n  const email=String(data.get('email')).trim();\n  try{\n    const {error}=await withTimeout(authClient.auth.resetPasswordForEmail(email,{redirectTo:'https://www.baristajobmatch.com/reset-password.html'}));\n    if(error)throw error;\n    event.currentTarget.reset();document.getElementById('forgot-sent-copy').innerHTML='<strong>Your reset email has been sent.</strong><br>Check your inbox and spam folder, then open the secure link to choose a new password.';showAuthView('forgotSent');\n  }catch(error){setAuthMessage(error.message||'We could not send the reset email. Please try again.',true)}\n  finally{setSubmitting(event.currentTarget,false)}\n});"""
          new = """authForms.forgot.addEventListener('submit',async(event)=>{\n  event.preventDefault();setAuthMessage();if(!authClient){setAuthMessage('Account service is still loading. Please try again.',true);return}\n  const form=event.currentTarget;\n  const data=new FormData(form);setSubmitting(form,true,'Sending...');\n  const email=String(data.get('email')).trim();\n  try{\n    const {error}=await withTimeout(authClient.auth.resetPasswordForEmail(email,{redirectTo:'https://www.baristajobmatch.com/reset-password.html'}));\n    if(error)throw error;\n    form.reset();document.getElementById('forgot-sent-copy').innerHTML='<strong>Your reset email has been sent.</strong><br>Check your inbox and spam folder, then open the secure link to choose a new password.';showAuthView('forgotSent');\n  }catch(error){setAuthMessage(error.message||'We could not send the reset email. Please try again.',true)}\n  finally{setSubmitting(form,false)}\n});"""
          if old not in text:
              raise SystemExit('Password reset handler marker not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit fix
        run: |
          git config user.name "BaristaMatch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Fix password reset on mobile Safari"
          git push
