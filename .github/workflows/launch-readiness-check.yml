name: Launch readiness check
on:
  push:
    paths:
      - 'dashboard.html'
      - 'index.html'
      - 'signup.html'
      - 'login.html'
      - 'reset-password.html'
      - 'support.html'
      - 'support-admin.html'
      - 'owner-*.html'
      - 'owner-dashboard.js'
      - 'owner-dashboard.css'
      - 'terms.html'
      - 'privacy.html'
      - 'api/**'
      - 'tests/**'
      - 'supabase/migrations/**'
      - 'vercel.json'
      - 'launch-check.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/launch-readiness-check.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node launch-check.js
      - run: node --test tests/*.test.js
      - run: |
          node --check api/analytics.js
          node --check api/send-message.js
          node --check api/apply-job.js
          node --check api/match-application.js
          node --check api/report-error.js
          node --check api/support.js
          node --check api/support-admin.js
          node --check api/delete-account.js
          node --check owner-dashboard.js
