name: BaristaMatch launch hardening
on:
  push:
    paths:
      - '.github/workflows/launch-hardening.yml'
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add server-side notification APIs
        shell: bash
        run: |
          cat > api/send-message.js <<'JS'
          const clean=(v,max=5000)=>String(v??'').trim().slice(0,max);
          const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
          function adminHeaders(extra={}){const key=process.env.SUPABASE_SECRET_KEY;const h={apikey:key,'Content-Type':'application/json',...extra};if(key&&!key.startsWith('sb_secret_'))h.Authorization=`Bearer ${key}`;return h}
          async function currentUser(req){const token=String(req.headers.authorization||'').replace(/^Bearer\s+/i,'');if(!token)return null;const r=await fetch(`${process.env.SUPABASE_URL}/auth/v1/user`,{headers:{apikey:process.env.SUPABASE_PUBLISHABLE_KEY,Authorization:`Bearer ${token}`}});return r.ok?await r.json():null}
          async function rest(path,options={}){return fetch(`${process.env.SUPABASE_URL}${path}`,{...options,headers:{...adminHeaders(),...(options.headers||{})}})}
          async function emailFor(id){const r=await fetch(`${process.env.SUPABASE_URL}/auth/v1/admin/users/${encodeURIComponent(id)}`,{headers:adminHeaders()});if(!r.ok)return null;return (await r.json())?.email||null}
          async function sendEmail(to,subject,html){if(!to||!process.env.RESEND_API_KEY)return false;const r=await fetch('https://api.resend.com/emails',{method:'POST',headers:{Authorization:`Bearer ${process.env.RESEND_API_KEY}`,'Content-Type':'application/json'},body:JSON.stringify({from:'BaristaMatch <updates@updates.baristajobmatch.com>',to:[to],reply_to:'hello@baristajobmatch.com',subject,html})});return r.ok}
          export default async function handler(req,res){
            res.setHeader('Cache-Control','no-store');if(req.method!=='POST')return res.status(405).json({error:'Method not allowed'});
            if(!process.env.SUPABASE_URL||!process.env.SUPABASE_PUBLISHABLE_KEY||!process.env.SUPABASE_SECRET_KEY)return res.status(503).json({error:'Messaging is temporarily unavailable.'});
            const user=await currentUser(req);if(!user?.id)return res.status(401).json({error:'Please log in again.'});
            const applicationId=clean(req.body?.application_id,80),body=clean(req.body?.body,2000);if(!applicationId||!body)return res.status(400).json({error:'Message is required.'});
            const ar=await rest(`/rest/v1/applications?id=eq.${encodeURIComponent(applicationId)}&select=id,status,barista_id,job:jobs!applications_job_id_fkey(id,title,owner_id)`);if(!ar.ok)return res.status(500).json({error:'Could not verify this conversation.'});const app=(await ar.json())[0];
            if(!app||app.status!=='matched'||![app.barista_id,app.job?.owner_id].includes(user.id))return res.status(403).json({error:'This conversation is not available.'});
            const ir=await rest('/rest/v1/messages',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({application_id:applicationId,sender_id:user.id,body})});if(!ir.ok)return res.status(500).json({error:'Message could not be sent.'});const message=(await ir.json())[0];
            const recipientId=user.id===app.barista_id?app.job.owner_id:app.barista_id;let emailSent=false;
            try{const [pr,sr]=await Promise.all([rest(`/rest/v1/notification_preferences?user_id=eq.${encodeURIComponent(recipientId)}&select=email_messages&limit=1`),rest(`/rest/v1/profiles?id=eq.${encodeURIComponent(user.id)}&select=display_name,cafe_name&limit=1`)]);const prefs=pr.ok?(await pr.json())[0]:null;const sender=sr.ok?(await sr.json())[0]:null;if(prefs?.email_messages!==false){const to=await emailFor(recipientId);const senderName=sender?.display_name||sender?.cafe_name||'Your match';emailSent=await sendEmail(to,`New BaristaMatch message from ${senderName}`,`<div style="max-width:560px;margin:auto;padding:28px;font-family:Arial,sans-serif;color:#321708;background:#fbf7f1;border-radius:18px"><h2>New message from ${esc(senderName)}</h2><p style="color:#746a61">About ${esc(app.job?.title||'your match')}</p><div style="background:white;border:1px solid #e7ddd2;border-radius:12px;padding:16px;line-height:1.55">${esc(body)}</div><p><a href="https://www.baristajobmatch.com/dashboard.html" style="color:#a95820;font-weight:700">Open BaristaMatch Messages</a></p></div>`)} }catch(e){console.error('Message email notification failed',e?.message||e)}
            return res.status(200).json({success:true,message,email_sent:emailSent});
          }
          JS
          cat > api/apply-job.js <<'JS'
          const clean=(v,max=5000)=>String(v??'').trim().slice(0,max);const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
          function ah(extra={}){const key=process.env.SUPABASE_SECRET_KEY,h={apikey:key,'Content-Type':'application/json',...extra};if(key&&!key.startsWith('sb_secret_'))h.Authorization=`Bearer ${key}`;return h}async function user(req){const token=String(req.headers.authorization||'').replace(/^Bearer\s+/i,'');if(!token)return null;const r=await fetch(`${process.env.SUPABASE_URL}/auth/v1/user`,{headers:{apikey:process.env.SUPABASE_PUBLISHABLE_KEY,Authorization:`Bearer ${token}`}});return r.ok?await r.json():null}async function rest(p,o={}){return fetch(`${process.env.SUPABASE_URL}${p}`,{...o,headers:{...ah(),...(o.headers||{})}})}async function mailFor(id){const r=await fetch(`${process.env.SUPABASE_URL}/auth/v1/admin/users/${encodeURIComponent(id)}`,{headers:ah()});return r.ok?(await r.json()).email:null}async function mail(to,subject,html){if(!to||!process.env.RESEND_API_KEY)return false;return (await fetch('https://api.resend.com/emails',{method:'POST',headers:{Authorization:`Bearer ${process.env.RESEND_API_KEY}`,'Content-Type':'application/json'},body:JSON.stringify({from:'BaristaMatch <updates@updates.baristajobmatch.com>',to:[to],reply_to:'hello@baristajobmatch.com',subject,html})})).ok}
          export default async function handler(req,res){res.setHeader('Cache-Control','no-store');if(req.method!=='POST')return res.status(405).json({error:'Method not allowed'});const u=await user(req);if(!u?.id)return res.status(401).json({error:'Please log in again.'});const jobId=clean(req.body?.job_id,80);if(!jobId)return res.status(400).json({error:'Job is required.'});const jr=await rest(`/rest/v1/jobs?id=eq.${encodeURIComponent(jobId)}&active=eq.true&select=id,title,owner_id`);const job=jr.ok?(await jr.json())[0]:null;if(!job)return res.status(404).json({error:'This job is no longer available.'});const pr=await rest(`/rest/v1/profiles?id=eq.${encodeURIComponent(u.id)}&select=role,display_name&limit=1`);const profile=pr.ok?(await pr.json())[0]:null;if(profile?.role!=='barista')return res.status(403).json({error:'Only baristas can show interest.'});const ir=await rest('/rest/v1/applications',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({job_id:jobId,barista_id:u.id,status:'interested'})});if(!ir.ok){const t=await ir.text();return res.status(t.includes('duplicate')?409:500).json({error:t.includes('duplicate')?'You already showed interest in this job.':'We could not send your interest.'})}let emailSent=false;try{const prefR=await rest(`/rest/v1/notification_preferences?user_id=eq.${encodeURIComponent(job.owner_id)}&select=email_matches&limit=1`);const pref=prefR.ok?(await prefR.json())[0]:null;if(pref?.email_matches!==false){const to=await mailFor(job.owner_id);const name=profile?.display_name||'A barista';emailSent=await mail(to,`${name} is interested in ${job.title}`,`<div style="max-width:560px;margin:auto;padding:28px;font-family:Arial,sans-serif;color:#321708;background:#fbf7f1;border-radius:18px"><h2>New interested barista</h2><p><strong>${esc(name)}</strong> showed interest in <strong>${esc(job.title)}</strong>.</p><p><a href="https://www.baristajobmatch.com/dashboard.html" style="color:#a95820;font-weight:700">Review candidates</a></p></div>`)} }catch(e){console.error('Application email notification failed',e?.message||e)}return res.status(200).json({success:true,email_sent:emailSent})}
          JS
          cat > api/match-application.js <<'JS'
          const clean=(v,max=5000)=>String(v??'').trim().slice(0,max);const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
          function ah(extra={}){const key=process.env.SUPABASE_SECRET_KEY,h={apikey:key,'Content-Type':'application/json',...extra};if(key&&!key.startsWith('sb_secret_'))h.Authorization=`Bearer ${key}`;return h}async function user(req){const token=String(req.headers.authorization||'').replace(/^Bearer\s+/i,'');if(!token)return null;const r=await fetch(`${process.env.SUPABASE_URL}/auth/v1/user`,{headers:{apikey:process.env.SUPABASE_PUBLISHABLE_KEY,Authorization:`Bearer ${token}`}});return r.ok?await r.json():null}async function rest(p,o={}){return fetch(`${process.env.SUPABASE_URL}${p}`,{...o,headers:{...ah(),...(o.headers||{})}})}async function mailFor(id){const r=await fetch(`${process.env.SUPABASE_URL}/auth/v1/admin/users/${encodeURIComponent(id)}`,{headers:ah()});return r.ok?(await r.json()).email:null}async function mail(to,subject,html){if(!to||!process.env.RESEND_API_KEY)return false;return (await fetch('https://api.resend.com/emails',{method:'POST',headers:{Authorization:`Bearer ${process.env.RESEND_API_KEY}`,'Content-Type':'application/json'},body:JSON.stringify({from:'BaristaMatch <updates@updates.baristajobmatch.com>',to:[to],reply_to:'hello@baristajobmatch.com',subject,html})})).ok}
          export default async function handler(req,res){res.setHeader('Cache-Control','no-store');if(req.method!=='POST')return res.status(405).json({error:'Method not allowed'});const u=await user(req);if(!u?.id)return res.status(401).json({error:'Please log in again.'});const id=clean(req.body?.application_id,80);const ar=await rest(`/rest/v1/applications?id=eq.${encodeURIComponent(id)}&select=id,status,barista_id,job:jobs!applications_job_id_fkey(id,title,owner_id,owner:profiles!jobs_owner_id_fkey(cafe_name))`);const app=ar.ok?(await ar.json())[0]:null;if(!app)return res.status(404).json({error:'Application not found.'});if(app.job?.owner_id!==u.id)return res.status(403).json({error:'Only this café can create the match.'});if(app.status==='matched')return res.status(200).json({success:true,already_matched:true});const ur=await rest(`/rest/v1/applications?id=eq.${encodeURIComponent(id)}`,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({status:'matched'})});if(!ur.ok)return res.status(500).json({error:'We could not create this match.'});let emailSent=false;try{const prefR=await rest(`/rest/v1/notification_preferences?user_id=eq.${encodeURIComponent(app.barista_id)}&select=email_matches&limit=1`);const pref=prefR.ok?(await prefR.json())[0]:null;if(pref?.email_matches!==false){const to=await mailFor(app.barista_id),cafe=app.job?.owner?.cafe_name||'A café';emailSent=await mail(to,`You matched with ${cafe} on BaristaMatch`,`<div style="max-width:560px;margin:auto;padding:28px;font-family:Arial,sans-serif;color:#321708;background:#fbf7f1;border-radius:18px"><h2>It’s a match ☕</h2><p><strong>${esc(cafe)}</strong> matched with you for <strong>${esc(app.job?.title||'a café opportunity')}</strong>.</p><p><a href="https://www.baristajobmatch.com/dashboard.html" style="color:#a95820;font-weight:700">Open your match</a></p></div>`)} }catch(e){console.error('Match email notification failed',e?.message||e)}return res.status(200).json({success:true,email_sent:emailSent})}
          JS
          cat > api/report-error.js <<'JS'
          const clean=(v,max)=>String(v??'').slice(0,max);function ah(extra={}){const key=process.env.SUPABASE_SECRET_KEY,h={apikey:key,'Content-Type':'application/json',...extra};if(key&&!key.startsWith('sb_secret_'))h.Authorization=`Bearer ${key}`;return h}
          async function maybeUser(req){try{const token=String(req.headers.authorization||'').replace(/^Bearer\s+/i,'');if(!token)return null;const r=await fetch(`${process.env.SUPABASE_URL}/auth/v1/user`,{headers:{apikey:process.env.SUPABASE_PUBLISHABLE_KEY,Authorization:`Bearer ${token}`}});return r.ok?await r.json():null}catch{return null}}
          export default async function handler(req,res){if(req.method!=='POST')return res.status(405).json({error:'Method not allowed'});if(!process.env.SUPABASE_URL||!process.env.SUPABASE_SECRET_KEY)return res.status(204).end();try{const u=await maybeUser(req);const payload={user_id:u?.id||null,source:clean(req.body?.source||'web',40),message:clean(req.body?.message||'Unknown client error',1000),stack:clean(req.body?.stack,5000)||null,page_url:clean(req.body?.page_url,1000)||null,user_agent:clean(req.body?.user_agent,1000)||null,metadata:req.body?.metadata&&typeof req.body.metadata==='object'?req.body.metadata:{}};await fetch(`${process.env.SUPABASE_URL}/rest/v1/app_errors`,{method:'POST',headers:ah({Prefer:'return=minimal'}),body:JSON.stringify(payload)});return res.status(204).end()}catch(e){console.error('Client error report failed',e?.message||e);return res.status(204).end()}}
          JS
      - name: Patch dashboard notifications and reliability
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dashboard.html'); s=p.read_text()
          # CSS
          marker='.menu button[data-section="Messages"]:before{content:"✉"}'
          add='''.nav-badge{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;margin-left:7px;border-radius:99px;background:#d85d49;color:#fff;font-size:10px;font-weight:900;vertical-align:middle}.conversation-unread{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--caramel);color:#fff;font-size:10px;font-weight:900;margin-left:auto}.notification-card{display:flex;align-items:center;justify-content:space-between;gap:14px}.notification-card button{width:auto}.notification-hint{font-size:12px;color:var(--muted)}'''
          if add not in s: s=s.replace(marker,marker+'\n'+add,1)
          # globals
          old="let activeClient,currentUser,currentRole,currentView,currentProfile={},candidateProfiles=[],profileViews=[],marketJobs=[],applications=[],currentSection='Overview';"
          new="let activeClient,currentUser,currentRole,currentView,currentProfile={},candidateProfiles=[],profileViews=[],marketJobs=[],applications=[],notificationRows=[],notificationRealtimeChannel=null,currentSection='Overview';"
          if old not in s: raise SystemExit('globals marker missing')
          s=s.replace(old,new,1)
          # conversation row unread indicator
          old="detail=app.job?.title||(isBarista?'Matched café':'Matched barista');return `<button class=\"conversation-row\" type=\"button\" data-conversation-app=\"${app.id}\" data-conversation-name=\"${escapeHtml(name)}\" data-conversation-detail=\"${escapeHtml(detail)}\"><span class=\"conversation-avatar\">${isBarista?'☕':'👤'}</span><span class=\"conversation-copy\"><strong>${escapeHtml(name)}</strong><small>${escapeHtml(detail)}</small></span></button>`"
          new="detail=app.job?.title||(isBarista?'Matched café':'Matched barista'),unread=notificationRows.filter(n=>n.type==='message'&&!n.read_at&&n.application_id===app.id).length;return `<button class=\"conversation-row\" type=\"button\" data-conversation-app=\"${app.id}\" data-conversation-name=\"${escapeHtml(name)}\" data-conversation-detail=\"${escapeHtml(detail)}\"><span class=\"conversation-avatar\">${isBarista?'☕':'👤'}</span><span class=\"conversation-copy\"><strong>${escapeHtml(name)}</strong><small>${escapeHtml(detail)}</small></span>${unread?`<span class=\"conversation-unread\">${unread>99?'99+':unread}</span>`:''}</button>`"
          if old not in s: raise SystemExit('conversation row marker missing')
          s=s.replace(old,new,1)
          # mark conversation read
          old="await loadInboxMessages();subscribeToConversation(applicationId);if(innerWidth<720)panel.scrollIntoView({behavior:'smooth',block:'start'});"
          new="await loadInboxMessages();await activeClient.rpc('mark_conversation_read',{p_application_id:applicationId}).catch(()=>{});await refreshNotifications(false);subscribeToConversation(applicationId);if(innerWidth<720)panel.scrollIntoView({behavior:'smooth',block:'start'});"
          if old not in s: raise SystemExit('select conversation marker missing')
          s=s.replace(old,new,1)
          # send inbox via API
          old="const {error}=await activeClient.from('messages').insert({application_id:activeMessageApplicationId,sender_id:currentUser.id,body});button.disabled=false;\n  if(error){status.textContent=error.message||'Message could not be sent. Please try again.';return}"
          new="const {data:{session}}=await activeClient.auth.getSession();const response=await fetch('/api/send-message',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${session?.access_token||''}`},body:JSON.stringify({application_id:activeMessageApplicationId,body})});const result=await response.json().catch(()=>({}));button.disabled=false;\n  if(!response.ok){status.textContent=result.error||'Message could not be sent. Please try again.';return}"
          if old not in s: raise SystemExit('send inbox marker missing')
          s=s.replace(old,new,1)
          # old dialog via API
          old="const {error}=await activeClient.from('messages').insert({application_id:activeMessageApplicationId,sender_id:currentUser.id,body});button.disabled=false;button.textContent='Send';if(error){status.textContent=error.message||'Could not send message.';return}"
          new="const {data:{session}}=await activeClient.auth.getSession();const response=await fetch('/api/send-message',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${session?.access_token||''}`},body:JSON.stringify({application_id:activeMessageApplicationId,body})});const result=await response.json().catch(()=>({}));button.disabled=false;button.textContent='Send';if(!response.ok){status.textContent=result.error||'Could not send message.';return}"
          if old not in s: raise SystemExit('old dialog send marker missing')
          s=s.replace(old,new,1)
          # Apply job API
          old="async function applyToJob(jobId,button){button.disabled=true;button.textContent='Sending…';try{const {error}=await activeClient.from('applications').insert({job_id:jobId,barista_id:currentUser.id,status:'interested'});if(error)throw error;await loadMarketplaceData();openSection('Find Jobs',currentView,currentRole)}catch(error){button.disabled=false;button.textContent='Try again';alert(error.code==='23505'?'You already showed interest in this job.':(error.message||'We could not send your interest. Please try again.'))}}"
          new="async function applyToJob(jobId,button){button.disabled=true;button.textContent='Sending…';try{const {data:{session}}=await activeClient.auth.getSession();const response=await fetch('/api/apply-job',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${session?.access_token||''}`},body:JSON.stringify({job_id:jobId})});const result=await response.json().catch(()=>({}));if(!response.ok)throw new Error(result.error||'We could not send your interest.');await loadMarketplaceData();openSection('Find Jobs',currentView,currentRole)}catch(error){button.disabled=false;button.textContent='Try again';alert(error.message||'We could not send your interest. Please try again.')}}"
          if old not in s: raise SystemExit('apply job marker missing')
          s=s.replace(old,new,1)
          # Match API
          old="async function matchApplication(applicationId,button){button.disabled=true;button.textContent='Matching…';try{const {error}=await activeClient.from('applications').update({status:'matched'}).eq('id',applicationId);if(error)throw error;await loadMarketplaceData();openSection('Candidates',currentView,currentRole)}catch(error){button.disabled=false;button.textContent='Try again';alert(error.message||'We could not create this match.') }}"
          new="async function matchApplication(applicationId,button){button.disabled=true;button.textContent='Matching…';try{const {data:{session}}=await activeClient.auth.getSession();const response=await fetch('/api/match-application',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${session?.access_token||''}`},body:JSON.stringify({application_id:applicationId})});const result=await response.json().catch(()=>({}));if(!response.ok)throw new Error(result.error||'We could not create this match.');await loadMarketplaceData();await refreshNotifications(false);openSection('Candidates',currentView,currentRole)}catch(error){button.disabled=false;button.textContent='Try again';alert(error.message||'We could not create this match.') }}"
          if old not in s: raise SystemExit('match marker missing')
          s=s.replace(old,new,1)
          # notification preference card in settings
          old="const advancedSettings=canDelete?`<details class=\"card settings-card advanced-settings\""
          new="const notificationSection=`<article class=\"card settings-card notification-card\"><div><h3>Notifications</h3><p>Unread-message badges and email alerts are on. Browser alerts can also appear while BaristaMatch is open.</p><div class=\"notification-hint\" id=\"notification-permission\">Browser notifications: ${typeof Notification==='undefined'?'not supported':Notification.permission}</div></div><button class=\"secondary\" type=\"button\" data-enable-notifications>${typeof Notification!=='undefined'&&Notification.permission==='granted'?'Enabled':'Enable'}</button></article>`;const advancedSettings=canDelete?`<details class=\"card settings-card advanced-settings\""
          if old not in s: raise SystemExit('settings marker missing')
          s=s.replace(old,new,1)
          old="${passwordSection}</article>${advancedSettings}</div>`"
          new="${passwordSection}</article>${notificationSection}${advancedSettings}</div>`"
          if old not in s: raise SystemExit('settings render marker missing')
          s=s.replace(old,new,1)
          # bind notifications button
          old="content.querySelectorAll('[data-match-app]').forEach(button=>button.onclick=()=>matchApplication(button.dataset.matchApp,button));const search="
          new="content.querySelectorAll('[data-match-app]').forEach(button=>button.onclick=()=>matchApplication(button.dataset.matchApp,button));content.querySelectorAll('[data-enable-notifications]').forEach(button=>button.onclick=()=>enableBrowserNotifications(button));const search="
          if old not in s: raise SystemExit('bind marker missing')
          s=s.replace(old,new,1)
          # insert notification/error functions before start
          marker="async function start(){try{"
          funcs=r'''async function refreshNotifications(render=true){
  if(!activeClient||!currentUser)return;const {data,error}=await activeClient.from('notifications').select('id,type,title,body,application_id,created_at,read_at').eq('recipient_id',currentUser.id).order('created_at',{ascending:false}).limit(200);if(!error)notificationRows=data||[];updateUnreadBadges();if(render&&currentSection==='Messages')openSection('Messages',currentView,currentRole)
}
function updateUnreadBadges(){const unread=notificationRows.filter(n=>n.type==='message'&&!n.read_at).length;document.querySelectorAll('#menu button[data-section="Messages"]').forEach(button=>{button.querySelector('.nav-badge')?.remove();if(unread)button.insertAdjacentHTML('beforeend',`<span class="nav-badge" aria-label="${unread} unread messages">${unread>99?'99+':unread}</span>`)});document.title=unread?`(${unread}) Dashboard — BaristaMatch`:'Dashboard — BaristaMatch'}
function subscribeNotifications(){if(notificationRealtimeChannel)activeClient.removeChannel(notificationRealtimeChannel);notificationRealtimeChannel=activeClient.channel(`notifications-${currentUser.id}`).on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:`recipient_id=eq.${currentUser.id}`},payload=>{notificationRows.unshift(payload.new);updateUnreadBadges();if(payload.new.type==='message'&&typeof Notification!=='undefined'&&Notification.permission==='granted'&&document.visibilityState!=='visible'){new Notification(payload.new.title||'New BaristaMatch message',{body:payload.new.body||'Open BaristaMatch to reply.',icon:'/assets/favicon-32-v2.png'})}if(currentSection==='Messages')openSection('Messages',currentView,currentRole)}).subscribe()}
async function enableBrowserNotifications(button){if(typeof Notification==='undefined'){alert('Browser notifications are not supported on this device.');return}const permission=await Notification.requestPermission();button.textContent=permission==='granted'?'Enabled':'Enable';const hint=document.getElementById('notification-permission');if(hint)hint.textContent='Browser notifications: '+permission;if(permission==='granted')new Notification('BaristaMatch notifications enabled',{body:'You’ll see message alerts while BaristaMatch is running.',icon:'/assets/favicon-32-v2.png'})}
