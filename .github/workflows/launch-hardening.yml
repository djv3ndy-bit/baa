      - name: Update privacy policy for messaging and monitoring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('privacy.html');s=p.read_text()
          s=s.replace('applications, and matching activity.','applications, matching activity, messages between matched users, and notification activity.')
          s=s.replace('basic technical information supplied by our hosting and authentication providers.','basic technical information supplied by our hosting and authentication providers. We may also collect error details, page URLs, browser information, and diagnostic logs when something fails so we can troubleshoot reliability problems.')
          s=s.replace('Supabase for authentication, database, and file storage, and Vercel for hosting and delivery.','Supabase for authentication, database, realtime updates, and file storage; Vercel for hosting and delivery; and Resend for transactional service emails such as support, match, application, and message notifications.')
          p.write_text(s)
          PY
      - name: Add launch static checks
        run: |
          cat > launch-check.js <<'JS'
          const fs=require('fs');
          const files=['index.html','signup.html','login.html','reset-password.html','dashboard.html','support.html','support-admin.html','terms.html','privacy.html'];
          for(const f of files){if(!fs.existsSync(f))throw new Error(`Missing ${f}`);const s=fs.readFileSync(f,'utf8');if(!s.includes('<meta name="viewport"'))throw new Error(`${f}: missing viewport`);if(!s.includes('</html>'))throw new Error(`${f}: incomplete HTML`)}
          const d=fs.readFileSync('dashboard.html','utf8');
          for(const token of ['/api/send-message','/api/apply-job','/api/match-application','refreshNotifications','reportClientError','mark_conversation_read','nav-badge'])if(!d.includes(token))throw new Error(`dashboard missing ${token}`);
          if(d.includes("event.currentTarget.reset()"))throw new Error('unsafe async form reset pattern returned');
          for(const f of ['api/send-message.js','api/apply-job.js','api/match-application.js','api/report-error.js','api/support.js','api/support-admin.js'])if(!fs.existsSync(f))throw new Error(`Missing ${f}`);
          console.log('BaristaMatch launch static checks passed');
          JS
          node launch-check.js
          for f in api/send-message.js api/apply-job.js api/match-application.js api/report-error.js api/support.js api/support-admin.js; do node --check "$f"; done
      - name: Commit launch hardening
        run: |
          git config user.name "BaristaMatch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.html privacy.html api/send-message.js api/apply-job.js api/match-application.js api/report-error.js launch-check.js
          git commit -m "Harden launch notifications monitoring and alerts"
          git push