name: Add Apple authentication
on:
  push:
    paths: ['.github/workflows/add-apple-auth.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/add-apple-auth.py
      - name: Validate Apple auth integration
        run: |
          grep -q 'id="apple"' login.html
          grep -q "provider:'apple'" login.html
          grep -q 'id="apple-signup"' signup.html
          grep -q "provider:'apple'" signup.html
          grep -q 'Continue with Google' login.html
          grep -q 'Continue with Google' signup.html
      - run: |
          git config user.name "BaristaMatch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add login.html signup.html
          git commit -m "Add Continue with Apple authentication"
          git push
