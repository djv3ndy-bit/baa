name: Professional mobile dashboard v2
on:
  push:
    paths: ['.github/workflows/mobile-professional-v2.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/mobile-professional-v2.py
      - run: |
          grep -q 'Professional mobile dashboard v2' dashboard.html
          grep -q 'grid-template-columns:repeat(2,minmax(0,1fr))' dashboard.html
          grep -q 'position:fixed!important' dashboard.html
          git config user.name "BaristaMatch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.html
          git commit -m "Polish mobile dashboard for app-like experience"
          git push
