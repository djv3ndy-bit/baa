name: UI layout audit source
on:
  push:
    branches: [fix/native-header-overflow-20260906]
    paths: [.github/workflows/ui-layout-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fbfff22abcd72b96b8abddd0101de0fce263f3c2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Package exact source and isolated test tools without credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ui-audit/tools"
          git archive --format=tar HEAD > "$RUNNER_TEMP/ui-audit/source.tar"
          printf '{"name":"bjm-layout-regressions","private":true,"type":"module","dependencies":{"typescript":"5.9.2","yoga-layout":"3.2.1"}}\n' > "$RUNNER_TEMP/ui-audit/tools/package.json"
          npm install --prefix "$RUNNER_TEMP/ui-audit/tools" --ignore-scripts --no-audit --no-fund
          tar -czf "$RUNNER_TEMP/ui-layout-audit.tar.gz" -C "$RUNNER_TEMP/ui-audit" source.tar tools
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-layout-source-tools
          path: ${{ runner.temp }}/ui-layout-audit.tar.gz
          retention-days: 1
          if-no-files-found: error
