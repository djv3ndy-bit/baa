name: Reliable candidate profile viewer
on:
  push:
    paths: ['.github/workflows/reliable-candidate-profile.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/reliable-candidate-profile.py
      - run: |
          grep -q 'openCandidateReliable' dashboard.html
          git config user.name "BaristaMatch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.html
          git commit -m "Make applicant profile viewing reliable"
          git push
