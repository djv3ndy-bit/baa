name: Apply Option 4 dashboard header
on:
  push:
    paths:
      - '.github/workflows/apply-option4-header.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/apply-option4-header.py
      - name: Verify header redesign
        run: |
          grep -q 'BaristaMatch premium navigation — Option 4' dashboard.html
          grep -q 'data-account-logout' dashboard.html
          grep -q 'class="nav-icon"' dashboard.html
          grep -q 'sidefoot{display:none!important}' dashboard.html
      - name: Commit redesign
        run: |
          git config user.name "BaristaMatch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.html
          git commit -m "Redesign dashboard navigation with premium Option 4 header"
          git push