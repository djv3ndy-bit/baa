name: Harden async auth forms

on:
  push:
    paths:
      - '.github/workflows/harden-auth-forms.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden auth handlers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          replacements=[
          ("authForms.magic.addEventListener('submit',async(event)=>{event.preventDefault();setAuthMessage();if(!authClient){setAuthMessage('Account service is still loading. Please try again.',true);return}const data=new FormData(event.currentTarget);setSubmitting(event.currentTarget,true,'Sending link...');const {error}=await authClient.auth.signInWithOtp({email:String(data.get('email')).trim(),options:{emailRedirectTo:'https://www.baristajobmatch.com',data:{role:data.get('role')}}});setSubmitting(event.currentTarget,false);if(error){setAuthMessage(error.message,true);return}event.currentTarget.reset();setAuthMessage('Check your email for a secure BaristaMatch login link.');});",
           "authForms.magic.addEventListener('submit',async(event)=>{event.preventDefault();setAuthMessage();if(!authClient){setAuthMessage('Account service is still loading. Please try again.',true);return}const form=event.currentTarget;const data=new FormData(form);setSubmitting(form,true,'Sending link...');const {error}=await authClient.auth.signInWithOtp({email:String(data.get('email')).trim(),options:{emailRedirectTo:'https://www.baristajobmatch.com',data:{role:data.get('role')}}});setSubmitting(form,false);if(error){setAuthMessage(error.message,true);return}form.reset();setAuthMessage('Check your email for a secure BaristaMatch login link.');});"),
          ("authForms.signup.addEventListener('submit',async(event)=>{\n  event.preventDefault();setAuthMessage();\n  const data=new FormData(event.currentTarget),password=data.get('password'),confirmPassword=data.get('confirmPassword');",
           "authForms.signup.addEventListener('submit',async(event)=>{\n  event.preventDefault();setAuthMessage();\n  const form=event.currentTarget;\n  const data=new FormData(form),password=data.get('password'),confirmPassword=data.get('confirmPassword');"),
          ("  setSubmitting(event.currentTarget,true,'Creating...');",
           "  setSubmitting(form,true,'Creating...');"),
          ("  setSubmitting(event.currentTarget,false);\n  if(error){setAuthMessage(error.message,true);return}\n  event.currentTarget.reset();",
           "  setSubmitting(form,false);\n  if(error){setAuthMessage(error.message,true);return}\n  form.reset();"),
          ("authForms.reset.addEventListener('submit',async(event)=>{\n  event.preventDefault();setAuthMessage();const data=new FormData(event.currentTarget),password=data.get('password');",
           "authForms.reset.addEventListener('submit',async(event)=>{\n  event.preventDefault();setAuthMessage();const form=event.currentTarget;const data=new FormData(form),password=data.get('password');"),
          ("  setSubmitting(event.currentTarget,true,'Updating...');const {error}=await authClient.auth.updateUser({password});setSubmitting(event.currentTarget,false);\n  if(error){setAuthMessage(error.message,true);return}event.currentTarget.reset();",
           "  setSubmitting(form,true,'Updating...');const {error}=await authClient.auth.updateUser({password});setSubmitting(form,false);\n  if(error){setAuthMessage(error.message,true);return}form.reset();")]
          changed=0
          for old,new in replacements:
              if old in s:
                  s=s.replace(old,new,1); changed+=1
          if changed < 6:
              raise SystemExit(f'Expected 6 hardening replacements, applied {changed}')
          p.write_text(s)
          print('Applied',changed,'auth hardening replacements')
          PY
      - name: Commit hardening
        run: |
          git config user.name "BaristaMatch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Harden async auth forms for mobile Safari"
          git push
