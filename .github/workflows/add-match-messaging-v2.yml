name: Add verified match messaging UI

on:
  push:
    paths:
      - '.github/workflows/add-match-messaging-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard messaging
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dashboard.html')
          s=p.read_text()

          if '.message-button{' not in s:
              marker='.job-item>[data-apply-job]{flex:0 0 auto;align-self:center;min-width:150px}'
              if marker not in s: raise SystemExit('CSS marker missing')
              s=s.replace(marker, marker+'\n.match-actions{display:flex;gap:8px;flex:0 0 auto}.message-button{border:0;background:var(--brown);color:#fff;padding:10px 14px;border-radius:10px;font-weight:800;white-space:nowrap}.message-list{display:grid;gap:10px;max-height:340px;overflow:auto;padding:4px 2px 12px}.message-bubble{max-width:82%;padding:10px 12px;border-radius:14px;background:#f4e7dc;color:var(--brown);line-height:1.45;word-break:break-word}.message-bubble.mine{margin-left:auto;background:var(--brown);color:#fff}.message-meta{display:block;font-size:10px;opacity:.65;margin-top:5px}.message-compose{display:grid;grid-template-columns:1fr auto;gap:9px;margin-top:12px}.message-compose input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px}.message-empty{color:var(--muted);text-align:center;padding:24px 8px}',1)

          if 'id="message-dialog"' not in s:
              marker='<dialog class="profile-dialog" id="delete-dialog">'
              if marker not in s: raise SystemExit('Dialog marker missing')
              dialog='<dialog class="profile-dialog" id="message-dialog"><div class="profile-form"><h2 id="message-title">Messages</h2><p id="message-subtitle">Chat with your match.</p><div class="message-list" id="message-list"></div><form class="message-compose" id="message-form"><input name="body" maxlength="2000" autocomplete="off" placeholder="Write a message…" required><button class="primary" type="submit">Send</button></form><p class="form-status" id="message-status"></p><div class="form-actions"><button class="secondary" type="button" id="message-close">Close</button></div></div></dialog>\n'
              s=s.replace(marker,dialog+marker,1)

          start=s.find('function matchesHtml(){')
          end=s.find('\nfunction ',start+1)
          if start<0 or end<0: raise SystemExit('matchesHtml function not found')
          old=s[start:end]
          new='''function matchesHtml(){const matched=applications.filter(app=>app.status==='matched');const rows=matched.map(app=>{const isBarista=currentRole==='barista',name=isBarista?(app.job?.owner?.cafe_name||'Café'):(app.barista?.display_name||'Barista'),detail=app.job?.title||(isBarista?'Matched job':'Matched barista');return `<div class="item"><div class="avatar">🤝</div><div class="itemtext"><b>${escapeHtml(name)}</b><small>${escapeHtml(detail)} · Matched</small></div><div class="match-actions"><button class="message-button" type="button" data-message-app="${app.id}" data-message-name="${escapeHtml(name)}">Message</button></div></div>`}).join('');return `<div class="section-head"><div><h2>Your Matches</h2><p>Mutual hiring connections ready for the next step.</p></div></div><article class="card"><h3>${matched.length} ${matched.length===1?'match':'matches'}</h3>${rows||'<div class="empty-state"><div class="avatar">🤝</div><h3>No matches yet</h3><p>Browse opportunities and show interest to start matching.</p></div>'}</article>`}'''
          s=s[:start]+new+s[end:]

          if 'async function openMessageDialog(' not in s:
              marker='async function closeJob(jobId,button)'
              if marker not in s: raise SystemExit('JS marker missing')
              js='''let activeMessageApplicationId=null;\nasync function openMessageDialog(applicationId,name){activeMessageApplicationId=applicationId;document.getElementById('message-title').textContent=name?`Message ${name}`:'Messages';document.getElementById('message-subtitle').textContent='Only you and this matched account can see this conversation.';document.getElementById('message-status').textContent='';document.getElementById('message-dialog').showModal();await loadMessages()}\nasync function loadMessages(){const list=document.getElementById('message-list');list.innerHTML='<div class="message-empty">Loading conversation…</div>';const {data,error}=await activeClient.from('messages').select('id,sender_id,body,created_at').eq('application_id',activeMessageApplicationId).order('created_at',{ascending:true});if(error){list.innerHTML='<div class="message-empty">Could not load messages.</div>';return}if(!data?.length){list.innerHTML='<div class="message-empty">No messages yet. Say hello 👋</div>';return}list.innerHTML=data.map(msg=>`<div class="message-bubble ${msg.sender_id===currentUser.id?'mine':''}">${escapeHtml(msg.body)}<span class="message-meta">${new Date(msg.created_at).toLocaleString()}</span></div>`).join('');list.scrollTop=list.scrollHeight}\ndocument.getElementById('message-close').onclick=()=>document.getElementById('message-dialog').close();\ndocument.getElementById('message-form').onsubmit=async event=>{event.preventDefault();const form=event.currentTarget,button=form.querySelector('button[type="submit"]'),status=document.getElementById('message-status'),body=String(new FormData(form).get('body')||'').trim();if(!body)return;button.disabled=true;button.textContent='Sending…';status.textContent='';const {error}=await activeClient.from('messages').insert({application_id:activeMessageApplicationId,sender_id:currentUser.id,body});button.disabled=false;button.textContent='Send';if(error){status.textContent=error.message||'Could not send message.';return}form.reset();await loadMessages()};\ndocument.getElementById('content').addEventListener('click',event=>{const button=event.target.closest('[data-message-app]');if(button)openMessageDialog(button.dataset.messageApp,button.dataset.messageName)});\n'''
              s=s.replace(marker,js+marker,1)

          mobile='  .grid{gap:12px}.card h3{font-size:19px}.item{align-items:flex-start}'
          if mobile in s and '.match-actions{width:100%' not in s:
              s=s.replace(mobile,mobile+'.match-actions{width:100%;margin-top:8px}.match-actions .message-button{width:100%}.message-compose{grid-template-columns:1fr}.message-compose .primary{width:100%}',1)

          p.write_text(s)
          PY
      - name: Verify messaging exists
        run: |
          grep -q 'data-message-app' dashboard.html
          grep -q 'id="message-dialog"' dashboard.html
          grep -q "from('messages')" dashboard.html
      - name: Commit messaging
        run: |
          git config user.name "BaristaMatch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.html
          git commit -m "Fix messaging between matched users"
          git push
