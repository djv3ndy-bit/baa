name: Solution-first homepage
on:
  push:
    paths: ['.github/workflows/homepage-solution-first.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/homepage-solution-first.py
      - run: |
          grep -q 'Great cafés and great baristas' index.html
          grep -q 'Start hiring' index.html
          ! grep -q 'href="/pricing.html">Pricing</a>' index.html
          git config user.name "BaristaMatch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Redesign homepage around coffee hiring solution"
          git push
