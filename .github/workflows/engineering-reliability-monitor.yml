# Branch-only credential-access diagnostic. Do not merge this replacement into main.
# The exact branch and manual confirmation below gate this read-only job.
name: Vercel read-only deployment access proof

on:
  workflow_dispatch:
    inputs:
      confirm_read_only_access:
        description: 'Read only the existing baa production deployment list; send no notifications'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vercel-readonly-deployment-access-proof
  cancel-in-progress: false

jobs:
  deployment-access-proof:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/codex/vercel-access-proof-20261023' &&
      inputs.confirm_read_only_access == true
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read the fixed production deployment list without repository checkout
        shell: bash
        env:
          ERA_VERCEL_READ_TOKEN: ${{ secrets.ERA_VERCEL_READ_TOKEN }}
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path
          import ssl
          import urllib.error
          import urllib.request

          URL = (
              "https://api.vercel.com/v6/deployments"
              "?projectId=prj_VuAxQpdhDJPeTPdanA5HjtOrylA5"
              "&target=production&limit=1&teamId=team_W7sLByby0CKVDax9uhMshO5I"
          )
          MAX_BYTES = 65_536

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def probe():
              result = {
                  "success": False,
                  "status": "configuration_failed",
                  "http_status": None,
                  "deployment_count": None,
              }
              token = os.environ.get("ERA_VERCEL_READ_TOKEN", "")
              if not 8 <= len(token) <= 4096 or any(not 33 <= ord(c) <= 126 for c in token):
                  return result
              try:
                  # Construct the TLS context directly so SSLKEYLOGFILE is never read.
                  context = ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT)
                  context.check_hostname = True
                  context.verify_mode = ssl.CERT_REQUIRED
                  context.load_default_certs()
                  context.keylog_filename = None
                  opener = urllib.request.build_opener(
                      urllib.request.ProxyHandler({}),
                      NoRedirect(),
                      urllib.request.HTTPSHandler(context=context),
                  )
                  request = urllib.request.Request(
                      URL,
                      method="GET",
                      headers={
                          "Accept": "application/json",
                          "Authorization": "Bearer " + token,
                          "User-Agent": "BaristaMatch-readonly-deployment-proof/1.0",
                      },
                  )
                  with opener.open(request, timeout=8) as response:
                      if type(response.status) is not int or response.status != 200:
                          result["status"] = "invalid_response"
                          return result
                      result["http_status"] = 200
                      body = response.read(MAX_BYTES + 1)
                  if len(body) > MAX_BYTES:
                      result["status"] = "response_too_large"
                      return result
                  payload = json.loads(body.decode("utf-8"))
                  deployments = payload.get("deployments") if isinstance(payload, dict) else None
                  if (not isinstance(deployments, list) or len(deployments) > 1
                          or any(not isinstance(item, dict) for item in deployments)):
                      result["status"] = "invalid_response"
                      return result
                  result.update(success=True, status="deployment_read_verified",
                                deployment_count=len(deployments))
              except urllib.error.HTTPError as error:
                  code = error.code
                  error.close()  # Never read the provider's error body or headers.
                  result["status"] = "access_denied" if code in (401, 403) else "http_error"
                  if type(code) is int and 300 <= code <= 599:
                      result["http_status"] = code
              except (UnicodeDecodeError, json.JSONDecodeError):
                  result["status"] = "invalid_response"
              except TimeoutError:
                  result["status"] = "timeout"
              except urllib.error.URLError as error:
                  result["status"] = "timeout" if isinstance(error.reason, TimeoutError) else "transport_error"
              except OSError:
                  result["status"] = "transport_error"
              except Exception:
                  result["status"] = "internal_error"
              return result

          result = probe()
          output = json.dumps(result, sort_keys=True) + "\n"
          Path("monitoring-artifacts").mkdir(exist_ok=True)
          Path("monitoring-artifacts/vercel-deployment-access.json").write_text(output, encoding="utf-8")
          print(output, end="")
          raise SystemExit(0 if result["success"] else 3)
          PY

      - name: Preserve only the sanitized deployment access result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, pinned on current main
        with:
          name: vercel-deployment-access-proof-${{ github.run_id }}
          path: monitoring-artifacts/vercel-deployment-access.json
          if-no-files-found: error
          retention-days: 1
