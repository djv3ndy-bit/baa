name: Engineering reliability monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  checks: read

concurrency:
  group: engineering-reliability-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Collect and classify read-only evidence
        id: monitor
        shell: bash
        env:
          ERA_ALLOWED_HEALTH_HOSTS: www.baristajobmatch.com
          GITHUB_REPOSITORY: djv3ndy-bit/baa
          GITHUB_READ_TOKEN: ${{ github.token }}
          ERA_PRIVATE_MONITORING_ENABLED: ${{ vars.ERA_PRIVATE_MONITORING_ENABLED }}
          VERCEL_PROJECT_ID: ${{ vars.ERA_VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.ERA_VERCEL_TEAM_ID }}
          VERCEL_READ_TOKEN: ${{ secrets.ERA_VERCEL_READ_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.ERA_SUPABASE_PROJECT_REF }}
          SUPABASE_READ_ONLY_TOKEN: ${{ secrets.ERA_SUPABASE_READ_ONLY_TOKEN }}
        run: |
          set -uo pipefail
          mkdir -p monitoring-artifacts
          output_path='monitoring-artifacts/engineering-reliability-result.json'
          args=(
            monitor
            --environment production
            --provider health
            --health-url https://www.baristajobmatch.com/
            --health-url https://www.baristajobmatch.com/api/public-config
            --provider github
            --lookback 1h
            --limit 10
          )

          configuration_failed=0
          if [[ "${ERA_PRIVATE_MONITORING_ENABLED:-}" == 'true' ]]; then
            for variable_name in VERCEL_PROJECT_ID VERCEL_TEAM_ID VERCEL_READ_TOKEN SUPABASE_PROJECT_REF SUPABASE_READ_ONLY_TOKEN; do
              if [[ -z "${!variable_name:-}" ]]; then
                configuration_failed=1
              fi
            done
            args+=(
              --provider vercel
              --provider supabase
              --supabase-service api
              --supabase-service postgres
              --supabase-service auth
              --supabase-service storage
              --supabase-service realtime
              --supabase-service edge-function
            )
          fi

          if [[ "$configuration_failed" -eq 1 ]]; then
            printf '%s\n' '{"alert_required":true,"error_type":"MissingReadOnlyConfiguration","exit_code":3,"mode":"recurring_monitor","model_used":false,"production_writes_enabled":false,"status":"configuration_failed"}' > "$output_path"
            monitor_exit=3
          else
            set +e
            PYTHONPATH=ops/engineering-reliability-agent/src \
              python -m era.main "${args[@]}" > "$output_path"
            monitor_exit=$?
            set -e
          fi

          if [[ ! -s "$output_path" ]]; then
            printf '%s\n' '{"alert_required":true,"error_type":"MissingMonitorResult","exit_code":3,"mode":"recurring_monitor","model_used":false,"production_writes_enabled":false,"status":"collection_failed"}' > "$output_path"
            monitor_exit=3
          fi

          echo "exit_code=$monitor_exit" >> "$GITHUB_OUTPUT"
          OUTPUT_PATH="$output_path" python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os

          with open(os.environ["OUTPUT_PATH"], encoding="utf-8") as handle:
              result = json.load(handle)
          severity = result.get("investigation", {}).get("decision", {}).get("severity", "unavailable")
          failures = len(result.get("collection", {}).get("collection_failures", []))
          print("## Engineering reliability monitor")
          print(f"- Status: {result.get('status', 'unknown')}")
          print(f"- Severity: {severity}")
          print(f"- Collection failures: {failures}")
          print("- Model used: false")
          print("- Production writes enabled: false")
          PY

      - name: Preserve sanitized incident artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engineering-reliability-result-${{ github.run_id }}
          path: monitoring-artifacts/engineering-reliability-result.json
          if-no-files-found: error
          retention-days: 14

      - name: Raise the review-only alert
        if: always()
        shell: bash
        run: |
          if [[ '${{ steps.monitor.outputs.exit_code }}' != '0' ]]; then
            exit 1
          fi
