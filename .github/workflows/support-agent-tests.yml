name: Support Agent Tests

on:
  pull_request:
    paths:
      - 'api/_support-agent.js'
      - 'api/support.js'
      - 'tests/support-agent.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/support-agent-tests.yml'
  push:
    branches: [main]
    paths:
      - 'api/_support-agent.js'
      - 'api/support.js'
      - 'tests/support-agent.test.mjs'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run support agent safety tests
        run: npm test
