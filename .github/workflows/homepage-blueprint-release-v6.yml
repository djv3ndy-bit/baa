name: Blueprint homepage release v6
on:
  push:
    paths:
      - '.github/workflows/homepage-blueprint-release-v6.yml'
permissions:
  contents: write
jobs:
  release-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct the complete blueprint homepage
        run: |
          cat \
            .github/homepage_exact_payload/part-00 \
            .github/homepage_exact_payload/part-01 \
            .github/homepage_exact_payload/part-02 \
            .github/homepage_exact_payload/part-03 \
            | base64 -d > /tmp/index-raw.html
          python3 - <<'PY'
          from pathlib import Path
          raw = Path('/tmp/index-raw.html').read_text(encoding='utf-8')
          end = raw.rfind('</html>')
          assert end >= 0, 'decoded payload is missing </html>'
          clean = raw[:end + len('</html>')]
          Path('index.html').write_text(clean, encoding='utf-8')
          print(f'clean homepage bytes: {len(clean.encode("utf-8"))}')
          PY

      - name: Validate blueprint content and conversion routes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          required = [
              '<!doctype html>', '</html>',
              'Great cafés', 'great baristas', 'belong together.',
              'Simple steps. Better matches.',
              '1. Discover', '2. Match', '3. Chat',
              'Made for the', 'coffee community',
              'Find a café', 'where you belong.',
              'Hire great baristas.', 'Faster.',
              'Why cafés and baristas love BaristaMatch',
              'Barista dashboard', 'Café dashboard', 'Messages',
              'Better matches. Stronger teams.',
              '/signup.html?role=barista',
              '/signup.html?role=cafe_owner_manager',
              '/login.html', '/dashboard.html', '/support.html',
              '/privacy.html', '/terms.html', '/api/config',
              'role-dialog', 'mobile-menu', 'resource-menu'
          ]
          missing = [item for item in required if item not in text]
          assert not missing, f'missing blueprint elements: {missing}'
          forbidden = ['>Pricing<', '$24.99', '$239.99', 'Trusted by coffee people']
          found = [item for item in forbidden if item.lower() in text.lower()]
          assert not found, f'forbidden public content: {found}'
          assert text.count('<section') >= 6, 'homepage is missing major sections'
          assert text.count('data-role=') + text.count('data-role="') >= 2, 'role selection actions are missing'
          print('Blueprint structure and public conversion rules passed.')
          PY

      - name: Commit homepage before testing deployment
        run: |
          git config user.name "BaristaMatch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Implement exact BaristaMatch blueprint homepage"
            git push
          else
            echo "index.html already matches the reconstructed blueprint."
          fi

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser-test desktop and mobile layouts
        run: |
          python3 -m http.server 4173 >/tmp/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          cat > /tmp/test-homepage.mjs <<'JS'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const browser = await chromium.launch({headless:true});

          async function assertNoOverflow(page, label) {
            const overflow = await page.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth);
            assert.ok(overflow <= 1, `${label} horizontal overflow: ${overflow}px`);
          }

          async function testDesktop() {
            const page = await browser.newPage({viewport:{width:1440,height:1000}});
            await page.goto('http://127.0.0.1:4173/', {waitUntil:'domcontentloaded'});
            await page.locator('h1').waitFor();
            assert.match(await page.locator('h1').innerText(), /Great cafés[\s\S]*great baristas[\s\S]*belong together/i);
            for (const text of ['Simple steps. Better matches.','Why cafés and baristas love BaristaMatch','Barista dashboard','Café dashboard']) {
              assert.ok(await page.getByText(text, {exact:true}).isVisible(), `${text} is not visible`);
            }
            for (const forbidden of ['$24.99','$239.99','Trusted by coffee people']) {
              assert.equal(await page.getByText(forbidden, {exact:false}).count(), 0, `${forbidden} is publicly visible`);
            }

            await page.locator('.resource-button').click();
            assert.ok(await page.getByText('Help Center', {exact:true}).isVisible());
            await page.keyboard.press('Escape').catch(()=>{});

            await page.locator('[data-open-role]').first().click();
            assert.ok(await page.locator('#role-dialog').evaluate(el => el.open), 'role dialog did not open');
            await page.locator('#dialog-close').click();

            assert.equal(await page.getByText('Create my free profile', {exact:true}).getAttribute('href'), '/signup.html?role=barista');
            assert.equal(await page.getByText('Start hiring', {exact:true}).last().getAttribute('href'), '/signup.html?role=cafe_owner_manager');

            const image = page.locator('.hero-photo');
            await image.waitFor({state:'visible'});
            await page.waitForTimeout(4500);
            assert.ok(await image.evaluate(el => el.complete && el.naturalWidth >= 500), 'hero image did not load correctly');
            await assertNoOverflow(page, 'desktop');
            await page.screenshot({path:'/tmp/homepage-desktop.png', fullPage:true});
            await page.close();
          }

          async function testMobile() {
            const page = await browser.newPage({viewport:{width:390,height:844}, isMobile:true});
            await page.goto('http://127.0.0.1:4173/', {waitUntil:'domcontentloaded'});
            await page.locator('h1').waitFor();
            assert.ok(await page.locator('#mobile-menu').isVisible());
            await page.locator('#mobile-menu').click();
            assert.ok(await page.locator('#nav-links').isVisible());
            await page.locator('#nav-links a[href="#how"]').click();
            assert.ok(await page.getByText('Simple steps. Better matches.', {exact:true}).isVisible());
            assert.ok(await page.getByText('I’m a Barista', {exact:true}).first().isVisible());
            assert.ok(await page.getByText('I’m Hiring', {exact:true}).first().isVisible());
            await assertNoOverflow(page, 'mobile');
            await page.screenshot({path:'/tmp/homepage-mobile.png', fullPage:true});
            await page.close();
          }

          await testDesktop();
          await testMobile();
          await browser.close();
          console.log('Desktop and mobile interaction tests passed.');
          JS
          node /tmp/test-homepage.mjs

      - name: Wait for the production homepage
        run: |
          for attempt in $(seq 1 72); do
            body=$(curl -fsSL --max-time 20 "https://www.baristajobmatch.com/?blueprint_release=${GITHUB_RUN_ID}-${attempt}" || true)
            if printf '%s' "$body" | grep -q 'Why cafés and baristas love BaristaMatch'; then
              printf '%s' "$body" > /tmp/production-index.html
              echo "Production blueprint is live."
              exit 0
            fi
            echo "Waiting for Vercel production ($attempt/72)…"
            sleep 10
          done
          echo "Production homepage was not updated within 12 minutes."
          exit 1

      - name: Smoke-test production routes and protected APIs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/production-index.html').read_text(encoding='utf-8')
          for item in ['Great cafés','Simple steps. Better matches.','Why cafés and baristas love BaristaMatch']:
              assert item in text
          for item in ['$24.99','$239.99','Trusted by coffee people']:
              assert item not in text
          print('Production homepage text validation passed.')
          PY

          for path in \
            /login.html \
            '/signup.html?role=barista' \
            '/signup.html?role=cafe_owner_manager' \
            /dashboard.html \
            /support.html \
            /privacy.html \
            /terms.html; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://www.baristajobmatch.com${path}")
            case "$code" in 200|204|301|302|307|308) ;; *) echo "${path} returned ${code}"; exit 1;; esac
          done

          curl -fsSL --max-time 20 https://www.baristajobmatch.com/api/config > /tmp/config.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/config.json'))
          assert data.get('supabaseUrl')
          assert data.get('supabasePublishableKey')
          PY

          for endpoint in apply-job match-application send-message; do
            code=$(curl -sS -o "/tmp/${endpoint}.json" -w '%{http_code}' \
              -X POST -H 'Content-Type: application/json' -d '{}' \
              "https://www.baristajobmatch.com/api/${endpoint}")
            if [ "$code" != "401" ]; then
              echo "/api/${endpoint} expected 401 without a session but returned ${code}"
              cat "/tmp/${endpoint}.json"
              exit 1
            fi
          done

      - name: Record release verification
        run: |
          mkdir -p .qa
          cat > .qa/homepage-blueprint-release-passed.txt <<EOF
          BaristaMatch exact blueprint homepage release: PASSED
          Workflow run: ${GITHUB_RUN_ID}
          Verified at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Passed: source structure, no public pricing, desktop UI, mobile UI, role links, role dialog, image loading, no horizontal overflow, production routes, Supabase config, protected API authentication.
          EOF
          git pull --rebase origin main
          git add .qa/homepage-blueprint-release-passed.txt
          git commit -m "Record exact homepage release verification"
          git push
