name: Run launch hardening
on:
  push:
    paths:
      - '.github/workflows/run-launch-hardening.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/launch_hardening.py
      - run: |
          node --check api/send-message.js
          node --check api/apply-job.js
          node --check api/match-application.js
          node --check api/report-error.js
          grep -q '/api/send-message' dashboard.html
          grep -q 'refreshNotifications' dashboard.html
          grep -q 'reportClientError' dashboard.html
          grep -q 'nav-badge' dashboard.html
      - run: |
          git config user.name "BaristaMatch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.html privacy.html
          git commit -m "Add launch notifications badges and monitoring"
          git push
