name: Remove duplicate content headings
on:
  push:
    paths:
      - '.github/workflows/remove-content-heading-repetition.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove repeated section titles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dashboard.html')
          s=p.read_text()
          marker='/* Remove repeated content titles when the page header already names the section */'
          css='''\n/* Remove repeated content titles when the page header already names the section */\n.content > .section-head h2{display:none!important}\n.content > .section-head h2 + p{margin-top:0}\n.content > .section-head:has(h2){margin-top:0}\n'''
          if marker not in s:
              s=s.replace('</style>',css+'\n</style>',1)
          p.write_text(s)
          PY
      - name: Verify cleanup
        run: |
          grep -q 'Remove repeated content titles when the page header already names the section' dashboard.html
      - name: Commit cleanup
        run: |
          git config user.name "BaristaMatch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.html
          git commit -m "Remove repeated dashboard content headings"
          git push