name: Fix mobile job cards

on:
  push:
    paths:
      - '.github/workflows/fix-mobile-job-cards.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile job card layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dashboard.html')
          s=p.read_text()

          css_marker = ".itemtext{min-width:0;flex:1}.itemtext b,.itemtext small{display:block}.itemtext small{color:var(--muted);margin-top:4px;line-height:1.45}"
          css_new = css_marker + "\n.job-item{align-items:flex-start;gap:14px}.job-item .itemtext{min-width:0}.job-item .itemtext b{font-size:16px;line-height:1.35}.job-item .itemtext small{font-size:14px;line-height:1.5;overflow-wrap:anywhere}.job-item>[data-apply-job]{flex:0 0 auto;align-self:center;min-width:150px}"
          if css_marker not in s:
              raise SystemExit('Job card CSS marker not found')
          s=s.replace(css_marker,css_new,1)

          mobile_marker = "  .grid{gap:12px}.card h3{font-size:19px}.item{align-items:flex-start}.pill{margin-left:auto}.form-grid{grid-template-columns:1fr}.form-wide{grid-column:auto}.profile-hero{align-items:flex-start}"
          mobile_new = "  .grid{gap:12px}.card h3{font-size:19px}.item{align-items:flex-start}.job-item{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;padding:18px 0}.job-item .avatar{width:52px;height:52px;border-radius:14px}.job-item .itemtext{grid-column:2;min-width:0;width:100%}.job-item .itemtext b{font-size:17px;line-height:1.35}.job-item .itemtext small{font-size:14px;line-height:1.5;word-break:normal;overflow-wrap:break-word}.job-item>[data-apply-job]{grid-column:1/-1;width:100%;min-width:0;margin-top:4px;padding:13px 16px}.pill{margin-left:auto}.form-grid{grid-template-columns:1fr}.form-wide{grid-column:auto}.profile-hero{align-items:flex-start}"
          if mobile_marker not in s:
              raise SystemExit('Mobile CSS marker not found')
          s=s.replace(mobile_marker,mobile_new,1)

          old_markup = 'return `<div class="item" data-job-row data-search="${escapeHtml(haystack)}">'
          new_markup = 'return `<div class="item job-item" data-job-row data-search="${escapeHtml(haystack)}">'
          if old_markup not in s:
              raise SystemExit('Jobs markup marker not found')
          s=s.replace(old_markup,new_markup,1)

          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "BaristaMatch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.html
          git commit -m "Fix mobile job posting layout"
          git push
