name: Overview stat links
on:
  push:
    paths: ['.github/workflows/overview-stat-links.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/overview-stat-links.py
      - run: |
          grep -q 'data-go="Job Posts" role="button"' dashboard.html
          grep -q 'data-go="Matches" role="button"' dashboard.html
          git config user.name "BaristaMatch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.html
          git commit -m "Make active jobs and matches overview cards clickable"
          git push
