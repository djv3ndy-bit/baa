name: Fix mobile candidate cards
on:
  push:
    paths: ['.github/workflows/fix-mobile-candidate-cards.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/fix-mobile-candidate-cards.py
      - run: |
          grep -q 'applicant-item' dashboard.html
          grep -q 'applicant-actions' dashboard.html
          git config user.name "BaristaMatch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.html
          git commit -m "Fix interested candidates layout on mobile"
          git push
