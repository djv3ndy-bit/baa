name: Verify Notion background connection

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/notion-connection-verification.yml

permissions:
  contents: read

concurrency:
  group: notion-background-connection-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the reviewed default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Use Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Prepare an idempotent connection-check package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p monitoring-artifacts
          cat > monitoring-artifacts/notion-connection-check.json <<'JSON'
          {
            "incident": true,
            "fingerprint": "notion-background-connection-v1",
            "severity": "P3",
            "title": "Notion background sync connection verified",
            "summary": "GitHub Actions successfully authenticated to the restricted Notion connection and created or updated this private verification task.",
            "likely_cause": "One-time connection verification; no incident was detected.",
            "recommended_actions": [
              "No action is required.",
              "Keep the NOTION_API_TOKEN repository secret private.",
              "Allow the hourly Reliability Agent to continue incident-only synchronization."
            ],
            "repair": {
              "owner_approval_required": false
            }
          }
          JSON

      - name: Verify the encrypted secret and restricted Notion access
        shell: bash
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          NOTION_AGENT_DATA_SOURCE_ID: 64a712d1-8a77-44da-8db5-6a80b9ace054
          NOTION_SOURCE_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          PYTHONPATH=ops/engineering-reliability-agent/src \
            python -m era.notion \
              --input monitoring-artifacts/notion-connection-check.json \
              --source-url "$NOTION_SOURCE_URL" \
              > monitoring-artifacts/notion-connection-result.json

          RESULT_PATH=monitoring-artifacts/notion-connection-result.json python - <<'PY'
          import json
          import os

          with open(os.environ["RESULT_PATH"], encoding="utf-8") as handle:
              result = json.load(handle)

          if result.get("status") not in {"created", "updated"} or result.get("attempted") is not True:
              raise SystemExit(f"Notion connection verification failed closed: {result.get('status', 'unknown')}")

          print("Notion background connection verified without exposing the token.")
          PY

      - name: Record the verification result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notion-background-connection-verification-${{ github.run_id }}
          path: monitoring-artifacts/notion-connection-result.json
          if-no-files-found: error
          retention-days: 14
