name: Fix mobile match card layout
on:
  push:
    paths:
      - '.github/workflows/fix-mobile-match-card.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix match card mobile layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dashboard.html')
          s=p.read_text()
          old='return `<div class="item"><div class="avatar">🤝</div><div class="itemtext"><b>${escapeHtml(name)}</b><small>${escapeHtml(detail)} · Matched</small></div><div class="match-actions"><button class="message-button" type="button" data-message-app="${app.id}" data-message-name="${escapeHtml(name)}">Message</button></div></div>`'
          new='return `<div class="item match-item"><div class="avatar">🤝</div><div class="itemtext"><b>${escapeHtml(name)}</b><small>${escapeHtml(detail)} · Matched</small></div><div class="match-actions"><button class="message-button" type="button" data-message-app="${app.id}" data-message-name="${escapeHtml(name)}">Message</button></div></div>`'
          if old not in s: raise SystemExit('match markup not found')
          s=s.replace(old,new,1)
          oldcss='.grid{gap:12px}.card h3{font-size:19px}.item{align-items:flex-start}.match-actions{width:100%;margin-top:8px}.match-actions .message-button{width:100%}.message-compose{grid-template-columns:1fr}.message-compose .primary{width:100%}.job-item{display:grid;'
          newcss='.grid{gap:12px}.card h3{font-size:19px}.item{align-items:flex-start}.match-item{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;padding:18px 0}.match-item .avatar{width:52px;height:52px}.match-item .itemtext{grid-column:2;min-width:0;width:100%}.match-item .itemtext b{font-size:17px;line-height:1.35}.match-item .itemtext small{font-size:14px;line-height:1.45}.match-item .match-actions{grid-column:1/-1;width:100%;margin-top:4px}.match-item .message-button{display:block;width:100%;padding:13px 16px}.message-compose{grid-template-columns:1fr}.message-compose .primary{width:100%}.job-item{display:grid;'
          if oldcss not in s: raise SystemExit('mobile css marker not found')
          s=s.replace(oldcss,newcss,1)
          p.write_text(s)
          PY
      - name: Verify and commit
        run: |
          grep -q 'item match-item' dashboard.html
          grep -q 'match-item .message-button' dashboard.html
          git config user.name "BaristaMatch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.html
          git commit -m "Fix mobile match message button layout"
          git push