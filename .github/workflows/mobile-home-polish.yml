name: Mobile homepage polish
on:
  push:
    paths: ['.github/workflows/mobile-home-polish.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/mobile-home-polish.py
      - run: |
          grep -q 'Premium mobile homepage polish' index.html
          grep -q 'id="mobile-login"' index.html
          grep -q 'Log in' index.html
          git config user.name "BaristaMatch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Polish mobile homepage and expose login" || exit 0
          git push
