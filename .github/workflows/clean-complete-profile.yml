name: Clean completed profile pages
on:
  push:
    paths:
      - '.github/workflows/clean-complete-profile.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply cleanup
        run: python3 .github/scripts/clean_complete_profile.py
      - name: Verify cleanup
        run: |
          grep -q 'const complete=score===100' dashboard.html
          grep -q 'completed-profile-card' dashboard.html
          grep -q 'visible to cafés on BaristaMatch' dashboard.html
      - name: Commit dashboard
        run: |
          git config user.name "BaristaMatch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.html
          git commit -m "Simplify completed profile pages"
          git push