name: Remove duplicate section headings
on:
  push:
    paths:
      - '.github/workflows/remove-duplicate-section-headings.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove repeated content headings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dashboard.html')
          s=p.read_text()
          replacements={
            '<div class="section-head"><div><h2>Find Barista Jobs</h2><p>Local café opportunities with clear hourly pay and schedules.</p></div></div>':'<div class="section-intro"><p>Local café opportunities with clear hourly pay and schedules.</p></div>',
            '<div class="section-head"><div><h2>Job Posts</h2><p>Create clear opportunities and manage hiring.</p></div><button class="primary" data-post-job>Post a job</button></div>':'<div class="section-head section-head-actions"><div><p>Create clear opportunities and manage hiring.</p></div><button class="primary" data-post-job>Post a job</button></div>',
            '<div class="section-head"><div><h2>Candidates</h2><p>Baristas who showed interest in your jobs.</p></div></div>':'<div class="section-intro"><p>Baristas who showed interest in your jobs.</p></div>',
            '<div class="section-head"><div><h2>Your Matches</h2><p>Mutual hiring connections ready for the next step.</p></div></div>':'<div class="section-intro"><p>Mutual hiring connections ready for the next step.</p></div>',
            '<div class="section-head"><div><h2>Profile Views</h2><p>See which cafés are discovering your work.</p></div></div>':'<div class="section-intro"><p>See which cafés are discovering your work.</p></div>',
            '<div class="section-head"><div><h2>Candidates</h2><p>Discover baristas and learn what makes them special.</p></div></div>':'<div class="section-intro"><p>Discover baristas and learn what makes them special.</p></div>',
            '<div class="section-head"><div><h2>Pricing & Subscription</h2><p>Simple, transparent pricing for your café.</p></div></div>':'<div class="section-intro"><p>Simple, transparent pricing for your café.</p></div>',
            '<div class="section-head"><div><h2>Account Settings</h2><p>Manage your BaristaMatch account and security.</p></div></div>':'<div class="section-intro"><p>Manage your BaristaMatch account and security.</p></div>'
          }
          changed=0
          for old,new in replacements.items():
            if old in s:
              s=s.replace(old,new)
              changed+=1
          marker='.section-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}'
          css='.section-intro{margin:0 0 18px}.section-intro p,.section-head-actions p{margin:0;color:var(--muted);line-height:1.5}.section-head-actions{align-items:center}'
          if css not in s:
            if marker not in s: raise SystemExit('section head css marker missing')
            s=s.replace(marker,css+marker,1)
          if changed < 5: raise SystemExit(f'only {changed} heading patterns updated')
          p.write_text(s)
          print('updated patterns',changed)
          PY
      - name: Verify cleanup
        run: |
          grep -q 'section-intro' dashboard.html
          ! grep -q '<h2>Profile Views</h2><p>See which cafés' dashboard.html
          ! grep -q '<h2>Your Matches</h2><p>Mutual hiring' dashboard.html
          ! grep -q '<h2>Find Barista Jobs</h2><p>Local café' dashboard.html
      - name: Commit cleanup
        run: |
          git config user.name "BaristaMatch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.html
          git commit -m "Remove duplicate dashboard section headings"
          git push