name: Mobile top-left cleanup
on:
  push:
    paths: ['.github/workflows/mobile-top-left-cleanup.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/mobile-top-left-cleanup.py
      - run: |
          grep -q 'Mobile top-left polish' dashboard.html
          git config user.name "BaristaMatch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.html
          git commit -m "Polish mobile dashboard top-left spacing"
          git push
