name: Update final pricing
on:
  push:
    paths: ['.github/workflows/update-final-pricing.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/update-final-pricing.py
      - run: |
          grep -q '\$24.99' dashboard.html
          grep -q 'first 30 days' dashboard.html
          grep -q '30-day free trial' terms.html
      - run: |
          git config user.name "BaristaMatch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.html terms.html
          git commit -m "Update trial and subscription pricing to $24.99"
          git push