name: Recent activity cafe icon
on:
  push:
    paths: ['.github/workflows/recent-activity-cafe-icon.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/recent-activity-cafe-icon.py
      - run: |
          grep -q 'vintage-cafe-mark-small.png' dashboard.html
          git config user.name "BaristaMatch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.html
          git commit -m "Use café storefront icon for barista match activity"
          git push
