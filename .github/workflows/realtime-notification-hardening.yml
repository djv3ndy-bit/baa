name: Realtime notification hardening
on:
  push:
    paths: ['.github/workflows/realtime-notification-hardening.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/realtime-notification-hardening.py
      - run: |
          grep -q 'setNavBadge' dashboard.html
          grep -q 'refreshMarketplaceForNotification' dashboard.html
          grep -q 'markSectionNotificationsRead' dashboard.html
          grep -q 'chat-bubble-wrap mine' dashboard.html
          git config user.name "BaristaMatch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.html
          git commit -m "Harden realtime applications and messaging"
          git push
