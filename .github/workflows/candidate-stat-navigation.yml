name: Candidate stat navigation
on:
  push:
    paths: ['.github/workflows/candidate-stat-navigation.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/candidate-stat-navigation.py
      - run: |
          grep -q 'data-go="Candidates" role="button"' dashboard.html
          git config user.name "BaristaMatch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.html
          git commit -m "Make new candidates stat open candidate review"
          git push
