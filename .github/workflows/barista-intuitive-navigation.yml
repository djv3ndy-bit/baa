name: Barista intuitive navigation
on:
  push:
    paths: ['.github/workflows/barista-intuitive-navigation.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/barista-intuitive-navigation.py
      - run: |
          grep -q 'Track status →' dashboard.html
          grep -q "Object.defineProperty(sectionPages.barista,'Applications'" dashboard.html
          grep -q 'data-go="My Profile" role="button"' dashboard.html
          git config user.name "BaristaMatch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.html
          git commit -m "Make barista dashboard navigation intuitive"
          git push
