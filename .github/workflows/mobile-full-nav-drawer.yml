name: Mobile full navigation drawer
on:
  push:
    paths: ['.github/workflows/mobile-full-nav-drawer.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/mobile-full-nav-drawer.py
      - run: |
          grep -q 'mobile-menu-toggle' dashboard.html
          grep -q 'mobile-menu-open' dashboard.html
          git config user.name "BaristaMatch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.html
          git commit -m "Restore full mobile navigation drawer"
          git push
