name: Sales Agent Tests
on:
  pull_request:
    paths: ['api/_sales-agent.js','tests/sales-agent.test.mjs','.github/workflows/sales-agent-tests.yml']
  push:
    branches: [main]
    paths: ['api/_sales-agent.js','tests/sales-agent.test.mjs']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test tests/sales-agent.test.mjs