name: Mobile menu top right
on:
  push:
    paths: ['.github/workflows/mobile-menu-top-right.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/mobile-menu-top-right.py
      - run: |
          grep -q 'Professional mobile menu placement' dashboard.html
          git config user.name "BaristaMatch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.html
          git commit -m "Move mobile navigation menu to top right"
          git push
