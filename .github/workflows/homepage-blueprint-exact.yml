name: Exact blueprint homepage
on:
  push:
    paths: ['.github/workflows/homepage-blueprint-exact.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/homepage-blueprint-exact.py
      - run: |
          grep -q 'Great cafés and' index.html
          grep -q 'Simple steps. Better matches.' index.html
          grep -q 'Better matches. Stronger teams.' index.html
          ! grep -q 'href="/pricing.html">Pricing</a>' index.html
          git config user.name "BaristaMatch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Match homepage to approved BaristaMatch blueprint"
          git push
