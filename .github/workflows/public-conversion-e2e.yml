name: Public conversion E2E
on:
  push:
    paths:
      - '.github/workflows/public-conversion-e2e.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test live homepage, signup paths, login, and support pages
        run: |
          cat > /tmp/public-flow.mjs <<'JS'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const base='https://www.baristajobmatch.com';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1000}});
          const errors=[];
          page.on('pageerror',e=>errors.push(`pageerror: ${e.message}`));
          page.on('console',m=>{if(m.type()==='error')errors.push(`console: ${m.text()}`)});

          await page.goto(`${base}/?e2e=${Date.now()}`,{waitUntil:'domcontentloaded'});
          await page.locator('h1').waitFor();
          assert.ok((await page.locator('h1').innerText()).includes('Great cafés'));
          assert.equal(await page.getByText('$24.99',{exact:false}).count(),0);
          assert.equal(await page.getByText('$239.99',{exact:false}).count(),0);
          assert.equal(await page.getByText('Trusted by coffee people',{exact:false}).count(),0);

          const baristaCard=page.locator('[data-role="barista"]').first();
          await Promise.all([
            page.waitForURL(/signup\.html\?role=barista/),
            baristaCard.click()
          ]);
          assert.ok(await page.locator('#barista').isChecked());
          assert.match(await page.locator('#name-label').innerText(),/Your name/i);

          await page.locator('input[name="name"]').fill('E2E Test Barista');
          await page.locator('input[name="location"]').fill('Miami, FL');
          await page.locator('input[name="email"]').fill(`e2e-${Date.now()}@example.com`);
          await page.locator('input[name="password"]').fill('ValidPass123!');
          await page.locator('input[name="confirmPassword"]').fill('DifferentPass123!');
          await page.locator('input[name="terms"]').check();
          await page.locator('#signup-form button[type="submit"]').click();
          await page.getByText('The passwords do not match.',{exact:false}).waitFor();

          await page.goto(`${base}/signup.html?role=cafe_owner_manager`,{waitUntil:'domcontentloaded'});
          assert.ok(await page.locator('#cafe').isChecked());
          assert.match(await page.locator('#name-label').innerText(),/Café name/i);

          await page.goto(`${base}/login.html`,{waitUntil:'domcontentloaded'});
          assert.ok(await page.locator('input[type="email"]').isVisible());
          assert.ok(await page.locator('input[type="password"]').isVisible());

          for(const path of ['/support.html','/privacy.html','/terms.html']){
            const response=await page.goto(`${base}${path}`,{waitUntil:'domcontentloaded'});
            assert.ok(response && response.status()<400,`${path} returned ${response?.status()}`);
            assert.ok((await page.locator('body').innerText()).trim().length>150,`${path} appears empty`);
          }

          const ignored=errors.filter(e=>!e.includes('favicon'));
          assert.deepEqual(ignored,[],`browser errors: ${ignored.join(' | ')}`);
          await page.close();

          const mobile=await browser.newPage({viewport:{width:390,height:844},isMobile:true});
          await mobile.goto(`${base}/?mobile_e2e=${Date.now()}`,{waitUntil:'domcontentloaded'});
          await mobile.locator('h1').waitFor();
          assert.ok(await mobile.locator('#mobile-menu').isVisible());
          await mobile.locator('#mobile-menu').click();
          assert.ok(await mobile.locator('#nav-links').isVisible());
          const overflow=await mobile.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
          assert.ok(overflow<=1,`mobile overflow ${overflow}px`);
          await mobile.close();
          await browser.close();
          console.log('Live public conversion E2E passed.');
          JS
          node /tmp/public-flow.mjs
      - name: Record public conversion pass
        run: |
          mkdir -p .qa
          cat > .qa/public-conversion-e2e-passed.txt <<EOF
          BaristaMatch public conversion E2E: PASSED
          Run: ${GITHUB_RUN_ID}
          Verified: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Covered: live homepage, no public pricing, barista role routing, café role routing, signup preselection, signup validation, login page, support, privacy, terms, mobile menu, responsive overflow, browser console errors.
          EOF
          git config user.name "BaristaMatch Bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin main
          git add .qa/public-conversion-e2e-passed.txt
          git commit -m "Record public conversion end-to-end verification"
          git push
