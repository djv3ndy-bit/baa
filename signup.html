<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Sign up for BaristaMatch as a barista or café.">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32-v2.png"><title>Sign up — BaristaMatch</title>
<style>
:root{--caramel:#e78b4f;--dark:#12100f;--soft:#1d1917;--muted:#b9afa8;--line:#70645d;--green:#5bd487}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--dark);color:#fff;font-family:Arial,sans-serif}a{color:inherit}.page{width:min(440px,calc(100% - 40px));margin:0 auto;padding:42px 0 70px}.brand{display:flex;justify-content:center;align-items:center;gap:10px;text-decoration:none;font-size:21px;font-weight:800;margin-bottom:35px}.brand img{width:46px;height:46px;object-fit:contain;filter:drop-shadow(0 3px 10px #0008)}.brand b{color:var(--caramel)}h1{font:700 43px/1.08 Georgia,serif;text-align:center;margin:0 0 32px}.sub{text-align:center;color:var(--muted);line-height:1.5;margin:-17px 0 28px}.field{display:block;font-size:13px;font-weight:800;margin:15px 0}.field input{display:block;width:100%;margin-top:8px;padding:15px 14px;border:1px solid var(--line);border-radius:6px;background:var(--soft);color:#fff;font:inherit}.field input:focus{outline:2px solid var(--caramel);outline-offset:1px}.button{width:100%;border-radius:999px;padding:15px;border:0;font:800 15px Arial,sans-serif;cursor:pointer}.primary{background:var(--caramel);color:#211108}.social{border:1px solid var(--line);background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;gap:13px}.google-g{font:900 19px Arial;color:#4285f4}.divider{display:flex;align-items:center;gap:14px;margin:22px 0;color:var(--muted);font-weight:700}.divider:before,.divider:after{content:"";height:1px;background:#4b423d;flex:1}.login{text-align:center;color:var(--muted);margin-top:42px}.login a{display:block;color:#fff;font-weight:800;margin-top:11px}.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.role{position:relative}.role input{position:absolute;opacity:0}.role label{display:block;height:100%;padding:14px;border:2px solid #574c46;border-radius:10px;cursor:pointer}.role strong,.role small{display:block}.role small{color:var(--muted);margin-top:5px;line-height:1.35}.role input:checked+label{border-color:var(--caramel);background:#251b16}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.terms{display:flex;gap:9px;align-items:flex-start;color:var(--muted);font-size:12px;line-height:1.45;margin:20px 0}.terms input{margin-top:2px}.status{min-height:22px;color:var(--green);font-weight:700;font-size:14px;line-height:1.45;margin:14px 0 0;text-align:center}.status.error{color:#ff8c83}.back{display:block;border:0;background:transparent;color:var(--muted);text-decoration:underline;margin:20px auto 0;cursor:pointer}.secure{text-align:center;color:#857b75;font-size:11px;line-height:1.5;margin-top:48px}.button:disabled{opacity:.58;cursor:wait}[hidden]{display:none!important}@media(max-width:520px){.page{padding-top:28px}h1{font-size:36px}.two,.roles{grid-template-columns:1fr}.brand{margin-bottom:28px}}
</style></head>
<body><main class="page"><a class="brand" href="/"><img src="/assets/favicon-transparent-v2.png" alt=""><span>Barista<b>Match</b></span></a>
<section id="step-one"><h1>Sign up to find your coffee match</h1><label class="field">Email address<input id="email" type="email" autocomplete="email" placeholder="name@domain.com" required></label><button class="button primary" id="next" type="button">Next</button><div class="divider">or</div><button class="button social" id="google" type="button"><span class="google-g">G</span>Sign up with Google</button><p class="login">Already have an account?<a href="/?login=required">Log in</a></p></section>
<section id="step-two" hidden><h1 id="details-title">Tell us about you</h1><p class="sub">This helps us personalize your BaristaMatch experience.</p><form id="signup-form"><div class="roles"><div class="role"><input id="barista" type="radio" name="role" value="barista" required><label for="barista"><strong>☕ Barista</strong><small>I’m looking for work.</small></label></div><div class="role"><input id="cafe" type="radio" name="role" value="cafe_owner_manager" required><label for="cafe"><strong>🏪 Café</strong><small>I’m hiring baristas.</small></label></div></div><label class="field" id="name-label">Your name<input name="name" autocomplete="name" required placeholder="Your full name"></label><label class="field">Location<input name="location" autocomplete="address-level2" required placeholder="City, State"></label><div class="two" id="password-fields"><label class="field">Password<input name="password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters"></label><label class="field">Confirm password<input name="confirmPassword" type="password" autocomplete="new-password" minlength="8" placeholder="Enter it again"></label></div><label class="terms"><input name="terms" type="checkbox" required><span>I agree to the BaristaMatch <a href="/privacy.html">Privacy Policy</a> and Terms of Service.</span></label><button class="button primary" id="finish" type="submit">Sign up</button></form><button class="back" id="back" type="button">← Back</button></section>
<p class="status" id="status" role="status" aria-live="polite"></p><p class="secure">Secure signup powered by Supabase. BaristaMatch never sees your Google password.</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.102.0/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
<script>
const form=document.getElementById('signup-form'),status=document.getElementById('status'),stepOne=document.getElementById('step-one'),stepTwo=document.getElementById('step-two'),passwordFields=document.getElementById('password-fields'),finishButton=document.getElementById('finish'),emailInput=document.getElementById('email');let client,signupMode='email';
const setStatus=(message='',error=false)=>{status.textContent=message;status.classList.toggle('error',error)},selectedRole=()=>form.querySelector('[name="role"]:checked')?.value||'';
function updateNameLabel(){const cafe=selectedRole()==='cafe_owner_manager';document.getElementById('name-label').firstChild.textContent=cafe?'Café name':'Your name';form.elements.name.placeholder=cafe?'Your café name':'Your full name'}
function showDetails(mode){signupMode=mode;stepOne.hidden=true;stepTwo.hidden=false;passwordFields.hidden=mode==='google';passwordFields.querySelectorAll('input').forEach(input=>input.required=mode==='email');finishButton.textContent=mode==='google'?'Continue with Google':'Sign up';document.getElementById('details-title').textContent=mode==='google'?'Finish your profile':'Create your profile';setStatus();scrollTo(0,0)}
form.querySelectorAll('[name="role"]').forEach(input=>input.addEventListener('change',updateNameLabel));const requestedRole=new URLSearchParams(location.search).get('role');if(['barista','cafe_owner_manager'].includes(requestedRole)){form.querySelector(`[value="${requestedRole}"]`).checked=true;updateNameLabel()}
async function saveStarterProfile(user,role,name,locationValue){const payload={id:user.id,role,display_name:role==='barista'?name:null,cafe_name:role==='cafe_owner_manager'?name:null,location:locationValue,updated_at:new Date().toISOString()};const {error}=await client.from('profiles').upsert(payload);if(error)console.warn('Starter profile will be completed in the dashboard.',error)}
async function finishGoogleSignup(session){const role=localStorage.getItem('baristamatch_pending_role');if(!session||!role)return false;const name=localStorage.getItem('baristamatch_pending_name')||session.user.user_metadata?.full_name||session.user.user_metadata?.name||'',locationValue=localStorage.getItem('baristamatch_pending_location')||'';await client.auth.updateUser({data:{role,display_name:role==='barista'?name:null,cafe_name:role==='cafe_owner_manager'?name:null,location:locationValue}});await saveStarterProfile(session.user,role,name,locationValue);['baristamatch_pending_role','baristamatch_pending_name','baristamatch_pending_location'].forEach(key=>localStorage.removeItem(key));location.replace('/dashboard.html');return true}
async function initialize(){try{const response=await fetch('/api/config',{cache:'no-store'}),config=await response.json().catch(()=>({}));if(!response.ok||!config.supabaseUrl||!config.supabasePublishableKey)throw new Error('Signup is temporarily unavailable. Please try again shortly.');client=window.supabase.createClient(config.supabaseUrl,config.supabasePublishableKey);const {data:{session}}=await client.auth.getSession();if(await finishGoogleSignup(session))return;client.auth.onAuthStateChange(async(event,nextSession)=>{if(event==='SIGNED_IN')await finishGoogleSignup(nextSession)})}catch(error){setStatus(error.message||'Signup is temporarily unavailable. Please try again shortly.',true)}}
document.getElementById('next').onclick=()=>{if(emailInput.reportValidity())showDetails('email')};document.getElementById('google').onclick=()=>showDetails('google');document.getElementById('back').onclick=()=>{stepTwo.hidden=true;stepOne.hidden=false;setStatus();scrollTo(0,0)};
form.addEventListener('submit',async event=>{event.preventDefault();setStatus();if(!client)return setStatus('Signup is still loading. Please try again.',true);const data=new FormData(form),role=data.get('role'),name=String(data.get('name')).trim(),locationValue=String(data.get('location')).trim();if(signupMode==='google'){localStorage.setItem('baristamatch_pending_role',role);localStorage.setItem('baristamatch_pending_name',name);localStorage.setItem('baristamatch_pending_location',locationValue);finishButton.disabled=true;const {error}=await client.auth.signInWithOAuth({provider:'google',options:{redirectTo:'https://www.baristajobmatch.com/signup.html?oauth=complete'}});finishButton.disabled=false;if(error){['baristamatch_pending_role','baristamatch_pending_name','baristamatch_pending_location'].forEach(key=>localStorage.removeItem(key));setStatus('Google signup could not start. Please try again or use email.',true)}return}const password=data.get('password');if(password!==data.get('confirmPassword'))return setStatus('The passwords do not match. Please enter them again.',true);finishButton.disabled=true;finishButton.textContent='Signing you up…';const {data:result,error}=await client.auth.signUp({email:emailInput.value.trim(),password,options:{emailRedirectTo:'https://www.baristajobmatch.com/dashboard.html',data:{role,display_name:role==='barista'?name:null,cafe_name:role==='cafe_owner_manager'?name:null,location:locationValue}}});finishButton.disabled=false;finishButton.textContent='Sign up';if(error)return setStatus(error.message,true);if(result.session){await saveStarterProfile(result.user,role,name,locationValue);location.replace('/dashboard.html');return}form.reset();stepTwo.hidden=true;stepOne.hidden=false;setStatus('You’re signed up. Check your email to verify your account, then log in.')});initialize();
</script></body></html>
