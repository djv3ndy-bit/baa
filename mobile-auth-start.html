<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Secure BaristaMatch Sign In</title>
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff4e8;color:#321708;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{text-align:center;padding:28px}.logo{width:88px;height:88px;object-fit:contain;margin:auto}p{color:#746a61}</style>
</head>
<body>
  <main class="wrap">
    <img class="logo" src="/assets/favicon-transparent-v2.png" alt="">
    <h1>BaristaMatch</h1>
    <p>Opening secure sign in…</p>
  </main>
  <script>
    (()=>{
      try{
        const target=decodeURIComponent(location.hash.slice(1));
        const url=new URL(target);
        if(url.hostname!=='lmwqrxoitraofaftpwhe.supabase.co'||url.pathname!=='/auth/v1/authorize')throw new Error('Invalid sign-in destination');
        location.replace(url.href);
      }catch{
        document.querySelector('p').textContent='Unable to start secure sign in. Return to the app and try again.';
      }
    })();
  </script>
</body>
</html>
