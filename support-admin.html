<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support Admin — BaristaMatch</title><link rel="icon" href="/assets/favicon-32-v2.png"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--brown:#321708;--caramel:#a95820;--cream:#fbf7f1;--muted:#746a61;--line:#e7ddd2;--green:#287443;--white:#fff;--red:#a43a32}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:#1c130e;font-family:Arial,sans-serif}.shell{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{background:linear-gradient(180deg,var(--brown),#241006);color:#fff;padding:24px 18px}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px;margin-bottom:34px}.brand img{width:42px;height:42px;background:#fff;border-radius:12px;padding:4px}.side a{display:block;color:#eadfd5;text-decoration:none;padding:11px 12px;border-radius:10px;font-weight:700}.side a.active{background:#fff;color:var(--brown)}.main{min-width:0}.top{background:#fff;border-bottom:1px solid var(--line);padding:18px 26px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}.top h1{font-family:Georgia,serif;margin:0;font-size:28px}.content{padding:24px;max-width:1400px;margin:auto}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px #32170808}.stat{padding:18px}.stat span{display:block;color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.7px}.stat strong{display:block;font-size:30px;margin-top:8px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.toolbar input,.toolbar select{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit}.toolbar input{flex:1;min-width:220px}.desk{display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);gap:18px}.list{overflow:hidden}.ticket{padding:16px 18px;border-bottom:1px solid var(--line);cursor:pointer}.ticket:hover,.ticket.active{background:#f8efe8}.ticket-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.ticket b{font-size:15px}.ticket p{margin:7px 0 5px;font-weight:700}.ticket small{color:var(--muted)}.pill{font-size:11px;font-weight:800;border-radius:99px;padding:6px 9px;background:#f0e4da}.pill.in_progress{background:#fff0ce;color:#805b00}.pill.waiting_user{background:#e9efff;color:#34528a}.pill.resolved,.pill.closed{background:#e4f2e8;color:var(--green)}.detail{padding:22px}.detail h2{font-family:Georgia,serif;margin:0 0 6px;font-size:27px}.meta{color:var(--muted);font-size:13px;margin-bottom:20px}.info{display:grid;grid-template-columns:120px 1fr;gap:10px 14px;padding:16px 0;border-top:1px solid var(--line)}.info strong{font-size:12px;text-transform:uppercase;color:#8a7566}.description{background:#fbf8f5;border:1px solid var(--line);border-radius:12px;padding:16px;line-height:1.55;white-space:pre-wrap}.form{margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}label{display:block;font-weight:800;margin:0 0 7px}select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;background:#fff}textarea{min-height:120px;resize:vertical}.check{display:flex;gap:9px;align-items:center;margin:13px 0}.check input{width:18px;height:18px}.actions{display:flex;gap:10px}.btn{border:0;background:var(--brown);color:#fff;padding:12px 16px;border-radius:10px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55}.history{margin-top:20px}.history-item{border-left:3px solid #e8d7c8;padding:8px 0 8px 12px;margin:10px 0}.history-item small{color:var(--muted)}.empty{padding:40px;text-align:center;color:var(--muted)}.error{background:#fff0ee;color:var(--red);padding:12px;border-radius:10px;margin-bottom:15px}.success{background:#eaf5ed;color:var(--green);padding:12px;border-radius:10px;margin-bottom:15px}
@media(max-width:850px){.shell{display:block}.side{padding:16px;height:auto}.brand{margin-bottom:12px}.side a{display:inline-block}.top{position:static;padding:16px 18px}.content{padding:16px}.stats{grid-template-columns:1fr 1fr}.desk{grid-template-columns:1fr}.detail{padding:18px}.info{grid-template-columns:1fr;gap:4px}.ticket-list-hidden{display:none}.detail-hidden{display:none}}
</style></head><body><div class="shell"><aside class="side"><div class="brand"><img src="/assets/favicon-32-v2.png" alt=""><span>BaristaMatch</span></div><a class="active" href="/support-admin.html">Support Desk</a><a href="/dashboard.html">Dashboard</a></aside><main class="main"><header class="top"><h1>Support Desk</h1><button class="btn" id="refresh">Refresh</button></header><div class="content"><div id="notice"></div><section class="stats"><div class="card stat"><span>New</span><strong id="s-new">0</strong></div><div class="card stat"><span>In progress</span><strong id="s-progress">0</strong></div><div class="card stat"><span>Waiting</span><strong id="s-waiting">0</strong></div><div class="card stat"><span>Resolved / Closed</span><strong id="s-resolved">0</strong></div></section><div class="toolbar"><input id="search" placeholder="Search ticket, email, subject"><select id="filter"><option value="all">All statuses</option><option value="new">New</option><option value="in_progress">In progress</option><option value="waiting_user">Waiting for user</option><option value="resolved">Resolved</option><option value="closed">Closed</option></select></div><section class="desk"><div class="card list" id="list"><div class="empty">Loading support tickets…</div></div><div class="card detail" id="detail"><div class="empty">Select a ticket to review it.</div></div></section></div></main></div><script>
let client,session,tickets=[],updates=[],selected=null;const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={new:'New',in_progress:'In progress',waiting_user:'Waiting for user',resolved:'Resolved',closed:'Closed'};
function note(msg,type='success'){ $('#notice').innerHTML=`<div class="${type}">${esc(msg)}</div>`;setTimeout(()=>$('#notice').innerHTML='',4000)}
async function boot(){try{const cfg=await fetch('/api/public-config').then(r=>r.json());client=supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey);const s=await client.auth.getSession();session=s.data.session;if(!session){location.href='/';return}await load()}catch(e){$('#notice').innerHTML='<div class="error">Could not open the support desk.</div>'}}
async function api(path='',options={}){const r=await fetch('/api/support-admin'+path,{...options,headers:{'Content-Type':'application/json',Authorization:`Bearer ${session.access_token}`,...(options.headers||{})}});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'Request failed');return data}
async function load(){const data=await api();tickets=data.tickets||[];updates=data.updates||[];renderStats();renderList();if(selected){const found=tickets.find(t=>t.ticket_id===selected.ticket_id);selected=found||null;renderDetail()}}
function renderStats(){const c=s=>tickets.filter(t=>t.status===s).length;$('#s-new').textContent=c('new');$('#s-progress').textContent=c('in_progress');$('#s-waiting').textContent=c('waiting_user');$('#s-resolved').textContent=c('resolved')+c('closed')}
function filtered(){const q=$('#search').value.trim().toLowerCase(),f=$('#filter').value;return tickets.filter(t=>(f==='all'||t.status===f)&&(!q||[t.ticket_id,t.email,t.subject,t.issue_type,t.name].join(' ').toLowerCase().includes(q)))}
function renderList(){const rows=filtered();$('#list').innerHTML=rows.length?rows.map(t=>`<div class="ticket ${selected?.ticket_id===t.ticket_id?'active':''}" data-id="${esc(t.ticket_id)}"><div class="ticket-top"><b>${esc(t.ticket_id)}</b><span class="pill ${esc(t.status)}">${esc(labels[t.status]||t.status)}</span></div><p>${esc(t.subject)}</p><small>${esc(t.email)} · ${new Date(t.created_at).toLocaleString()}</small></div>`).join(''):'<div class="empty">No tickets match this filter.</div>';document.querySelectorAll('.ticket').forEach(el=>el.onclick=()=>{selected=tickets.find(t=>t.ticket_id===el.dataset.id);renderList();renderDetail();if(innerWidth<=850){$('#list').classList.add('ticket-list-hidden');$('#detail').classList.remove('detail-hidden')}})}
function renderDetail(){if(!selected){$('#detail').innerHTML='<div class="empty">Select a ticket to review it.</div>';return}const h=updates.filter(u=>u.ticket_id===selected.ticket_id);$('#detail').innerHTML=`<button class="btn" id="back" style="display:${innerWidth<=850?'inline-block':'none'};margin-bottom:15px">← Tickets</button><h2>${esc(selected.subject)}</h2><div class="meta">${esc(selected.ticket_id)} · ${esc(selected.issue_type)} · ${new Date(selected.created_at).toLocaleString()}</div><div class="info"><strong>Customer</strong><span>${esc(selected.name||'Not provided')} — ${esc(selected.email)}</span><strong>Page</strong><span>${esc(selected.page_url||'Not provided')}</span><strong>Browser</strong><span>${esc(selected.browser_info||'Not provided')}</span></div><div class="description">${esc(selected.description)}</div><div class="form"><label>Status</label><select id="status">${Object.entries(labels).map(([v,l])=>`<option value="${v}" ${selected.status===v?'selected':''}>${l}</option>`).join('')}</select><label style="margin-top:14px">Resolution / customer update</label><textarea id="resolution" placeholder="Explain what changed, what was fixed, or what you need from the customer…">${esc(selected.resolution_note||'')}</textarea><label class="check"><input type="checkbox" id="notify" ${['resolved','closed'].includes(selected.status)?'checked':''}> Email this update to the customer</label><div class="actions"><button class="btn" id="save">Save update</button></div></div><div class="history"><h3>History</h3>${h.length?h.map(u=>`<div class="history-item"><b>${esc(labels[u.new_status]||u.new_status)}</b>${u.note?` — ${esc(u.note)}`:''}<br><small>${new Date(u.created_at).toLocaleString()}${u.customer_emailed?' · Customer emailed':''}</small></div>`).join(''):'<div class="empty">No admin updates yet.</div>'}</div>`;$('#save').onclick=save;if($('#back'))$('#back').onclick=()=>{$('#list').classList.remove('ticket-list-hidden');$('#detail').classList.add('detail-hidden')}}
async function save(){const b=$('#save');b.disabled=true;b.textContent='Saving…';try{const data=await api('',{method:'PATCH',body:JSON.stringify({ticket_id:selected.ticket_id,status:$('#status').value,resolution_note:$('#resolution').value,notify_customer:$('#notify').checked})});note(data.customer_emailed?'Ticket updated and customer emailed.':'Ticket updated.');await load()}catch(e){note(e.message,'error')}finally{b.disabled=false;b.textContent='Save update'}}
$('#search').addEventListener('input',renderList);$('#filter').addEventListener('change',renderList);$('#refresh').onclick=load;boot();
</script></body></html>
