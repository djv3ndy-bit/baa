<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Verify your BaristaMatch email address to complete account setup.">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32-v2.png">
<title>Verify your email — BaristaMatch</title>
<style>
:root{--brown:#4a2412;--caramel:#a95820;--cream:#fff6ed;--muted:#746a61;--line:#e3d1c1;--green:#287443;--white:#fff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#fffdf9 0,#f9ecdf 51%,#ecd7c6 100%);color:#1c130e;font-family:Arial,sans-serif}.top{height:76px;background:#fffaf5cc;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:0 20px;backdrop-filter:blur(12px)}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--brown);font:800 22px Georgia,serif}.brand img{width:46px;height:46px;object-fit:contain}.brand b{color:var(--caramel)}main{min-height:calc(100vh - 76px);display:grid;place-items:center;padding:42px 22px 64px}.panel{width:min(100%,600px);background:var(--white);border:1px solid var(--line);border-radius:30px;padding:44px 42px;text-align:center;box-shadow:0 26px 80px #3217081f}.icon{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;margin:0 auto 25px;background:#e6f3e9;border:1px solid #c4dfca;color:var(--green);font-size:37px;font-weight:900}.eyebrow{color:var(--caramel);font-size:12px;font-weight:800;letter-spacing:.14em}.panel h1{margin:12px 0 14px;color:var(--brown);font:700 42px/1.08 Georgia,serif}.lead{margin:0 auto;color:var(--muted);font-size:18px;line-height:1.55;max-width:420px}.button{display:block;width:100%;margin-top:29px;border:0;border-radius:9px;padding:16px;background:linear-gradient(90deg,#a9561f,#b66a2d);color:#fff;text-decoration:none;font-weight:800;font-size:16px}.help{margin:22px 0 0;color:var(--muted);font-size:13px;line-height:1.5}.help strong{color:var(--brown)}@media(max-width:520px){.top{height:66px}.brand{font-size:19px}.brand img{width:38px;height:38px}main{min-height:calc(100vh - 66px);padding:26px 18px 42px}.panel{padding:35px 24px;border-radius:24px}.panel h1{font-size:35px}.lead{font-size:17px}}
</style>
<script defer src="/analytics.js"></script>
</head>
<body>
<header class="top"><a class="brand" href="/"><img src="/assets/favicon-transparent-v2.png" alt=""><span>Barista<b>Match</b></span></a></header>
<main><section class="panel" aria-labelledby="page-title"><div class="icon" aria-hidden="true">✓</div><p class="eyebrow">ACCOUNT CREATED</p><h1 id="page-title">You’re signed up!</h1><p class="lead">Please verify your email. Once verified, log in to open your dashboard.</p><a class="button" href="/login.html">Go to log in</a><p class="help"><strong>Check your inbox</strong> — and your spam folder — for the verification email.</p></section></main>
</body>
</html>
