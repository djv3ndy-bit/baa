<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Business Overview — BaristaMatch</title><link rel="icon" href="/assets/favicon-32-v2.png"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.102.0/dist/umd/supabase.min.js" crossorigin="anonymous"></script><style>
:root{--brown:#321708;--orange:#b76022;--cream:#fbf7f1;--muted:#746a61;--line:#e7ddd2;--green:#287443}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:#20130c;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.shell{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.side{padding:24px 18px;background:linear-gradient(180deg,var(--brown),#1f0c04);color:#fff}.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:900;margin-bottom:32px}.brand img{width:42px;height:42px;background:#fff;border-radius:12px;padding:4px}.side a{display:block;color:#e8d9ce;text-decoration:none;padding:12px;border-radius:11px;font-weight:750;margin:4px 0}.side a.active{background:#fff;color:var(--brown)}main{min-width:0}.top{height:82px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 30px}.top h1{font:800 30px Georgia,serif;margin:0}.refresh{border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 15px;font-weight:800;color:var(--brown)}.content{max-width:1380px;margin:auto;padding:28px}.intro{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:20px}.intro h2{font-size:28px;margin:0 0 5px}.intro p,.fresh{color:var(--muted);margin:0;font-size:13px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:0 9px 28px #32170809}.metric{padding:18px}.metric span{color:var(--muted);font-size:11px;font-weight:850;text-transform:uppercase;letter-spacing:.08em}.metric strong{display:block;font-size:34px;margin-top:8px}.metric small{color:var(--green);font-weight:750}.grid{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;margin-top:16px}.panel{padding:21px}.panel h3{margin:0 0 18px;font-size:18px}.chart{height:220px;display:flex;align-items:end;gap:5px;border-bottom:1px solid var(--line);padding-top:20px}.bar{flex:1;min-width:4px;background:linear-gradient(var(--orange),#df9b69);border-radius:5px 5px 0 0;position:relative}.bar:hover:after{content:attr(data-label);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--brown);color:#fff;padding:5px 7px;border-radius:7px;font-size:10px;white-space:nowrap}.list{display:grid;gap:11px}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}.row-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:700}.row strong{font-size:13px}.track{height:6px;background:#f1e8e1;border-radius:99px;margin-top:5px;overflow:hidden}.fill{height:100%;background:var(--orange);border-radius:99px}.privacy{margin-top:16px;padding:16px 20px;color:var(--muted);font-size:12px;line-height:1.5}.error{padding:18px;background:#fff0ee;color:#9c332d;border-radius:12px}.loading{padding:80px;text-align:center;color:var(--muted)}@media(max-width:950px){.shell{display:block}.side{display:flex;align-items:center;gap:4px;padding:12px;overflow:auto}.brand{margin:0 12px 0 0;white-space:nowrap}.brand img{width:35px;height:35px}.side a{white-space:nowrap}.metrics{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.top{padding:0 18px}.content{padding:18px}}@media(max-width:520px){.metrics{grid-template-columns:1fr 1fr;gap:10px}.metric{padding:14px}.metric strong{font-size:28px}.intro{display:block}.fresh{margin-top:8px}.chart{height:170px}}
.section-title{font-size:20px;margin:28px 0 12px;color:var(--brown)}.section-title:first-child{margin-top:0}.metrics .metric:nth-child(8n+1){background:linear-gradient(135deg,#fff,#fff0e5);border-color:#efc9aa}.metrics .metric:nth-child(8n+2){background:linear-gradient(135deg,#fff,#eaf5ed);border-color:#b9d8c1}.metrics .metric:nth-child(8n+3){background:linear-gradient(135deg,#fff,#f2edff);border-color:#d2c4ef}.metrics .metric:nth-child(8n+4){background:linear-gradient(135deg,#fff,#fff6ce);border-color:#ead785}.metrics .metric:nth-child(8n+5){background:linear-gradient(135deg,#fff,#e8f4ff);border-color:#b8d5eb}.metrics .metric:nth-child(8n+6){background:linear-gradient(135deg,#fff,#ffecef);border-color:#e9bac2}.metrics .metric:nth-child(8n+7){background:linear-gradient(135deg,#fff,#e9f7f5);border-color:#b7ded8}.metrics .metric:nth-child(8n){background:linear-gradient(135deg,#fff,#f6ece4);border-color:#ddc2ae}.trend-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.trend-panel{padding:21px}.trend-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}.trend-head h3{margin:0;font-size:17px}.legend-dot{width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:6px}.mini-label{font-size:11px;color:var(--muted)}@media(max-width:760px){.trend-grid{grid-template-columns:1fr}.top h1{font-size:23px}}
.marketing{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.insight{padding:20px;background:linear-gradient(135deg,#321708,#673515);color:#fff}.insight:nth-child(2){background:linear-gradient(135deg,#226241,#3f9a68)}.insight:nth-child(3){background:linear-gradient(135deg,#54409b,#856bd0)}.insight small{color:#eadfd5;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.insight strong{font-size:30px;display:block;margin:8px 0 4px}.insight p{font-size:12px;margin:0;color:#f4ece7}.week-labels{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-top:7px}.funnel{padding:22px}.funnel-row{display:grid;grid-template-columns:150px 1fr 60px;gap:12px;align-items:center;margin:12px 0}.funnel-track{height:24px;background:#f1e8e1;border-radius:7px;overflow:hidden}.funnel-fill{height:100%;border-radius:7px}@media(max-width:760px){.marketing{grid-template-columns:1fr}.funnel-row{grid-template-columns:100px 1fr 45px}}
</style>
</head><body><div class="shell"><aside class="side"><div class="brand"><img src="/assets/favicon-32-v2.png" alt=""><span>BaristaMatch</span></div><a class="active" href="/owner-dashboard">Overview</a><a href="/support-admin">Support</a><a href="/dashboard">Platform</a></aside><main><header class="top"><h1>Business Overview</h1><div style="display:flex;gap:9px"><button class="refresh" id="refresh">Refresh</button><button class="refresh" id="logout">Log out</button></div></header><div class="content"><div class="intro"><div><h2>Growth and marketplace health</h2><p>A private view of your platform’s activity.</p></div><div class="fresh" id="fresh"></div></div><div id="view" class="loading">Loading private analytics…</div></div></main></div><script>
let client,session;const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=new Intl.NumberFormat();
function metric(label,value,note='All time'){return `<article class="card metric"><span>${esc(label)}</span><strong>${fmt.format(value||0)}</strong><small>${esc(note)}</small></article>`}
function ranking(title,rows,color='#b76022'){const max=Math.max(1,...rows.map(row=>row.value));return `<article class="card panel"><h3>${esc(title)}</h3><div class="list">${rows.length?rows.map(row=>`<div class="row"><div><div class="row-label">${esc(row.label)}</div><div class="track"><div class="fill" style="width:${Math.max(3,row.value/max*100)}%;background:${color}"></div></div></div><strong>${fmt.format(row.value)}</strong></div>`).join(''):'<div class="fresh">No data yet.</div>'}</div></article>`}

function weeklyTrend(title,key,color){const rows=dataCache.weekly||[],max=Math.max(1,...rows.map(row=>row[key]||0)),total=rows.reduce((sum,row)=>sum+(row[key]||0),0);return `<article class="card trend-panel"><div class="trend-head"><h3>${esc(title)}</h3><span class="mini-label"><i class="legend-dot" style="background:${color}"></i>${fmt.format(total)} over 8 weeks</span></div><div class="chart">${rows.map(row=>`<div class="bar" style="height:${Math.max(2,(row[key]||0)/max*100)}%;background:${color}" data-label="Week of ${esc(row.week_start)} · ${row[key]||0}"></div>`).join('')}</div><div class="week-labels"><span>8 weeks ago</span><span>This week</span></div></article>`}
function pct(value,total){return total?Math.round(value/total*100):0}function growth(now,before){if(!before)return now?'+100%':'0%';const value=Math.round((now-before)/before*100);return `${value>0?'+':''}${value}%`}
function funnelRow(label,value,max,color){return `<div class="funnel-row"><strong>${esc(label)}</strong><div class="funnel-track"><div class="funnel-fill" style="width:${Math.max(value?4:0,value/max*100)}%;background:${color}"></div></div><b>${fmt.format(value)}</b></div>`}

let dataCache={weekly:[]};function render(data){dataCache=data;const m=data.metrics,interest=m.applications+m.interests,matchRate=pct(m.matches,interest),messagesPerMatch=m.matches?Math.round(m.messages/m.matches*10)/10:0,signupRate=pct(m.signups,m.website_30d),funnelMax=Math.max(1,m.website_30d,m.signups,interest,m.matches);document.getElementById('view').className='';document.getElementById('view').innerHTML=`<h3 class="section-title">Marketing pulse</h3><section class="marketing"><article class="card insight"><small>Website growth</small><strong>${growth(m.website_7d,m.website_prev_7d)}</strong><p>${fmt.format(m.website_7d)} views this week versus ${fmt.format(m.website_prev_7d)} last week</p></article><article class="card insight"><small>Visitor → signup</small><strong>${signupRate}%</strong><p>${fmt.format(m.signups)} total members from ${fmt.format(m.website_30d)} recent website views</p></article><article class="card insight"><small>Interest → match</small><strong>${matchRate}%</strong><p>${fmt.format(m.matches)} mutual matches from ${fmt.format(interest)} interest signals</p></article></section><h3 class="section-title">Growth snapshot</h3><section class="metrics">${metric('Total signups',m.signups,`${m.signups_7d} this week · ${growth(m.signups_7d,m.signups_prev_7d)} growth`)}${metric('Baristas',m.baristas)}${metric('Café owners',m.cafes)}${metric('Discoverable profiles',m.discoverable,'Ready to match')}${metric('Website · 7 days',m.website_7d,'Anonymous page views')}${metric('Website · 30 days',m.website_30d,'Anonymous page views')}${metric('App · 7 days',m.app_7d,'Screen activity')}${metric('App · 30 days',m.app_30d,'Screen activity')}</section><h3 class="section-title">Marketplace and engagement</h3><section class="metrics">${metric('Active jobs',m.active_jobs,`${m.jobs} total · ${m.jobs_7d} this week`)}${metric('Applications',m.applications)}${metric('Profile interests',m.interests)}${metric('Mutual matches',m.matches,`${matchRate}% of interest signals`)}${metric('Messages',m.messages,`${m.messages_7d} this week`)}${metric('Messages per match',messagesPerMatch,'Conversation depth')}${metric('Open support',m.support_open,'Needs attention')}${metric('Notifications sent',m.notifications)}</section><h3 class="section-title">Weekly performance · last 8 weeks</h3><section class="trend-grid">${weeklyTrend('Website activity','website_views','#e86b24')}${weeklyTrend('App activity','app_views','#287fb8')}${weeklyTrend('New signups','signups','#2d8b57')}${weeklyTrend('Jobs posted','jobs','#d6a21f')}${weeklyTrend('Matches created','matches','#d14f68')}${weeklyTrend('Messages sent','messages','#7657c8')}</section><h3 class="section-title">Marketing conversion funnel</h3><article class="card funnel">${funnelRow('Website views',m.website_30d,funnelMax,'linear-gradient(90deg,#e86b24,#f2ad69)')}${funnelRow('Members',m.signups,funnelMax,'linear-gradient(90deg,#2d8b57,#7bc999)')}${funnelRow('Interest signals',interest,funnelMax,'linear-gradient(90deg,#d6a21f,#efd16b)')}${funnelRow('Mutual matches',m.matches,funnelMax,'linear-gradient(90deg,#d14f68,#ec8da0)')}</article><h3 class="section-title">Audience and acquisition</h3><section class="grid">${ranking('Traffic sources · website',data.referrers,'#b27a1d')}${ranking('Top website pages',data.top_pages,'#e86b24')}${ranking('Top app screens',data.app_screens,'#287fb8')}${ranking('Website and app devices',data.devices,'#287fb8')}${ranking('Member mix',data.role_mix,'#7657c8')}${ranking('Job status',data.job_mix,'#2d8b57')}</section><article class="card privacy"><strong>How to use this for marketing</strong><br>Compare weekly website views with signups to judge campaign quality. Watch traffic sources to decide where to promote. Use the barista/café mix to see which audience needs more outreach. App reporting begins with the next published app update, so early app bars will start at zero and grow with real use.<br><br><strong>Privacy-friendly measurement</strong><br>Reporting stores only page or app screen, broad device type, referring website, and time—never names, emails, locations, message content, IP addresses, or advertising fingerprints.</article>`;document.getElementById('fresh').textContent='Updated '+new Date(data.generated_at).toLocaleString()}

async function load(){const view=document.getElementById('view');view.className='loading';view.textContent='Refreshing analytics…';const response=await fetch('/api/analytics',{headers:{Authorization:`Bearer ${session.access_token}`},cache:'no-store'}),data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Could not load analytics');render(data)}
async function boot(){try{const config=await fetch('/api/config',{cache:'no-store'}).then(r=>r.json());client=supabase.createClient(config.supabaseUrl,config.supabasePublishableKey);const result=await client.auth.getSession();session=result.data.session;if(!session)return location.replace('/login?reason=required');await load()}catch(error){document.getElementById('view').className='error';document.getElementById('view').textContent=error.message||'Could not open the owner dashboard.'}}
document.getElementById('refresh').onclick=()=>load().catch(error=>{document.getElementById('view').className='error';document.getElementById('view').textContent=error.message});document.getElementById('logout').onclick=async()=>{const button=document.getElementById('logout');button.disabled=true;button.textContent='Signing out…';await client?.auth.signOut().catch(()=>{});location.replace('/')};boot();
</script></body></html>
