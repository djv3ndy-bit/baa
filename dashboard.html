<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Your BaristaMatch dashboard.">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32-v2.png">
<title>Dashboard — BaristaMatch</title>
<style>
:root{--brown:#321708;--brown2:#5a2d13;--caramel:#a95820;--cream:#fbf7f1;--green:#287443;--muted:#746a61;--line:#e7ddd2;--white:#fff;--soft:#f3e8de}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:#1c130e;font-family:Arial,sans-serif}
a{text-decoration:none;color:inherit}
button,input,textarea{font:inherit}button{cursor:pointer}
.loading{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:24px;text-align:center;background:var(--cream);font-weight:700;color:var(--muted)}
.loading p{margin:0 0 16px}.loading-actions{display:flex;justify-content:center;gap:10px}.loading-actions a{text-decoration:none}
.shell{min-height:100vh;display:grid;grid-template-columns:248px minmax(0,1fr)}
.side{position:sticky;top:0;height:100vh;background:linear-gradient(180deg,var(--brown),#241006);color:#fff;padding:22px 16px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:11px;font-size:22px;font-weight:800;margin:0 8px 28px;white-space:nowrap}
.brand img{width:42px;height:42px;object-fit:contain;background:#fff;border-radius:12px;padding:4px}
.brand b{color:#e89a62}
.menu{display:grid;gap:6px}
.menu button{border:0;background:transparent;color:#eadfd5;text-align:left;padding:12px 14px;border-radius:10px;font-weight:700;transition:.15s ease}
.menu button.active,.menu button:hover{background:#fff;color:var(--brown)}
.sidefoot{margin-top:auto;padding:16px 10px 0;border-top:1px solid #ffffff21}
.sidefoot small{display:block;color:#d5c2b4;margin-bottom:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logout{border:1px solid #ffffff55;background:transparent;color:white;padding:9px 13px;border-radius:9px;font-weight:700}
.main{min-width:0}
.top{min-height:74px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:14px 28px;position:sticky;top:0;z-index:20}
.top h1{margin:0;font-family:Georgia,serif;font-size:27px}
.rolebadge{background:#f4e7dc;color:#7e3f18;padding:8px 12px;border-radius:99px;font-size:12px;font-weight:800}
.content{padding:28px;max-width:1240px;margin:auto}
.welcome{background:linear-gradient(135deg,#fff,#f7eee7);border:1px solid var(--line);border-radius:22px;padding:26px;display:flex;justify-content:space-between;gap:22px;align-items:center;margin-bottom:18px;box-shadow:0 12px 34px #3217080b}
.welcome h2{font-family:Georgia,serif;font-size:31px;margin:0 0 7px}
.welcome p{margin:0;color:var(--muted);line-height:1.5}
.primary{border:0;background:var(--brown);color:#fff;padding:12px 17px;border-radius:10px;font-weight:800;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 8px 24px #32170808}
.stat{min-height:116px;display:flex;flex-direction:column;justify-content:center}
.stat span{font-size:13px;color:var(--muted);font-weight:700}
.stat strong{display:block;font-size:30px;margin-top:7px}
.grid{display:grid;grid-template-columns:1.45fr .85fr;gap:18px}
.card h3{margin:0 0 14px;font-size:20px}
.item{display:flex;gap:13px;align-items:center;padding:14px 0;border-top:1px solid #eee4da}
.item:first-of-type{border-top:0}
.avatar{width:42px;height:42px;border-radius:12px;background:#f3e6dc;display:grid;place-items:center;font-size:20px;flex:0 0 auto}
.itemtext{min-width:0;flex:1}.itemtext b,.itemtext small{display:block}.itemtext small{color:var(--muted);margin-top:4px;line-height:1.45}
.pill{font-size:11px;font-weight:800;color:var(--green);background:#e7f4ea;padding:6px 8px;border-radius:99px;white-space:nowrap}
.progress{height:9px;background:#eee5dd;border-radius:99px;overflow:hidden;margin:12px 0 8px}.progress i{display:block;height:100%;width:35%;background:var(--caramel)}
.empty{color:var(--muted);line-height:1.6;margin:0 0 12px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.section-head h2{font-family:Georgia,serif;font-size:31px;margin:0 0 6px}.section-head p{color:var(--muted);margin:0}.empty-state{text-align:center;padding:52px 24px}.empty-state .avatar{margin:0 auto 16px;width:58px;height:58px;font-size:27px}.empty-state h3{margin:0 0 8px}.empty-state p{max-width:520px;margin:0 auto 18px;color:var(--muted);line-height:1.6}.search{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:11px;background:#fff;margin-bottom:16px}.profile-dialog{border:0;border-radius:20px;padding:0;width:min(680px,calc(100% - 28px));max-height:90vh;box-shadow:0 28px 90px #0005}.profile-dialog::backdrop{background:#211208aa}.profile-form{padding:26px}.profile-form h2{font-family:Georgia,serif;margin:0 0 6px;font-size:29px}.profile-form>p{color:var(--muted);margin:0 0 18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.profile-form label{display:block;font-size:13px;font-weight:800}.profile-form input,.profile-form textarea{width:100%;margin-top:7px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff}.profile-form textarea{min-height:90px;resize:vertical}.form-wide{grid-column:1/-1}.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.secondary{border:1px solid #c9ad99;background:#fff;color:var(--brown);padding:11px 15px;border-radius:10px;font-weight:800}.form-status{min-height:20px;margin:14px 0 0;color:var(--green);font-weight:700}.profile-hero{display:flex;gap:18px;align-items:center}.strength-score{width:82px;height:82px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--green) var(--score),#eee5dd 0);position:relative;flex:0 0 auto}.strength-score:after{content:"";position:absolute;inset:8px;background:#fff;border-radius:50%}.strength-score strong{position:relative;z-index:1;font-size:20px}.checklist{display:grid;gap:9px;margin-top:16px}.check{display:flex;gap:9px;align-items:center;color:var(--muted)}.check.done{color:var(--green);font-weight:700}.video-preview{width:100%;max-height:330px;border-radius:14px;background:#160d08;margin-top:14px}.mobile-nav{display:none}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:sticky;top:0;z-index:30;height:auto;padding:11px 14px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px}
  .brand{margin:0;font-size:20px}.brand img{width:40px;height:40px}
  .menu{grid-column:1/-1;display:flex;gap:7px;overflow-x:auto;padding-top:8px;scrollbar-width:none}.menu::-webkit-scrollbar{display:none}
  .menu button{flex:0 0 auto;padding:8px 12px;border:1px solid #ffffff24;border-radius:999px;font-size:12px}
  .sidefoot{margin:0;padding:0;border:0;display:flex;align-items:center;gap:8px}.sidefoot small{display:none}
  .top{position:static;padding:16px 18px;min-height:66px}.top h1{font-size:26px}
  .content{padding:18px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .grid{grid-template-columns:1fr}
}
@media(max-width:560px){
  .brand span{font-size:18px}.brand img{width:38px;height:38px}
  .logout{padding:8px 11px;font-size:13px}
  .top{padding:15px 16px}.top h1{font-size:24px}.rolebadge{font-size:11px;padding:7px 10px}
  .content{padding:16px 14px 30px}
  .welcome{padding:20px;align-items:flex-start;flex-direction:column;border-radius:18px}.welcome h2{font-size:27px}.welcome p{font-size:15px}.primary{width:100%}.section-head{align-items:flex-start;flex-direction:column}.section-head h2{font-size:27px}
  .stats{gap:10px}.card{padding:16px;border-radius:14px}.stat{min-height:100px}.stat strong{font-size:27px}
  .grid{gap:12px}.card h3{font-size:19px}.item{align-items:flex-start}.pill{margin-left:auto}.form-grid{grid-template-columns:1fr}.form-wide{grid-column:auto}.profile-hero{align-items:flex-start}
}
</style>
</head>
<body>
<div class="loading" id="loading" role="status" aria-live="polite"><div><p id="loading-message">Opening your BaristaMatch workspace…</p><div class="loading-actions" id="loading-actions" hidden><a class="primary" href="/?login=required">Log in</a><button class="logout" type="button" onclick="location.reload()">Try again</button></div></div></div>
<div class="shell" id="app" hidden>
  <aside class="side">
    <a class="brand" href="/"><img src="/assets/favicon-transparent-v2.png" alt="BaristaMatch logo"><span>Barista<b>Match</b></span></a>
    <nav class="menu" id="menu"></nav>
    <div class="sidefoot"><small id="email"></small><button class="logout" id="logout">Log out</button></div>
  </aside>
  <main class="main">
    <header class="top"><h1>Dashboard</h1><span class="rolebadge" id="role-badge"></span></header>
    <section class="content" id="content"></section>
  </main>
</div>
<dialog class="profile-dialog" id="profile-dialog">
<form class="profile-form" id="profile-form">
<h2 id="profile-form-title">Build your profile</h2><p>Tell the other side what makes you a great match.</p>
<div class="form-grid">
<label id="profile-name-label">Display name<input name="name" maxlength="80" required></label>
<label>Location<input name="location" maxlength="120" placeholder="Brooklyn, NY" required></label>
<label class="form-wide">About you<textarea name="bio" maxlength="700" placeholder="Share your story, style, and what you are looking for."></textarea></label>
<label id="skills-field">Skills<input name="skills" placeholder="Latte art, espresso, customer service"></label>
<label id="availability-field">Availability<input name="availability" placeholder="Weekday mornings and weekends"></label>
<label id="experience-field" class="form-wide">Experience<textarea name="experience" maxlength="700" placeholder="Coffee shops, equipment, training, and highlights"></textarea></label>
<label id="pay-field">Desired pay<input name="pay_expectation" maxlength="80" placeholder="$20–$24/hour plus tips"></label>
<label id="video-field">Optional coffee video<input name="video" type="file" accept="video/mp4,video/quicktime,video/webm"><small>Up to 50 MB · MP4, MOV, or WebM</small></label>
</div>
<p class="form-status" id="profile-status" role="status"></p>
<div class="form-actions"><button class="secondary" type="button" id="profile-cancel">Cancel</button><button class="primary" type="submit">Save profile</button></div>
</form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.102.0/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
<script>
const views={
barista:{label:'Barista account',menu:['Overview','Find Jobs','Matches','Profile Views','Messages','My Profile'],html:`<div class="welcome"><div><h2>Welcome back</h2><p>Your next great café opportunity starts here.</p></div><button class="primary">Complete your profile</button></div><div class="stats"><article class="card stat"><span>Profile strength</span><strong>35%</strong></article><article class="card stat"><span>New jobs</span><strong>0</strong></article><article class="card stat"><span>Matches</span><strong>0</strong></article><article class="card stat"><span>Messages</span><strong>0</strong></article></div><div class="grid"><article class="card"><h3>Recommended opportunities</h3><p class="empty">New local café positions that fit your availability and skills will appear here.</p><div class="item"><div class="avatar">☕</div><div class="itemtext"><b>Build your profile to start matching</b><small>Add your experience, skills, location, desired pay, and availability.</small></div><span class="pill">Next step</span></div></article><article class="card"><h3>Profile progress</h3><b>Let cafés discover you</b><div class="progress"><i></i></div><p class="empty">Add a photo, work history, skills, and weekly availability to improve your matches.</p></article></div>`},
cafe_owner_manager:{label:'Café owner / manager',menu:['Overview','Job Posts','Candidates','Matches','Messages','Café Profile'],html:`<div class="welcome"><div><h2>Welcome to your hiring workspace</h2><p>Post roles, review baristas, and manage every conversation.</p></div><button class="primary">Post a job</button></div><div class="stats"><article class="card stat"><span>Active jobs</span><strong>0</strong></article><article class="card stat"><span>New candidates</span><strong>0</strong></article><article class="card stat"><span>Matches</span><strong>0</strong></article><article class="card stat"><span>Messages</span><strong>0</strong></article></div><div class="grid"><article class="card"><h3>Hiring activity</h3><p class="empty">Candidates and matches will appear here after you publish your first position.</p><div class="item"><div class="avatar">📋</div><div class="itemtext"><b>Create your first job post</b><small>Add pay, tips, schedule, location, and required coffee skills.</small></div><span class="pill">Get started</span></div></article><article class="card"><h3>Café setup</h3><b>Make your café stand out</b><div class="progress"><i></i></div><p class="empty">Add your café name, logo, location, team culture, and photos before reviewing candidates.</p></article></div>`}}
const sectionPages={
barista:{
'Find Jobs':`<div class="section-head"><div><h2>Find Jobs</h2><p>Discover café opportunities that fit your skills and schedule.</p></div></div><input class="search" type="search" placeholder="Search by café, job title, or location"><article class="card empty-state"><div class="avatar">☕</div><h3>No jobs to show yet</h3><p>New local café jobs will appear here as soon as they are posted.</p><button class="primary" data-go="My Profile">Complete your profile</button></article>`,
'Matches':`<div class="section-head"><div><h2>Your Matches</h2><p>Mutual interest from you and a café will appear here.</p></div></div><article class="card empty-state"><div class="avatar">🤝</div><h3>No matches yet</h3><p>Browse jobs and show interest to start creating matches.</p><button class="primary" data-go="Find Jobs">Browse jobs</button></article>`,
'Messages':`<div class="section-head"><div><h2>Messages</h2><p>Chat with cafés after you match.</p></div></div><div class="grid"><article class="card"><h3>Conversations</h3><p class="empty">Your conversations will appear here.</p></article><article class="card empty-state"><div class="avatar">💬</div><h3>No conversation selected</h3><p>Choose a conversation when you receive your first message.</p></article></div>`,
'My Profile':`<div class="section-head"><div><h2>My Profile</h2><p>Help cafés understand your experience and availability.</p></div><button class="primary">Edit profile</button></div><div class="grid"><article class="card"><h3>Profile details</h3><div class="item"><div class="avatar">👤</div><div class="itemtext"><b>Your barista profile</b><small>Add your name, location, experience, skills, and desired schedule.</small></div></div></article><article class="card"><h3>Profile strength</h3><b>35% complete</b><div class="progress"><i></i></div><p class="empty">Complete your details to improve your matches.</p></article></div>`
},
cafe_owner_manager:{
'Job Posts':`<div class="section-head"><div><h2>Job Posts</h2><p>Create and manage café opportunities.</p></div><button class="primary">Post a job</button></div><article class="card empty-state"><div class="avatar">📋</div><h3>No job posts yet</h3><p>Your active and closed job posts will appear here.</p><button class="primary">Create your first job</button></article>`,
'Candidates':`<div class="section-head"><div><h2>Candidates</h2><p>Review baristas interested in your open roles.</p></div></div><article class="card empty-state"><div class="avatar">👥</div><h3>No candidates yet</h3><p>Publish a job to begin receiving interested baristas.</p><button class="primary" data-go="Job Posts">Go to job posts</button></article>`,
'Matches':`<div class="section-head"><div><h2>Matches</h2><p>Manage baristas your café has matched with.</p></div></div><article class="card empty-state"><div class="avatar">🤝</div><h3>No matches yet</h3><p>Candidate matches will appear here after mutual interest.</p></article>`,
'Messages':`<div class="section-head"><div><h2>Messages</h2><p>Talk with matched baristas and coordinate interviews.</p></div></div><div class="grid"><article class="card"><h3>Conversations</h3><p class="empty">Your conversations will appear here.</p></article><article class="card empty-state"><div class="avatar">💬</div><h3>No conversation selected</h3><p>Choose a conversation when a candidate sends a message.</p></article></div>`,
'Café Profile':`<div class="section-head"><div><h2>Café Profile</h2><p>Show baristas what makes your workplace special.</p></div><button class="primary">Edit café profile</button></div><div class="grid"><article class="card"><h3>Café details</h3><div class="item"><div class="avatar">🏪</div><div class="itemtext"><b>Your café</b><small>Add your café name, location, culture, photos, and contact details.</small></div></div></article><article class="card"><h3>Profile strength</h3><b>35% complete</b><div class="progress"><i></i></div><p class="empty">A complete profile helps attract the right baristas.</p></article></div>`
}};
let activeClient,currentUser,currentRole,currentView,currentProfile={},candidateProfiles=[],profileViews=[],currentSection='Overview';
const profileFields={barista:['display_name','location','bio','skills','availability','experience','pay_expectation','video_path'],cafe_owner_manager:['cafe_name','location','bio','skills','experience','video_path']};
function profileStrength(){const fields=profileFields[currentRole],complete=fields.filter(key=>Array.isArray(currentProfile[key])?currentProfile[key].length:Boolean(currentProfile[key])).length;return Math.round(complete/fields.length*100)}
function profileName(){return currentProfile.display_name||currentProfile.cafe_name||(currentRole==='barista'?'Your barista profile':'Your café')}
function checklist(){return profileFields[currentRole].map(key=>{const done=Array.isArray(currentProfile[key])?currentProfile[key].length:Boolean(currentProfile[key]);const labels={display_name:'Add your name',cafe_name:'Add your café name',location:'Add your location',bio:'Tell your story',skills:'Add skills and specialties',availability:'Set your availability',experience:'Share your experience',pay_expectation:'Add desired pay',video_path:'Add an optional coffee video'};return `<div class="check ${done?'done':''}">${done?'✓':'○'} <span>${labels[key]}</span></div>`}).join('')}
function overviewHtml(view){const score=profileStrength();let html=view.html.replace(/35%/g,score+'%');if(currentRole==='barista'){html=html.replace('<button class="primary">Complete your profile</button>',`<button class="primary" data-edit-profile>${score===100?'Edit your profile':'Complete your profile'}</button>`);html=html.replace('<span>New jobs</span><strong>0</strong>',`<span>Profile views</span><strong>${profileViews.length}</strong>`)}else html=html.replace('<button class="primary">Post a job</button>','<button class="primary" data-go="Job Posts">Post a job</button>');return html}
function profileHtml(){const score=profileStrength(),video=currentProfile.video_path?'<p class="empty">Your private coffee video is saved. Signed playback is available while you are logged in.</p>':'<p class="empty">Add a 15–60 second clip making a drink, steaming milk, dialing in espresso, or showing your café atmosphere.</p>';return `<div class="section-head"><div><h2>${currentRole==='barista'?'My Profile':'Café Profile'}</h2><p>Make a memorable first impression.</p></div><button class="primary" data-edit-profile>Edit profile</button></div><div class="grid"><article class="card"><div class="profile-hero"><div class="strength-score" style="--score:${score}%"><strong>${score}%</strong></div><div><h3>${escapeHtml(profileName())}</h3><p class="empty">${escapeHtml(currentProfile.bio||'Add a short introduction to bring your profile to life.')}</p></div></div><div class="checklist">${checklist()}</div></article><article class="card"><h3>☕ Coffee showcase</h3>${video}<button class="secondary" data-edit-profile>${currentProfile.video_path?'Replace video':'Add optional video'}</button><div class="item"><div class="avatar">✨</div><div class="itemtext"><b>Profile boost</b><small>A complete profile builds trust and helps better matches happen.</small></div></div></article></div>`}
function profileViewsHtml(){const rows=profileViews.map(view=>{const cafe=view.viewer||{},when=new Date(view.viewed_at).toLocaleString([], {dateStyle:'medium',timeStyle:'short'});return `<div class="item"><div class="avatar">🏪</div><div class="itemtext"><b>${escapeHtml(cafe.cafe_name||'A café')}</b><small>${escapeHtml(cafe.location||'Location not added')} · Viewed ${escapeHtml(when)}</small></div><span class="pill">Viewed you</span></div>`}).join('');const unique=new Set(profileViews.map(view=>view.viewer_id)).size;return `<div class="section-head"><div><h2>Profile Views</h2><p>See which cafés are discovering your work.</p></div></div><div class="stats"><article class="card stat"><span>Total views</span><strong>${profileViews.length}</strong></article><article class="card stat"><span>Different cafés</span><strong>${unique}</strong></article></div><article class="card"><h3>Recent visitors</h3>${rows||'<div class="empty-state"><div class="avatar">👀</div><h3>No profile views yet</h3><p>Complete your profile and add a coffee video to stand out when cafés browse candidates.</p><button class="primary" data-go="My Profile">Improve your profile</button></div>'}</article>`}
function candidatesHtml(){const cards=candidateProfiles.map(profile=>`<div class="item"><div class="avatar">☕</div><div class="itemtext"><b>${escapeHtml(profile.display_name||'Barista')}</b><small>${escapeHtml(profile.location||'Location not added')} · ${escapeHtml((profile.skills||[]).slice(0,3).join(' · ')||'Skills coming soon')}</small></div><button class="secondary" data-view-barista="${profile.id}">View profile</button></div>`).join('');return `<div class="section-head"><div><h2>Candidates</h2><p>Discover baristas and learn what makes them special.</p></div></div><article class="card"><h3>Barista community</h3>${cards||'<div class="empty-state"><div class="avatar">👥</div><h3>No completed barista profiles yet</h3><p>New baristas will appear here after they create a profile.</p></div>'}</article>`}
async function openCandidate(id){const profile=candidateProfiles.find(item=>item.id===id);if(!profile)return;const {error}=await activeClient.from('profile_views').insert({viewer_id:currentUser.id,viewed_profile_id:id});if(error)console.error('Could not record profile view:',error);document.querySelector('.top h1').textContent=profile.display_name||'Barista Profile';document.getElementById('content').innerHTML=`<div class="section-head"><div><h2>${escapeHtml(profile.display_name||'Barista')}</h2><p>${escapeHtml(profile.location||'Location not added')}</p></div><button class="secondary" data-go="Candidates">← Back to candidates</button></div><div class="grid"><article class="card"><h3>About</h3><p class="empty">${escapeHtml(profile.bio||'This barista is still writing their introduction.')}</p><h3>Skills</h3><p class="empty">${escapeHtml((profile.skills||[]).join(' · ')||'Skills coming soon')}</p><h3>Experience</h3><p class="empty">${escapeHtml(profile.experience||'Experience details coming soon')}</p></article><article class="card"><h3>Availability</h3><p class="empty">${escapeHtml(profile.availability||'Not added')}</p><h3>Desired pay</h3><p class="empty">${escapeHtml(profile.pay_expectation||'Open to discussion')}</p><div class="item"><div class="avatar">${profile.video_path?'🎬':'☕'}</div><div class="itemtext"><b>${profile.video_path?'Coffee video available':'Coffee showcase'}</b><small>${profile.video_path?'This barista added a private coffee-making video.':'No video added yet.'}</small></div></div></article></div>`;bindContentActions();window.scrollTo(0,0)}
async function loadMarketplaceData(){if(currentRole==='barista'){const {data,error}=await activeClient.from('profile_views').select('id,viewer_id,viewed_at,viewer:profiles!profile_views_viewer_id_fkey(cafe_name,location)').eq('viewed_profile_id',currentUser.id).order('viewed_at',{ascending:false}).limit(100);if(error)throw error;profileViews=data||[]}else{const {data,error}=await activeClient.from('profiles').select('id,display_name,location,bio,skills,availability,experience,pay_expectation,video_path').eq('role','barista').order('updated_at',{ascending:false}).limit(100);if(error)throw error;candidateProfiles=data||[]}}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
function bindContentActions(){document.getElementById('content').querySelectorAll('[data-go]').forEach(button=>button.onclick=()=>openSection(button.dataset.go,currentView,currentRole));document.getElementById('content').querySelectorAll('[data-edit-profile]').forEach(button=>button.onclick=openProfileEditor);document.getElementById('content').querySelectorAll('[data-view-barista]').forEach(button=>button.onclick=()=>openCandidate(button.dataset.viewBarista))}
function openSection(name,view,role){currentSection=name;document.querySelectorAll('#menu button').forEach(button=>button.classList.toggle('active',button.dataset.section===name));document.querySelector('.top h1').textContent=name==='Overview'?'Dashboard':name;const isProfile=name==='My Profile'||name==='Café Profile';document.getElementById('content').innerHTML=name==='Overview'?overviewHtml(view):isProfile?profileHtml():name==='Profile Views'?profileViewsHtml():name==='Candidates'?candidatesHtml():sectionPages[role][name];bindContentActions();window.scrollTo(0,0)}
async function loadProfile(){const {data,error}=await activeClient.from('profiles').select('*').eq('id',currentUser.id).maybeSingle();if(error)throw error;if(data){currentProfile=data;return}const starter={id:currentUser.id,role:currentRole,updated_at:new Date().toISOString()};const {error:createError}=await activeClient.from('profiles').insert(starter);if(createError)throw createError;currentProfile=starter}
function openProfileEditor(){const form=document.getElementById('profile-form'),isBarista=currentRole==='barista';document.getElementById('profile-form-title').textContent=isBarista?'Build your barista profile':'Build your café profile';document.getElementById('profile-name-label').firstChild.textContent=isBarista?'Display name':'Café name';['skills-field','availability-field','experience-field','pay-field','video-field'].forEach(id=>document.getElementById(id).hidden=!isBarista&&['availability-field','pay-field'].includes(id));form.name.value=isBarista?(currentProfile.display_name||''):(currentProfile.cafe_name||'');form.location.value=currentProfile.location||'';form.bio.value=currentProfile.bio||'';form.skills.value=(currentProfile.skills||[]).join(', ');form.availability.value=currentProfile.availability||'';form.experience.value=currentProfile.experience||'';form.pay_expectation.value=currentProfile.pay_expectation||'';document.getElementById('profile-status').textContent='';document.getElementById('profile-dialog').showModal()}
document.getElementById('profile-cancel').onclick=()=>document.getElementById('profile-dialog').close();
document.getElementById('profile-form').onsubmit=async event=>{event.preventDefault();const form=event.currentTarget,button=form.querySelector('[type="submit"]'),status=document.getElementById('profile-status');button.disabled=true;button.textContent='Saving…';status.textContent='';try{const data=new FormData(form),isBarista=currentRole==='barista';let videoPath=currentProfile.video_path||null;const video=data.get('video');if(video&&video.size){if(video.size>52428800)throw new Error('Video must be smaller than 50 MB.');const ext=(video.name.split('.').pop()||'mp4').toLowerCase(),path=`${currentUser.id}/coffee-showcase.${ext}`;const {error:uploadError}=await activeClient.storage.from('coffee-videos').upload(path,video,{upsert:true,contentType:video.type});if(uploadError)throw uploadError;videoPath=path}const payload={id:currentUser.id,role:currentRole,display_name:isBarista?String(data.get('name')).trim():null,cafe_name:isBarista?null:String(data.get('name')).trim(),location:String(data.get('location')).trim(),bio:String(data.get('bio')).trim(),skills:String(data.get('skills')).split(',').map(x=>x.trim()).filter(Boolean),availability:isBarista?String(data.get('availability')).trim():null,experience:String(data.get('experience')).trim(),pay_expectation:isBarista?String(data.get('pay_expectation')).trim():null,video_path:videoPath,updated_at:new Date().toISOString()};const {error}=await activeClient.from('profiles').upsert(payload);if(error)throw error;currentProfile={...currentProfile,...payload};status.textContent='Profile saved! Your strength is now '+profileStrength()+'%.';setTimeout(()=>{document.getElementById('profile-dialog').close();openSection(currentSection,currentView,currentRole)},650)}catch(error){status.textContent=error.message||'We could not save your profile.'}finally{button.disabled=false;button.textContent='Save profile'}};
const withTimeout=(promise,ms,message)=>Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error(message)),ms))]);
async function fetchConfig(){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),10000);try{const response=await fetch('/api/config',{headers:{Accept:'application/json'},cache:'no-store',signal:controller.signal});const config=await response.json().catch(()=>({}));if(!response.ok)throw new Error(config.error||'The account service is unavailable.');if(!config.supabaseUrl||!config.supabasePublishableKey)throw new Error('The account service returned incomplete configuration.');return config}finally{clearTimeout(timer)}}
function showStartupError(message){document.getElementById('loading-message').textContent=message;document.getElementById('loading-actions').hidden=false}
async function start(){try{if(!window.supabase?.createClient)throw new Error('The account service did not load. Check your connection and try again.');const config=await fetchConfig();const client=window.supabase.createClient(config.supabaseUrl,config.supabasePublishableKey);const result=await withTimeout(client.auth.getSession(),10000,'Checking your login took too long.');if(result.error)throw result.error;const session=result.data.session;if(!session){location.replace('/?login=required');return}const role=session.user.user_metadata?.role==='cafe_owner_manager'?'cafe_owner_manager':'barista';const view=views[role];activeClient=client;currentUser=session.user;currentRole=role;currentView=view;await withTimeout(loadProfile(),10000,'Loading your profile took too long.');await withTimeout(loadMarketplaceData(),10000,'Loading marketplace activity took too long.');document.getElementById('email').textContent=session.user.email||'';document.getElementById('role-badge').textContent=view.label;document.getElementById('menu').innerHTML=view.menu.map((x,i)=>`<button class="${i?'':'active'}" data-section="${x}">${x}</button>`).join('');document.getElementById('menu').onclick=event=>{const button=event.target.closest('button[data-section]');if(button)openSection(button.dataset.section,view,role)};openSection('Overview',view,role);document.getElementById('app').hidden=false;document.getElementById('loading').hidden=true;window.scrollTo(0,0);document.getElementById('logout').onclick=async()=>{await client.auth.signOut();location.replace('/')};client.auth.onAuthStateChange(event=>{if(event==='SIGNED_OUT')location.replace('/')})}catch(error){console.error('Dashboard startup failed:',error);showStartupError(error.name==='AbortError'?'The account service took too long to respond. Please try again.':error.message||'We could not open your dashboard. Please try again.')}}
start();
</script>
</body>
