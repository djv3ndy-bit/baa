<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Your BaristaMatch dashboard.">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32-v2.png">
<title>Dashboard — BaristaMatch</title>
<style>
:root{--brown:#321708;--caramel:#a95820;--cream:#f8f3ed;--green:#287443;--muted:#746a61;--line:#e7ddd2;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:#1c130e;font-family:Inter,Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.side{background:var(--brown);color:#fff;padding:25px 18px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;margin:0 8px 32px}.brand i{background:#fff1;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-style:normal}.brand b{color:#e89a62}.menu{display:grid;gap:7px}.menu button{border:0;background:transparent;color:#eadfd5;text-align:left;padding:12px 14px;border-radius:10px;font-weight:700}.menu button.active,.menu button:hover{background:#fff;color:var(--brown)}.sidefoot{margin-top:auto;padding:16px 10px 0;border-top:1px solid #ffffff21}.sidefoot small{display:block;color:#d5c2b4;margin-bottom:12px;overflow:hidden;text-overflow:ellipsis}.logout{border:1px solid #ffffff55;background:transparent;color:white;padding:9px 13px;border-radius:9px}.main{min-width:0}.top{min-height:78px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:16px 30px}.top h1{margin:0;font-family:Georgia,serif;font-size:28px}.rolebadge{background:#f4e7dc;color:#7e3f18;padding:8px 12px;border-radius:99px;font-size:12px;font-weight:800}.content{padding:28px 30px 50px;max-width:1300px;margin:auto}.welcome{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:24px}.welcome h2{font-size:28px;margin:0 0 7px}.welcome p{margin:0;color:var(--muted)}.primary{border:0;background:var(--brown);color:#fff;padding:12px 17px;border-radius:10px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 8px 28px #3217080a}.stat span{font-size:13px;color:var(--muted);font-weight:700}.stat strong{display:block;font-size:30px;margin-top:8px}.grid{display:grid;grid-template-columns:1.4fr .85fr;gap:18px}.card h3{margin:0 0 16px}.item{display:flex;gap:13px;align-items:center;padding:14px 0;border-top:1px solid #eee4da}.item:first-of-type{border-top:0}.avatar{width:42px;height:42px;border-radius:12px;background:#f3e6dc;display:grid;place-items:center;font-size:20px;flex:0 0 auto}.itemtext{min-width:0;flex:1}.itemtext b,.itemtext small{display:block}.itemtext small{color:var(--muted);margin-top:4px}.pill{font-size:11px;font-weight:800;color:var(--green);background:#e7f4ea;padding:6px 8px;border-radius:99px}.progress{height:9px;background:#eee5dd;border-radius:99px;overflow:hidden;margin:12px 0 8px}.progress i{display:block;height:100%;width:35%;background:var(--caramel)}.empty{color:var(--muted);line-height:1.6}.loading{min-height:100vh;display:grid;place-items:center;font-weight:700;color:var(--muted)}
@media(max-width:900px){.shell{grid-template-columns:1fr}.side{padding:14px;flex-direction:row;align-items:center;gap:12px}.brand{margin:0 auto 0 0}.menu{display:none}.sidefoot{margin:0;padding:0;border:0;display:flex;align-items:center;gap:8px}.sidefoot small{display:none}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:560px){.top,.content{padding-left:16px;padding-right:16px}.top h1{font-size:23px}.welcome{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr 1fr}.stat strong{font-size:25px}.brand span{font-size:18px}}
</style>
</head>
<body>
<div class="loading" id="loading">Opening your BaristaMatch workspace…</div>
<div class="shell" id="app" hidden>
  <aside class="side"><a class="brand" href="/"><i>☕</i><span>Barista<b>Match</b></span></a><nav class="menu" id="menu"></nav><div class="sidefoot"><small id="email"></small><button class="logout" id="logout">Log out</button></div></aside>
  <main class="main"><header class="top"><h1>Dashboard</h1><span class="rolebadge" id="role-badge"></span></header><section class="content" id="content"></section></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.102.0/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
<script>
const views={
barista:{label:'Barista account',menu:['Overview','Find Jobs','Matches','Messages','My Profile'],html:`<div class="welcome"><div><h2>Welcome back</h2><p>Your next great café opportunity starts here.</p></div><button class="primary">Complete your profile</button></div><div class="stats"><article class="card stat"><span>Profile strength</span><strong>35%</strong></article><article class="card stat"><span>New jobs</span><strong>0</strong></article><article class="card stat"><span>Matches</span><strong>0</strong></article><article class="card stat"><span>Messages</span><strong>0</strong></article></div><div class="grid"><article class="card"><h3>Recommended opportunities</h3><p class="empty">New local café positions that fit your availability and skills will appear here.</p><div class="item"><div class="avatar">☕</div><div class="itemtext"><b>Build your profile to start matching</b><small>Add your experience, skills, location, desired pay, and availability.</small></div><span class="pill">Next step</span></div></article><article class="card"><h3>Profile progress</h3><b>Let cafés discover you</b><div class="progress"><i></i></div><p class="empty">Add a photo, work history, skills, and weekly availability to improve your matches.</p></article></div>`},
cafe_owner_manager:{label:'Café owner / manager',menu:['Overview','Job Posts','Candidates','Matches','Messages','Café Profile'],html:`<div class="welcome"><div><h2>Welcome to your hiring workspace</h2><p>Post roles, review baristas, and manage every conversation.</p></div><button class="primary">Post a job</button></div><div class="stats"><article class="card stat"><span>Active jobs</span><strong>0</strong></article><article class="card stat"><span>New candidates</span><strong>0</strong></article><article class="card stat"><span>Matches</span><strong>0</strong></article><article class="card stat"><span>Messages</span><strong>0</strong></article></div><div class="grid"><article class="card"><h3>Hiring activity</h3><p class="empty">Candidates and matches will appear here after you publish your first position.</p><div class="item"><div class="avatar">📋</div><div class="itemtext"><b>Create your first job post</b><small>Add pay, tips, schedule, location, and required coffee skills.</small></div><span class="pill">Get started</span></div></article><article class="card"><h3>Café setup</h3><b>Make your café stand out</b><div class="progress"><i></i></div><p class="empty">Add your café name, logo, location, team culture, and photos before reviewing candidates.</p></article></div>`}}
async function start(){try{const response=await fetch('/api/config',{cache:'no-store'});if(!response.ok)throw new Error();const config=await response.json();const client=supabase.createClient(config.supabaseUrl,config.supabasePublishableKey);const {data:{session}}=await client.auth.getSession();if(!session){location.replace('/?login=required');return}const role=session.user.user_metadata?.role==='cafe_owner_manager'?'cafe_owner_manager':'barista';const view=views[role];document.getElementById('email').textContent=session.user.email;document.getElementById('role-badge').textContent=view.label;document.getElementById('menu').innerHTML=view.menu.map((x,i)=>`<button class="${i?'':'active'}">${x}</button>`).join('');document.getElementById('content').innerHTML=view.html;document.getElementById('loading').hidden=true;document.getElementById('app').hidden=false;document.getElementById('logout').onclick=async()=>{await client.auth.signOut();location.replace('/')};client.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT')location.replace('/')})}catch(error){document.getElementById('loading').textContent='We could not open your dashboard. Please refresh and try again.'}}
start();
</script>
</body>
</html>
