<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Returning to BaristaMatch</title>
  <style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;background:#fff4e8;color:#321708;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center}.card{width:min(390px,100%);padding:34px 24px;border:1px solid #eadfd5;border-radius:26px;background:#fff;box-shadow:0 18px 50px #32170818}.logo{width:88px;height:88px;object-fit:contain;margin:0 auto 12px}h1{margin:0;font-family:Georgia,serif;font-size:28px}p{margin:10px 0 22px;color:#746a61;line-height:1.5}.button{display:flex;min-height:52px;align-items:center;justify-content:center;border-radius:10px;background:#a9571f;color:#fff;text-decoration:none;font-weight:800}</style>
  <script defer src="/analytics.js"></script>
</head>
<body>
  <main class="card">
    <img class="logo" src="/assets/favicon-transparent-v2.png" alt="">
    <h1>Returning to BaristaMatch</h1>
    <p id="status">Your secure billing session is complete. Opening the app…</p>
    <a class="button" id="open-app" href="baristamatch://settings?billing=complete">Open BaristaMatch</a>
  </main>
  <script>
    (()=>{
      const result=new URLSearchParams(location.search).get('billing');
      const allowed=new Set(['success','canceled','portal']);
      const value=allowed.has(result)?result:'complete';
      const appUrl='baristamatch://settings?billing='+encodeURIComponent(value);
      document.getElementById('open-app').href=appUrl;
      location.replace(appUrl);
      setTimeout(()=>document.getElementById('status').textContent='Tap below to return to the app.',1200);
    })();
  </script>
</body>
</html>
