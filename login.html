<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Log in to BaristaMatch."><link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32-v2.png"><title>Log in — BaristaMatch</title>
<style>:root{--caramel:#e78b4f;--dark:#12100f;--soft:#1d1917;--muted:#b9afa8;--line:#70645d;--green:#5bd487}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;min-height:100vh;background:var(--dark);color:#fff;font-family:Arial,sans-serif}a{color:inherit}.page{width:min(440px,calc(100% - 40px));margin:0 auto;padding:42px 0 70px}.brand{display:flex;justify-content:center;align-items:center;gap:10px;text-decoration:none;font-size:21px;font-weight:800;margin-bottom:35px}.brand img{width:46px;height:46px;object-fit:contain}.brand b{color:var(--caramel)}h1{font:700 46px/1.08 Georgia,serif;text-align:center;margin:0 0 34px}.sub{text-align:center;color:var(--muted);line-height:1.5;margin:-18px 0 28px}.field{display:block;font-size:13px;font-weight:800;margin:16px 0}.field input{display:block;width:100%;margin-top:8px;padding:15px 14px;border:1px solid var(--line);border-radius:6px;background:var(--soft);color:#fff;font:inherit}.field input:focus{outline:2px solid var(--caramel);outline-offset:1px}.button{width:100%;border-radius:999px;padding:15px;border:0;font:800 15px Arial,sans-serif;cursor:pointer}.primary{background:var(--caramel);color:#211108}.social{border:1px solid var(--line);background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;gap:13px}.google-g{font:900 19px Arial;color:#4285f4}.divider{display:flex;align-items:center;gap:14px;margin:22px 0;color:var(--muted);font-weight:700}.divider:before,.divider:after{content:"";height:1px;background:#4b423d;flex:1}.signup{text-align:center;color:var(--muted);margin-top:42px}.signup a{display:block;color:#fff;font-weight:800;margin-top:11px}.forgot{display:block;text-align:right;color:#fff;font-size:13px;font-weight:700;margin:-4px 0 20px}.back{display:block;border:0;background:transparent;color:var(--muted);text-decoration:underline;margin:20px auto 0;cursor:pointer}.status{min-height:22px;text-align:center;color:var(--green);font-weight:700;font-size:14px;line-height:1.45;margin:16px 0}.status.error{color:#ff8c83}.secure{text-align:center;color:#857b75;font-size:11px;line-height:1.5;margin-top:45px}.button:disabled{opacity:.58;cursor:wait}@media(max-width:520px){.page{padding-top:28px}h1{font-size:38px}.brand{margin-bottom:28px}}</style></head><body><main class="page"><a class="brand" href="/"><img src="/assets/favicon-transparent-v2.png" alt=""><span>Barista<b>Match</b></span></a>
<section id="email-step"><h1>Welcome back</h1><label class="field">Email address<input id="email" type="email" autocomplete="email" required></label><button class="button primary" id="continue" type="button">Continue</button><div class="divider">or</div><button class="button social" id="google" type="button"><span class="google-g">G</span>Continue with Google</button><p class="signup">Don’t have an account?<a href="/signup.html">Sign up</a></p></section>
<section id="password-step" hidden><h1>Enter your password</h1><p class="sub" id="email-summary"></p><form id="login-form"><label class="field">Password<input id="password" type="password" autocomplete="current-password" required></label><a class="forgot" href="/?forgot=1">Forgot password?</a><button class="button primary" id="login-button" type="submit">Log in</button></form><button class="back" id="back" type="button">← Use a different email</button></section><p class="status" id="status" role="status" aria-live="polite"></p><p class="secure">Secure login powered by Supabase. BaristaMatch never sees your Google password.</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.102.0/dist/umd/supabase.min.js" crossorigin="anonymous"></script><script>const emailStep=document.getElementById('email-step'),passwordStep=document.getElementById('password-step'),email=document.getElementById('email'),password=document.getElementById('password'),status=document.getElementById('status');let client;const setStatus=(message='',error=false)=>{status.textContent=message;status.classList.toggle('error',error)};function showPassword(){if(!email.reportValidity())return;emailStep.hidden=true;passwordStep.hidden=false;document.getElementById('email-summary').textContent=email.value.trim();setStatus();password.focus()}async function initialize(){try{const response=await fetch('/api/config',{cache:'no-store'}),config=await response.json().catch(()=>({}));if(!response.ok||!config.supabaseUrl||!config.supabasePublishableKey)throw new Error('Login is temporarily unavailable. Please try again shortly.');client=window.supabase.createClient(config.supabaseUrl,config.supabasePublishableKey);const {data:{session}}=await client.auth.getSession();if(session)location.replace('/dashboard.html')}catch(error){setStatus(error.message||'Login is temporarily unavailable.',true)}}document.getElementById('continue').onclick=showPassword;email.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();showPassword()}});document.getElementById('back').onclick=()=>{passwordStep.hidden=true;emailStep.hidden=false;password.value='';setStatus();email.focus()};document.getElementById('google').onclick=async event=>{if(!client)return setStatus('Login is still loading. Please try again.',true);event.currentTarget.disabled=true;const {error}=await client.auth.signInWithOAuth({provider:'google',options:{redirectTo:'https://www.baristajobmatch.com/dashboard.html'}});event.currentTarget.disabled=false;if(error)setStatus('Google login could not start. Please try email and password.',true)};document.getElementById('login-form').onsubmit=async event=>{event.preventDefault();if(!client)return setStatus('Login is still loading. Please try again.',true);const button=document.getElementById('login-button');button.disabled=true;button.textContent='Logging in…';const {error}=await client.auth.signInWithPassword({email:email.value.trim(),password:password.value});button.disabled=false;button.textContent='Log in';if(error)return setStatus('The email or password is incorrect. Please try again.',true);location.replace('/dashboard.html')};initialize();</script></body></html>
