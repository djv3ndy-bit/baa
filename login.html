<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Log in to BaristaMatch."><link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32-v2.png"><title>Log in — BaristaMatch</title>
<style>:root{--brown:#321708;--caramel:#a95820;--cream:#fbf7f1;--muted:#746a61;--line:#e7ddd2;--green:#287443}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#fbf7f1,#f2e5d9);color:#1c130e;font-family:Arial,sans-serif}a{color:inherit}.page{width:min(500px,calc(100% - 40px));margin:48px auto 70px;padding:32px;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 22px 60px #32170814}.brand{display:flex;justify-content:center;align-items:center;gap:10px;text-decoration:none;font-size:21px;font-weight:800;margin-bottom:30px}.brand img{width:46px;height:46px;object-fit:contain}.brand b{color:var(--caramel)}h1{font:700 42px/1.08 Georgia,serif;text-align:center;margin:0 0 30px}.sub{text-align:center;color:var(--muted);line-height:1.5;margin:-18px 0 28px}.field{display:block;font-size:13px;font-weight:800;margin:16px 0}.field input{display:block;width:100%;margin-top:8px;padding:15px 14px;border:1px solid #cdbfb3;border-radius:10px;background:#fff;color:#1c130e;font:inherit}.field input:focus{outline:2px solid var(--caramel);outline-offset:1px}.button{width:100%;border-radius:11px;padding:15px;border:0;font:800 15px Arial,sans-serif;cursor:pointer}.primary{background:var(--brown);color:#fff}.social{border:1px solid #bfae9f;background:#fff;color:var(--brown);display:flex;align-items:center;justify-content:center;gap:13px}.google-g{font:900 19px Arial;color:#4285f4}.divider{display:flex;align-items:center;gap:14px;margin:22px 0;color:var(--muted);font-weight:700}.divider:before,.divider:after{content:"";height:1px;background:var(--line);flex:1}.signup{text-align:center;color:var(--muted);margin-top:32px}.signup a{display:block;color:var(--caramel);font-weight:800;margin-top:10px}.forgot{display:block;text-align:right;color:var(--caramel);font-size:13px;font-weight:700;margin:-4px 0 20px}.back{display:block;border:0;background:transparent;color:var(--muted);text-decoration:underline;margin:20px auto 0;cursor:pointer}.status{min-height:22px;text-align:center;color:var(--green);font-weight:700;font-size:14px;line-height:1.45;margin:16px 0}.status.error{color:#a52a2a}.secure{text-align:center;color:#8b8078;font-size:11px;line-height:1.5;margin:34px 0 0}.button:disabled{opacity:.58;cursor:wait}@media(max-width:520px){.page{width:100%;min-height:100vh;margin:0;padding:28px 20px;border:0;border-radius:0;box-shadow:none}h1{font-size:36px}.brand{margin-bottom:28px}}</style></head><body><main class="page"><a class="brand" href="/"><img src="/assets/favicon-transparent-v2.png" alt=""><span>Barista<b>Match</b></span></a>
<section><h1>Welcome back</h1><form id="login-form"><label class="field">Email address<input id="email" type="email" autocomplete="email" required></label><label class="field">Password<input id="password" type="password" autocomplete="current-password" required></label><a class="forgot" id="forgot-password" href="#">Forgot password?</a><button class="button primary" id="login-button" type="submit">Log in</button></form><div class="divider">or</div><button class="button social" id="google" type="button"><span class="google-g">G</span>Continue with Google</button><p class="signup">Don’t have an account?<a href="/signup.html">Sign up</a></p></section><p class="status" id="status" role="status" aria-live="polite"></p><p class="secure">Secure login powered by Supabase. BaristaMatch never sees your Google password.</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.102.0/dist/umd/supabase.min.js" crossorigin="anonymous"></script><script>const email=document.getElementById('email'),password=document.getElementById('password'),status=document.getElementById('status');let client;const setStatus=(message='',error=false)=>{status.textContent=message;status.classList.toggle('error',error)};async function initialize(){try{const response=await fetch('/api/config',{cache:'no-store'}),config=await response.json().catch(()=>({}));if(!response.ok||!config.supabaseUrl||!config.supabasePublishableKey)throw new Error('Login is temporarily unavailable. Please try again shortly.');client=window.supabase.createClient(config.supabaseUrl,config.supabasePublishableKey);const {data:{session}}=await client.auth.getSession();if(session)location.replace('/dashboard.html')}catch(error){setStatus(error.message||'Login is temporarily unavailable.',true)}}document.getElementById('forgot-password').onclick=async event=>{event.preventDefault();if(!client)return setStatus('Login is still loading. Please try again.',true);const address=email.value.trim();if(!address){email.focus();return setStatus('Enter your email address, then choose Forgot password again.',true)}const link=event.currentTarget;link.style.pointerEvents='none';setStatus('Sending your reset link…');const {error}=await client.auth.resetPasswordForEmail(address,{redirectTo:'https://www.baristajobmatch.com/reset-password.html'});link.style.pointerEvents='';if(error)return setStatus('We could not send a reset link. Check the email address and try again.',true);setStatus('Password reset link sent. Check your email.')};document.getElementById('google').onclick=async event=>{if(!client)return setStatus('Login is still loading. Please try again.',true);event.currentTarget.disabled=true;const {error}=await client.auth.signInWithOAuth({provider:'google',options:{redirectTo:'https://www.baristajobmatch.com/dashboard.html'}});event.currentTarget.disabled=false;if(error)setStatus('Google login could not start. Please try email and password.',true)};document.getElementById('login-form').onsubmit=async event=>{event.preventDefault();if(!client)return setStatus('Login is still loading. Please try again.',true);const button=document.getElementById('login-button');button.disabled=true;button.textContent='Logging in…';const {error}=await client.auth.signInWithPassword({email:email.value.trim(),password:password.value});button.disabled=false;button.textContent='Log in';if(error)return setStatus('The email or password is incorrect. Please try again.',true);location.replace('/dashboard.html')};initialize();</script><!-- production verified --></body></html>
