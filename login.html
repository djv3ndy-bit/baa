<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Log in to BaristaMatch."><link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32-v2.png"><title>Log in — BaristaMatch</title><style>@media(max-width:350px){.social-stack{grid-template-columns:1fr!important}.social{font-size:13px!important}}</style>
<style>:root{--brown:#321708;--caramel:#a95820;--cream:#fff4e8;--muted:#746a61;--line:#ded7d1;--green:#287443}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 10%,#fffaf3 0,#f6e7d9 48%,#ead3c1 100%);color:#1c130e;font-family:Arial,sans-serif}a{color:inherit}.page{width:min(540px,calc(100% - 36px));margin:34px auto 54px;background:var(--cream);border:1px solid #decfc2;border-radius:30px;box-shadow:0 26px 80px #32170822;overflow:hidden}.auth-hero{min-height:310px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:34px 24px 48px;position:relative;overflow:hidden}.auth-hero:after{content:"";position:absolute;width:620px;height:300px;border-radius:50%;background:#f3d9c2;opacity:.43;bottom:-220px}.brand{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-decoration:none}.brand img{width:116px;height:116px;object-fit:contain}.brand-title{font:700 43px/1.05 Georgia,serif;letter-spacing:-1.5px;color:#4a2412;margin-top:2px}.brand-title b{color:#b86525;font-weight:700}.tagline{position:relative;z-index:1;font-size:18px;margin:10px 0 0;color:#2f211a}.accent-line{position:relative;z-index:1;width:80px;height:3px;border-radius:3px;background:#b86525;margin-top:22px}.auth-sheet{position:relative;background:#fff;border-radius:30px 30px 0 0;padding:16px 34px 30px;margin-top:-28px}.handle{width:50px;height:5px;border-radius:5px;background:#c9c7c5;margin:0 auto 21px}.field{display:block;font-size:14px;font-weight:800;margin:14px 0}.input-shell{display:flex;align-items:center;width:100%;height:58px;margin-top:9px;border:1px solid #d7d4d1;border-radius:10px;background:#fff}.field-icon{width:50px;text-align:center;color:var(--caramel);font-size:22px}.input-shell input{min-width:0;flex:1;height:100%;border:0;background:transparent;color:#1c130e;font:16px Arial,sans-serif;padding:0 12px 0 0;outline:0}.input-shell:focus-within{border-color:#b86525;box-shadow:0 0 0 2px #b8652522}.password-shell input{padding-right:0}.eye-button{width:48px;height:100%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer}.eye{width:23px;height:15px;border:2px solid #4a4642;border-radius:50%;display:grid;place-items:center}.eye:after{content:"";width:6px;height:6px;border-radius:50%;background:#4a4642}.button{width:100%;border-radius:9px;padding:16px;border:0;font:800 15px Arial,sans-serif;cursor:pointer}.primary{background:linear-gradient(90deg,#a9561f,#b66a2d);color:#fff;margin-top:7px}.forgot{display:block;text-align:right;color:var(--caramel);font-size:12px;font-weight:700;margin:-5px 0 14px}.divider{display:flex;align-items:center;gap:14px;margin:20px 0;color:var(--muted)}.divider:before,.divider:after{content:"";height:1px;background:var(--line);flex:1}.social-stack{display:grid;grid-template-columns:1fr 1fr;gap:12px}.social{min-width:0;border:1px solid #d5d1ce;background:#fff;color:#171311;display:flex;align-items:center;justify-content:center;gap:9px;padding-inline:10px;font-size:12px}.google-g{font:900 20px Arial;color:#4285f4}.apple-mark{display:block;width:21px;height:21px;flex:0 0 21px;color:#111}.apple-mark path{fill:currentColor}.signup{text-align:center;margin:24px 0 0}.signup a{color:var(--caramel);font-size:16px;font-weight:800;text-decoration:none}.status{min-height:20px;text-align:center;color:var(--green);font-weight:700;font-size:13px;line-height:1.4;margin:13px 0 0}.status.error{color:#a52a2a}.secure{text-align:center;color:#8b8078;font-size:10px;line-height:1.5;margin:16px 0 0}.button:disabled{opacity:.58;cursor:wait}@media(max-width:560px){body{background:var(--cream)}.page{width:100%;min-height:100vh;margin:0;border:0;border-radius:0;box-shadow:none}.auth-hero{min-height:310px}.auth-sheet{padding-inline:24px;min-height:calc(100vh - 282px)}.brand-title{font-size:38px}.social-stack{gap:9px}.social{font-size:11px}}</style></head><body><main class="page">
<header class="auth-hero"><a class="brand" href="/"><img src="/assets/favicon-transparent-v2.png" alt=""><span class="brand-title">Barista <b>Job</b> Match</span></a><p class="tagline">Where cafés meet baristas.</p><span class="accent-line"></span></header><section class="auth-sheet"><div class="handle"></div><form id="login-form"><label class="field">Email<div class="input-shell"><span class="field-icon" aria-hidden="true">✉</span><input id="email" type="email" autocomplete="email" placeholder="Enter your email" required></div></label><label class="field">Password<div class="input-shell password-shell"><span class="field-icon" aria-hidden="true">▣</span><input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" required><button class="eye-button" id="toggle-password" type="button" aria-label="Show password" onclick="const input=document.getElementById('password'),reveal=input.type==='password';input.type=reveal?'text':'password';this.setAttribute('aria-label',reveal?'Hide password':'Show password')"><span class="eye" aria-hidden="true"></span></button></div></label><a class="forgot" id="forgot-password" href="#">Forgot password?</a><button class="button primary" id="login-button" type="submit">Log in</button></form><div class="divider">or</div><div class="social-stack"><button class="button social" id="google" type="button"><span class="google-g">G</span>Continue with Google</button><button class="button social" id="apple" type="button"><svg class="apple-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.22.07 2.07.66 2.79.71 1.08-.22 2.11-.85 3.26-.77 1.38.11 2.42.66 3.11 1.64-2.84 1.7-2.17 5.44.44 6.49-.52 1.37-1.2 2.73-1.6 4.9zM12.03 7.25C11.88 5.21 13.55 3.53 15.45 3.37c.26 2.36-2.14 4.13-3.42 3.88z"/></svg>Continue with Apple</button></div><p class="signup"><a href="/signup.html">Create an account</a></p><p class="status" id="status" role="status" aria-live="polite"></p><p class="secure">Secure login powered by Supabase. BaristaMatch never sees your Google or Apple password.</p></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.102.0/dist/umd/supabase.min.js" crossorigin="anonymous"></script><script>const email=document.getElementById('email'),password=document.getElementById('password'),status=document.getElementById('status');let client;const setStatus=(message='',error=false)=>{status.textContent=message;status.classList.toggle('error',error)};async function routeSession(session){const {data:profile}=await client.from('profiles').select('role').eq('id',session.user.id).maybeSingle();if(profile?.role==='cafe_owner_manager'){const {data:subscription}=await client.from('cafe_subscriptions').select('user_id').eq('user_id',session.user.id).maybeSingle();if(!subscription)return location.replace('/cafe-trial.html')}location.replace('/dashboard.html')}async function initialize(){try{const response=await fetch('/api/config',{cache:'no-store'}),config=await response.json().catch(()=>({}));if(!response.ok||!config.supabaseUrl||!config.supabasePublishableKey)throw new Error('Login is temporarily unavailable. Please try again shortly.');client=window.supabase.createClient(config.supabaseUrl,config.supabasePublishableKey);const {data:{session}}=await client.auth.getSession();if(session)await routeSession(session)}catch(error){setStatus(error.message||'Login is temporarily unavailable.',true)}}document.getElementById('forgot-password').onclick=async event=>{event.preventDefault();if(!client)return setStatus('Login is still loading. Please try again.',true);const address=email.value.trim();if(!address){email.focus();return setStatus('Enter your email address, then choose Forgot password again.',true)}const link=event.currentTarget;link.style.pointerEvents='none';setStatus('Sending your reset link…');const {error}=await client.auth.resetPasswordForEmail(address,{redirectTo:'https://www.baristajobmatch.com/reset-password.html'});link.style.pointerEvents='';if(error)return setStatus('We could not send a reset link. Check the email address and try again.',true);setStatus('Password reset link sent. Check your email.')};document.getElementById('google').onclick=async event=>{if(!client)return setStatus('Login is still loading. Please try again.',true);event.currentTarget.disabled=true;const {error}=await client.auth.signInWithOAuth({provider:'google',options:{redirectTo:'https://www.baristajobmatch.com/dashboard.html'}});event.currentTarget.disabled=false;if(error)setStatus('Google login could not start. Please try email and password.',true)};document.getElementById('apple').onclick=async event=>{if(!client)return setStatus('Login is still loading. Please try again.',true);event.currentTarget.disabled=true;const {error}=await client.auth.signInWithOAuth({provider:'apple',options:{redirectTo:'https://www.baristajobmatch.com/dashboard.html'}});event.currentTarget.disabled=false;if(error)setStatus('Apple login could not start. Please try email and password.',true)};document.getElementById('login-form').onsubmit=async event=>{event.preventDefault();if(!client)return setStatus('Login is still loading. Please try again.',true);const button=document.getElementById('login-button');button.disabled=true;button.textContent='Logging in…';const {data,error}=await client.auth.signInWithPassword({email:email.value.trim(),password:password.value});button.disabled=false;button.textContent='Log in';if(error)return setStatus('The email or password is incorrect. Please try again.',true);const {data:profile}=await client.from('profiles').select('role').eq('id',data.user.id).maybeSingle();if(profile?.role==='cafe_owner_manager'){const {data:subscription}=await client.from('cafe_subscriptions').select('user_id').eq('user_id',data.user.id).maybeSingle();if(!subscription)return location.replace('/cafe-trial.html')}location.replace('/dashboard.html')};initialize();</script><!-- production verified --></body></html>
